<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>Fabulous Village &mdash; Power stations</title>
<!-- version = "20260904-000000" -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

:root{
  --cream:#ffffff;
  --paper:#ffffff;
  --panel:#f2f2f2;
  --ink:#161616;
  --muted:#6f6f6f;
  --line:#e7e7e7;
  --yellow:#f5e838;
  --yellow-dark:#e3d520;
  --power:#2f6f8f;
  --power-dark:#1d4a63;
  --pink:#ef4d96;
  --shadow: 0 6px 18px rgba(22,22,22,0.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Poppins',sans-serif;
  background:var(--cream);
  color:var(--ink);
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
}

header{
  background:var(--paper);
  color:var(--ink);
  padding:10px 18px;
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  flex-shrink:0;
  border-bottom:1px solid var(--line);
}
header .logo-badge{
  background:var(--yellow);
  color:var(--ink);
  padding:6px 14px;
  border-radius:8px;
  display:flex;
  flex-direction:column;
  line-height:1.15;
}
header h1{
  font-family:'Poppins',sans-serif;
  font-weight:800;
  font-size:1.05rem;
  margin:0;
  letter-spacing:-0.01em;
}
header .tag{
  font-size:0.68rem;
  color:rgba(22,22,22,0.65);
  letter-spacing:0.04em;
}
header .backlink{
  margin-left:auto;
  font-size:0.78rem;
  font-weight:600;
  color:var(--muted);
  text-decoration:none;
  border:1.5px solid var(--line);
  padding:7px 12px;
  border-radius:10px;
}
header .backlink:hover{ background:var(--panel); color:var(--ink); }

.layout{
  flex:1;
  display:grid;
  grid-template-columns: 340px 1fr;
  min-height:0;
}
@media (max-width: 860px){
  .layout{
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    overflow-y:auto;
  }
  .maparea{ height:56vh; }
  .sidebar{ max-height:none; }
}

.sidebar{
  background:var(--paper);
  border-right:1px solid var(--line);
  padding:16px 18px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.sidebar h2{
  font-size:0.72rem;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--muted);
  margin:0 0 8px;
  font-weight:700;
}
.field label{
  display:block;
  font-size:0.72rem;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--muted);
  margin-bottom:4px;
  font-weight:600;
}
input[type=text]{
  width:100%;
  padding:10px 12px;
  border:1.5px solid var(--line);
  border-radius:10px;
  font-family:'Poppins',sans-serif;
  font-weight:500;
  font-size:0.92rem;
  background:var(--panel);
  color:var(--ink);
}
input[type=text]:focus{ outline:none; border-color:var(--power); }
button{
  font-family:'Poppins',sans-serif;
  font-size:0.82rem;
  font-weight:600;
  border:1.5px solid var(--ink);
  background:var(--paper);
  color:var(--ink);
  padding:9px 10px;
  border-radius:10px;
  cursor:pointer;
  transition: all .15s ease;
}
button:hover{ background:var(--panel); }
button:disabled{ background:var(--panel); border-color:var(--line); color:var(--muted); cursor:not-allowed; }
.row{ display:flex; gap:8px; }
.row > *{ flex:1; }

label.chk{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:0.8rem;
  color:var(--muted);
  cursor:pointer;
}
label.chk input{ accent-color:var(--power); }

.pslist{
  border:1px solid var(--line);
  border-radius:10px;
  max-height:300px;
  overflow-y:auto;
}
.psrow{
  display:flex;
  align-items:baseline;
  gap:8px;
  padding:9px 11px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  font-size:0.85rem;
}
.psrow:last-child{ border-bottom:none; }
.psrow:hover{ background:var(--panel); }
.psrow.selected{ background:#e4eef4; }
.psrow .num{ font-weight:700; }
.psrow .meta{ margin-left:auto; font-size:0.72rem; color:var(--muted); }

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
  font-size:0.84rem;
  line-height:1.6;
}
.card b{ font-weight:700; }
.card .k{ color:var(--muted); }
.empty{ color:var(--muted); font-size:0.85rem; line-height:1.5; }

.summary{
  display:flex;
  background:var(--power);
  border-radius:12px;
  padding:12px 0;
  color:#fff;
}
.summary .stat{ flex:1 1 0; display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 12px; }
.summary .stat:not(:last-child){ border-right:1px solid rgba(255,255,255,0.25); }
.summary .stat .v{ font-weight:800; font-size:1.05rem; }
.summary .stat .l{ font-size:0.66rem; text-transform:uppercase; letter-spacing:0.05em; opacity:0.85; }

.steps{ list-style:none; margin:0; padding:0; }
.steps li{
  position:relative;
  padding:7px 0 7px 22px;
  font-size:0.82rem;
  border-left:2px solid var(--line);
  margin-left:6px;
}
.steps li:last-child{ border-left:2px solid transparent; }
.steps li::before{
  content:'';
  position:absolute;
  left:-6px; top:11px;
  width:9px;height:9px;
  border-radius:50%;
  background:var(--ink);
  border:2px solid var(--paper);
}
.steps li .street{ font-weight:600; }
.steps li .d{ color:var(--muted); font-size:0.76rem; }

.nearlist{ list-style:none; margin:6px 0 0; padding:0; font-size:0.8rem; }
.nearlist li{ display:flex; padding:3px 0; border-bottom:1px dashed var(--line); }
.nearlist li:last-child{ border-bottom:none; }
.nearlist li span:last-child{ margin-left:auto; color:var(--muted); }

.maparea{
  position:relative;
  background:#f1ece0;
  overflow:hidden;
  cursor:grab;
}
.maparea.dragging{ cursor:grabbing; }
.mapinner{
  position:absolute;
  top:0; left:0;
  transform-origin:0 0;
  touch-action:none;
}
.mapinner svg{ display:block; }

.zoomctrl{
  position:absolute;
  right:14px; bottom:14px;
  display:flex;
  flex-direction:column;
  gap:6px;
  z-index:5;
}
.zoomctrl button{
  width:36px;height:36px;
  padding:0;
  font-size:1.1rem;
  border-radius:50%;
  background:var(--paper);
  box-shadow:var(--shadow);
}
.zoomctrl button:hover{ background:var(--yellow); }

.disclaimer{
  font-size:0.7rem;
  color:var(--muted);
  line-height:1.5;
  border-top:1px dashed var(--line);
  padding-top:10px;
}
datalist{ display:none; }
</style>
</head>
<body>

<header>
  <div class="logo-badge">
    <h1>Fabulous Village</h1>
    <span class="tag">Power stations &amp; switch boxes</span>
  </div>
</header>

<div class="layout">
  <div class="sidebar">

    <div>
      <h2>Map</h2>
      <label class="chk"><input type="checkbox" id="toggleLabels"> Power station labels</label>
      <label class="chk"><input type="checkbox" id="togglePlots"> Show pitches as small dots</label>
    </div>

    <div class="disclaimer">The key for the box for the 13xx is at the EC reception</div>

  </div>

  <div class="maparea" id="maparea">
    <div class="mapinner" id="mapinner">

    </div>
    <div class="zoomctrl">
      <button id="zoomIn" title="Zoom in">+</button>
      <button id="zoomOut" title="Zoom out">&minus;</button>
      <button id="zoomReset" title="Reset view">&#10530;</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="map-svg.js"></script>
<script>

// The background map is injected before anything reads #mapSvg.
injectMapSvg();

const VBW = 1218.9, VBH = 870.236;

// ---------- plot categories ----------
// PLOTS holds three categories, distinguished by `color`:
//   yellow -> tour operator pitch
//   grey   -> hu OPENAIR pitch
//   power  -> power station / switch box
// This page just shows the power category on the map; the other two are
// optional faint context dots. There is no search, no route finder here —
// see the git history / README if that ever needs to come back.
const POWER_COLOR = 'power';
const POWER = PLOTS.filter(p => p.color === POWER_COLOR);
const GUEST_PLOTS = PLOTS.filter(p => p.color !== POWER_COLOR);

// ---------- DOM ----------
const maparea  = document.getElementById('maparea');
const mapinner = document.getElementById('mapinner');
const mapSvg   = document.getElementById('mapSvg');

let selectedPower = null;
let didDrag = false;

// ---------- overlay layers ----------
const contextLayer = document.createElementNS('http://www.w3.org/2000/svg','g');
contextLayer.setAttribute('id','contextLayer');
contextLayer.style.display = 'none';
const powerLayer = document.createElementNS('http://www.w3.org/2000/svg','g');
powerLayer.setAttribute('id','powerLayer');
mapSvg.appendChild(contextLayer);
mapSvg.appendChild(powerLayer);

function svgEl(tag, attrs){
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function renderContext(){
  contextLayer.innerHTML = '';
  GUEST_PLOTS.forEach(p=>{
    contextLayer.appendChild(svgEl('circle',{cx:p.x, cy:p.y, r:1.6, fill:'#161616', opacity:0.35}));
  });
}

function renderPower(){
  powerLayer.innerHTML = '';
  const showLabels = document.getElementById('toggleLabels').checked;
  if (!POWER.length){
    console.warn('No power stations in data.js yet (no plot with color:"power").');
  }
  POWER.forEach(p=>{
    const isSel = selectedPower && p.key === selectedPower.key;
    const s = isSel ? 13 : 9;
    const g = svgEl('g',{});
    g.appendChild(svgEl('rect',{
      x:p.x - s/2, y:p.y - s/2, width:s, height:s, rx:2,
      fill:'#2f6f8f',
      stroke: isSel ? '#ef4d96' : '#ffffff',
      'stroke-width': isSel ? 2.6 : 1.4,
      cursor:'pointer'
    }));
    if (showLabels){
      const t = svgEl('text',{
        x:p.x + s/2 + 3, y:p.y + 3,
        'font-size': isSel ? 11 : 9,
        'font-weight':700,
        fill:'#1d4a63',
        'font-family':'Poppins, sans-serif',
        stroke:'#ffffff','stroke-width':2.6,'paint-order':'stroke',
        'pointer-events':'none'
      });
      t.textContent = p.num;
      g.appendChild(t);
    }
    // Clicking a station just highlights it and zooms in — there's no side
    // panel to fill in, and no route to draw.
    g.addEventListener('click', (ev)=>{ ev.stopPropagation(); if (!didDrag) selectPower(p.key); });
    powerLayer.appendChild(g);
  });
}

function selectPower(key){
  selectedPower = POWER.find(p => p.key === key) || null;
  renderPower();
  if (selectedPower){
    fitToPoints([[selectedPower.x, selectedPower.y]], {minSpan:220, maxScale:3.4});
  }
}

// ---------- map toggles ----------
document.getElementById('toggleLabels').addEventListener('change', renderPower);
document.getElementById('togglePlots').addEventListener('change', (e)=>{
  contextLayer.style.display = e.target.checked ? '' : 'none';
});

// ---------- pan & zoom ----------
let scale=1, tx=0, ty=0;
let dragging=false, dragStartX=0, dragStartY=0, startTx=0, startTy=0;

function applyTransform(){
  mapinner.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
}

function fitView(){
  const rect = maparea.getBoundingClientRect();
  const pad = 20;
  const sx = (rect.width - pad*2) / VBW;
  const sy = (rect.height - pad*2) / VBH;
  scale = Math.min(sx, sy);
  tx = (rect.width - VBW*scale)/2;
  ty = (rect.height - VBH*scale)/2;
  applyTransform();
}

function fitToPoints(points, opts){
  if (!points || !points.length) return;
  const pad = (opts && opts.pad) || 70;
  const maxScale = (opts && opts.maxScale) || 3.2;
  const minSpan = (opts && opts.minSpan) || 120;

  const rect = maparea.getBoundingClientRect();
  if (!rect.width || !rect.height) return;

  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  points.forEach(p=>{
    minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]);
    minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]);
  });
  const w = Math.max(maxX - minX, minSpan);
  const h = Math.max(maxY - minY, minSpan);

  let newScale = Math.min((rect.width - pad*2) / w, (rect.height - pad*2) / h);
  newScale = Math.min(maxScale, Math.max(0.3, newScale));

  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  tx = rect.width/2 - cx*newScale;
  ty = rect.height/2 - cy*newScale;
  scale = newScale;
  applyTransform();
}

maparea.addEventListener('mousedown', (e)=>{
  dragging = true; didDrag = false;
  dragStartX = e.clientX; dragStartY = e.clientY;
  startTx = tx; startTy = ty;
  maparea.classList.add('dragging');
});
window.addEventListener('mousemove', (e)=>{
  if (!dragging) return;
  const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
  if (Math.abs(dx)>3 || Math.abs(dy)>3) didDrag = true;
  tx = startTx + dx; ty = startTy + dy;
  applyTransform();
});
window.addEventListener('mouseup', ()=>{
  dragging = false;
  maparea.classList.remove('dragging');
});

maparea.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const rect = maparea.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
  const newScale = Math.min(10, Math.max(0.3, scale*factor));
  const worldX = (mx - tx)/scale, worldY = (my - ty)/scale;
  tx = mx - worldX*newScale;
  ty = my - worldY*newScale;
  scale = newScale;
  applyTransform();
}, {passive:false});

document.getElementById('zoomIn').addEventListener('click', ()=>{
  const rect = maparea.getBoundingClientRect();
  const mx = rect.width/2, my = rect.height/2;
  const newScale = Math.min(10, scale*1.3);
  const worldX = (mx - tx)/scale, worldY = (my - ty)/scale;
  tx = mx - worldX*newScale; ty = my - worldY*newScale;
  scale = newScale; applyTransform();
});
document.getElementById('zoomOut').addEventListener('click', ()=>{
  const rect = maparea.getBoundingClientRect();
  const mx = rect.width/2, my = rect.height/2;
  const newScale = Math.max(0.3, scale/1.3);
  const worldX = (mx - tx)/scale, worldY = (my - ty)/scale;
  tx = mx - worldX*newScale; ty = my - worldY*newScale;
  scale = newScale; applyTransform();
});
document.getElementById('zoomReset').addEventListener('click', fitView);

// touch: single-finger pan, two-finger pinch
let touchStartDist = null, touchStartScale = 1, touchStartMid = null;
maparea.addEventListener('touchstart', (e)=>{
  if (e.touches.length === 1){
    dragging = true; didDrag = false;
    dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY;
    startTx = tx; startTy = ty;
  } else if (e.touches.length === 2){
    dragging = false;
    const [a,b] = e.touches;
    touchStartDist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    touchStartScale = scale;
    touchStartMid = {x:(a.clientX+b.clientX)/2, y:(a.clientY+b.clientY)/2};
  }
}, {passive:true});
maparea.addEventListener('touchmove', (e)=>{
  if (e.touches.length === 1 && dragging){
    const dx = e.touches[0].clientX - dragStartX, dy = e.touches[0].clientY - dragStartY;
    if (Math.abs(dx)>3 || Math.abs(dy)>3) didDrag = true;
    tx = startTx + dx; ty = startTy + dy;
    applyTransform();
  } else if (e.touches.length === 2 && touchStartDist){
    const [a,b] = e.touches;
    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    const rect = maparea.getBoundingClientRect();
    const mx = touchStartMid.x - rect.left, my = touchStartMid.y - rect.top;
    const newScale = Math.min(10, Math.max(0.3, touchStartScale * (d/touchStartDist)));
    const worldX = (mx - tx)/scale, worldY = (my - ty)/scale;
    tx = mx - worldX*newScale; ty = my - worldY*newScale;
    scale = newScale;
    applyTransform();
  }
}, {passive:true});
maparea.addEventListener('touchend', (e)=>{
  if (e.touches.length === 0){ dragging = false; touchStartDist = null; }
});

// ---------- init ----------
renderContext();
renderPower();
window.addEventListener('resize', fitView);
fitView();

// ?ps=<key> still selects and zooms to a station on load, so existing links
// keep working even though there's no longer a UI to build that link from.
const params = new URLSearchParams(window.location.search);
const wantedPs = params.get('ps');
if (wantedPs && POWER.some(p=>p.key === wantedPs)){
  selectPower(wantedPs);
}

</script>

</body>
</html>
