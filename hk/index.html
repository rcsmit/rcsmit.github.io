<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Housekeeping board</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #E8EDE7;
  --surface: #FFFFFF;
  --surface-2: #F2F5F0;
  --ink: #15241C;
  --ink-2: #435449;
  --ink-3: #66776C;
  --line: #CCD6C9;
  --pine: #1E5A3F;
  --pine-2: #25704E;
  --on-pine: #F2F9F4;
  --on-primary: #FFFFFF;
  --focus: #E0A526;
  --st-occupied: #3A5C93;
  --st-guest_left: #A1600E;
  --st-cleaned: #15786A;
  --st-prepped: #3B7630;
  --urgent: #BD3326;
  --st-occupied-bg: #E3EAF6;
  --st-guest_left-bg: #FAEDD8;
  --st-cleaned-bg: #DBF0EB;
  --st-prepped-bg: #E2EFDB;
  --urgent-bg: #FAE3E0;
  --tag-ink: #FFFFFF;
  --font: 'Barlow', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-cond: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1813; --surface: #17231C; --surface-2: #1E2C24; --ink: #E2EBE4; --ink-2: #A8BAAE; --ink-3: #82958A; --line: #2C3C32;
    --pine: #133A29; --pine-2: #4FAE7F; --on-pine: #E8F5EC; --on-primary: #0C1510; --focus: #F2C14E;
    --st-occupied: #86A6DD; --st-guest_left: #E4A650; --st-cleaned: #52C4B0; --st-prepped: #8CC877; --urgent: #F07366;
    --st-occupied-bg: #1C2940; --st-guest_left-bg: #37270F; --st-cleaned-bg: #11322D; --st-prepped-bg: #1C3216; --urgent-bg: #3B1814;
    --tag-ink: #0C1510;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1813; --surface: #17231C; --surface-2: #1E2C24; --ink: #E2EBE4; --ink-2: #A8BAAE; --ink-3: #82958A; --line: #2C3C32;
  --pine: #133A29; --pine-2: #4FAE7F; --on-pine: #E8F5EC; --on-primary: #0C1510; --focus: #F2C14E;
  --st-occupied: #86A6DD; --st-guest_left: #E4A650; --st-cleaned: #52C4B0; --st-prepped: #8CC877; --urgent: #F07366;
  --st-occupied-bg: #1C2940; --st-guest_left-bg: #37270F; --st-cleaned-bg: #11322D; --st-prepped-bg: #1C3216; --urgent-bg: #3B1814;
  --tag-ink: #0C1510;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; }
body.modal-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.muted { color: var(--ink-3); }
h2 { font-family: var(--font-cond); font-weight: 700; font-size: 1.5rem; line-height: 1.1; margin: 0; }
h3 { font-size: 1.05rem; margin: 0 0 8px; }

/* Header */
.topbar { background: var(--pine); color: var(--on-pine); }
.topbar-inner { max-width: 1360px; margin: 0 auto; padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font-family: var(--font-cond); font-weight: 700; font-size: 1.7rem; line-height: 1; margin: 0; }
.brand-sub { margin: 3px 0 0; font-size: .85rem; opacity: .82; }
.demo-switch { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; border: 1px dashed rgba(255,255,255,.5); border-radius: 10px; padding: 8px 10px; background: rgba(255,255,255,.06); }
.demo-label { font-size: .8rem; font-weight: 700; background: #F2C14E; color: #2A1F00; border-radius: 4px; padding: 2px 7px; }
.login-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: .9rem; }
.role-buttons { display: inline-flex; border: 1px solid rgba(255,255,255,.55); border-radius: 8px; overflow: hidden; }
.role-buttons button { background: transparent; border: 0; color: var(--on-pine); padding: 6px 11px; min-height: 38px; font-weight: 600; font-size: .9rem; }
.role-buttons button + button { border-left: 1px solid rgba(255,255,255,.35); }
.role-buttons button[aria-pressed="true"] { background: var(--on-pine); color: var(--pine); }
.user-pick select { background: rgba(0,0,0,.22); color: var(--on-pine); border: 1px solid rgba(255,255,255,.45); border-radius: 6px; padding: 6px 8px; min-height: 38px; max-width: 220px; }
.user-pick select option { color: #15241C; background: #FFFFFF; }

.toolbar { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.toolbar-inner { max-width: 1360px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.date-control { display: flex; align-items: center; gap: 6px; }
.date-control input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; min-height: 40px; }
.icon-btn { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 1.3rem; line-height: 1; }
.search { flex: 1 1 300px; display: flex; gap: 6px; align-items: center; }
.search #bulkBtn { flex: none; }
.search input { flex: 1 1 auto; min-width: 0; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; min-height: 40px; }

.page { max-width: 1360px; margin: 0 auto; padding: 14px 16px 40px; }

/* Summary tallies */
.summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; margin-bottom: 10px; }
.tally { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--ink-3)); border-radius: 7px; padding: 5px 8px; text-align: left; }
button.tally:hover { background: var(--surface-2); }
.tally .n { font-family: var(--font-cond); font-weight: 700; font-size: 1.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tally .l { font-size: .74rem; line-height: 1.15; color: var(--ink-2); }

/* Tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 2px 4px; border-bottom: 2px solid var(--line); margin-bottom: 12px; }
.tabs button { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; padding: 6px 9px; font-weight: 600; font-size: .93rem; color: var(--ink-2); min-height: 38px; display: inline-flex; align-items: center; gap: 5px; }
.tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--pine-2); }
.count { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; font-size: .75rem; padding: 0 7px; min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.count.hot { background: var(--urgent); border-color: var(--urgent); color: #FFFFFF; }

/* View head */
.view-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 10px; }
.view-head h2 { font-size: 1.3rem; }
.view-head p { margin: 2px 0 0; color: var(--ink-2); font-size: .9rem; max-width: 70ch; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: .83rem; font-weight: 600; min-height: 32px; }
.chip .c { color: var(--ink-3); font-weight: 500; margin-left: 3px; }
.chip[aria-pressed="true"] .c { color: inherit; opacity: .75; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Cards */
.st-occupied { --sc: var(--st-occupied); --sc-bg: var(--st-occupied-bg); }
.st-guest_left { --sc: var(--st-guest_left); --sc-bg: var(--st-guest_left-bg); }
.st-cleaned { --sc: var(--st-cleaned); --sc-bg: var(--st-cleaned-bg); }
.st-prepped { --sc: var(--st-prepped); --sc-bg: var(--st-prepped-bg); }

/* Key tag: the house number, coloured by status */
.tag { position: relative; display: inline-flex; align-items: center; min-width: 64px; justify-content: center; background: var(--sc, var(--ink-3)); color: var(--tag-ink); font-family: var(--font-cond); font-weight: 700; font-size: 1.4rem; line-height: 1; padding: 6px 12px 6px 24px; border-radius: 6px 16px 16px 6px; font-variant-numeric: tabular-nums; }
.tag::before { content: ""; position: absolute; left: 8px; top: 50%; width: 8px; height: 8px; border-radius: 50%; background: var(--surface); transform: translateY(-50%); }
.tag.small { font-size: 1.1rem; min-width: 52px; padding: 4px 10px 4px 20px; }
.tag.small::before { left: 7px; width: 7px; height: 7px; }
.pill { display: inline-block; font-size: .82rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--sc-bg); color: var(--sc); border: 1px solid var(--sc); }
.badge-b2b { font-size: .78rem; font-weight: 700; background: var(--urgent); color: #FFFFFF; border-radius: 4px; padding: 2px 7px; }
.badge-manual { font-size: .76rem; font-weight: 600; color: var(--ink-2); border: 1px dashed var(--ink-3); border-radius: 4px; padding: 1px 6px; }
.track { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
.seg { height: 5px; border-radius: 3px; background: var(--line); }
.seg.on { background: var(--sc); }
.lines { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: .93rem; }
.lines dt { color: var(--ink-3); }
.lines dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.who { font-weight: 600; }

.btn { min-height: 42px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--pine-2); border-color: var(--pine-2); color: var(--on-primary); }
.btn-primary:hover { background: var(--pine-2); filter: brightness(1.08); }
.btn-status { background: var(--sc); border-color: var(--sc); color: var(--tag-ink); }
.btn-status:hover { background: var(--sc); filter: brightness(1.08); }
.btn-danger { color: var(--urgent); border-color: var(--urgent); background: transparent; }
.btn-small { min-height: 34px; padding: 4px 10px; font-size: .88rem; }

.empty { padding: 28px 20px; text-align: center; color: var(--ink-2); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; }
.empty strong { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 4px; }

/* Panels, tables */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.panel > h2 { margin-bottom: 10px; }
.cols { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 860px) { .cols { grid-template-columns: 1fr 1fr; } }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .93rem; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { font-weight: 600; color: var(--ink-2); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 700; border-top: 2px solid var(--ink-3); }
tr.current td { background: var(--surface-2); }
.move-list { list-style: none; margin: 0; padding: 0; }
.move-list li { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 2px 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.move-list li:last-child { border-bottom: 0; }
.move-meta { font-size: .9rem; color: var(--ink-2); }
.move-time { font-family: var(--font-cond); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.ready { font-size: .82rem; font-weight: 600; }
.ready.ok { color: var(--st-prepped); }
.ready.no { color: var(--urgent); }

/* Period report */
.period-controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 12px; }
.period-controls label { display: flex; flex-direction: column; font-size: .85rem; color: var(--ink-2); gap: 2px; }
.period-controls input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; min-height: 40px; }
.totals { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.chart-wrap { overflow-x: auto; margin: 6px 0 4px; }
.chart-wrap svg { display: block; }
.chart-wrap text { fill: var(--ink-3); font-family: var(--font); font-size: 11px; }
.chart-wrap .grid-line { stroke: var(--line); stroke-width: 1; }
.bar-dep { fill: var(--st-guest_left); }
.bar-arr { fill: var(--st-occupied); }
.bar-b2b { fill: var(--urgent); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .88rem; color: var(--ink-2); margin-bottom: 12px; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--k); }
.message { border-radius: 8px; padding: 10px 12px; margin: 10px 0; border: 1px solid; }
.message.error { background: var(--urgent-bg); border-color: var(--urgent); }
.message.warning { background: var(--st-guest_left-bg); border-color: var(--st-guest_left); }
.message.ok { background: var(--st-prepped-bg); border-color: var(--st-prepped); }
.message ul { margin: 6px 0 0; padding-left: 20px; font-size: .9rem; }

/* Activity log */
.log { list-style: none; margin: 0; padding: 0; }
.log li { display: grid; grid-template-columns: 150px 1fr; gap: 2px 14px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: .93rem; }
.log time { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.log .src { font-size: .76rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; color: var(--ink-3); }
@media (max-width: 560px) { .log li { grid-template-columns: 1fr; } }

/* Admin */
.drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 2px dashed var(--line); border-radius: 10px; padding: 22px 14px; text-align: center; background: var(--surface-2); }
.drop.over { border-color: var(--pine-2); }
.drop input[type="file"] { max-width: 100%; }
.hint { font-size: .88rem; color: var(--ink-2); margin: 8px 0; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.toggle { display: flex; align-items: flex-start; gap: 10px; margin-top: 14px; font-size: .93rem; }
.toggle input { width: 20px; height: 20px; margin-top: 2px; flex: none; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; align-items: end; margin-top: 12px; }
.form-grid label, .field { display: flex; flex-direction: column; gap: 3px; font-size: .85rem; color: var(--ink-2); }
input.text, select.text, textarea.text { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 9px; min-height: 40px; color: var(--ink); width: 100%; }
textarea.text { min-height: 90px; resize: vertical; }
.perm-table td { text-align: center; }
.perm-table td:first-child, .perm-table th:first-child { text-align: left; }
.yes { color: var(--st-prepped); font-weight: 700; }
.no-perm { color: var(--ink-3); }

/* Modal: bottom sheet on phones, centred dialog on larger screens */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8, 18, 12, .55); display: flex; align-items: flex-end; justify-content: center; }
.dialog { background: var(--surface); width: 100%; max-width: 660px; max-height: 92vh; overflow: auto; border-radius: 14px 14px 0 0; padding: 18px 18px 22px; animation: sheet-in .18s ease-out; }
.dialog:focus { outline: none; }
@media (min-width: 720px) { .overlay { align-items: center; padding: 24px; } .dialog { border-radius: 14px; } }
@keyframes sheet-in { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.dialog-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.dialog-head h2 { flex: 1 1 auto; }
.close-btn { margin-left: auto; width: 42px; height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 1.4rem; line-height: 1; }
.dialog section { margin-top: 16px; }
.dialog textarea.export { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; min-height: 180px; }

.toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; max-width: calc(100% - 32px); transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.error { background: var(--urgent); color: #FFFFFF; }
.toast { display: flex; align-items: center; gap: 14px; }
.toast.show.has-action { pointer-events: auto; }
.toast-action { flex: none; background: none; border: 1.5px solid currentColor; color: inherit; border-radius: 6px; padding: 4px 14px; min-height: 36px; font-weight: 700; }
.footnote { max-width: 1360px; margin: 0 auto; padding: 0 16px 30px; font-size: .85rem; color: var(--ink-3); }

@media (max-width: 560px) {
  .brand h1 { font-size: 1.45rem; }
}
/* Compact house rows */
.rows { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 5px 12px; }
.row { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.row-line { display: flex; align-items: stretch; min-width: 0; }
.row.is-mine { border-color: var(--pine-2); }
.row.is-b2b.is-mine { border-color: var(--urgent); }
.row.is-b2b { border-color: var(--urgent); box-shadow: inset 4px 0 0 var(--urgent); }
.row-main { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 9px; background: none; border: 0; padding: 6px 9px; text-align: left; }
.row.is-b2b .row-main { padding-left: 12px; }
.row-main:hover { background: var(--surface-2); }
.row-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.row-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.row-sub { display: flex; flex-wrap: wrap; gap: 0 10px; font-size: .84rem; color: var(--ink-2); }
.kv .k { color: var(--ink-3); }
.row-note { font-size: .8rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.row-note::before { content: "✎ "; color: var(--focus); }
.row .pill { font-size: .74rem; padding: 0 7px; }
.row .badge-b2b, .row .badge-manual { font-size: .7rem; padding: 0 5px; }
.btn-row { flex: none; width: 92px; border: 0; border-left: 1px solid var(--line); border-radius: 0; min-height: 0; padding: 6px 8px; font-size: .84rem; line-height: 1.15; white-space: normal; background: var(--sc-bg); color: var(--sc); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; text-align: center; }
.btn-row:hover { background: var(--sc-bg); filter: brightness(.97); }
.btn-row .verb { font-size: .72rem; font-weight: 600; color: var(--ink-2); }
.btn-row .to { font-weight: 700; }
.btn-row::before { content: ""; width: 14px; height: 14px; border: 2px solid currentColor; border-radius: 50%; margin-bottom: 2px; }
.tag.mini { font-size: .95rem; min-width: 0; padding: 2px 8px 2px 17px; border-radius: 4px 12px 12px 4px; }
.tag.mini::before { left: 6px; width: 6px; height: 6px; }
.taglist { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 10px; }
.btn-head { min-height: 34px; padding: 4px 10px; font-size: .86rem; }

.badge-mine { font-size: .7rem; font-weight: 700; background: var(--pine-2); color: var(--on-primary); border-radius: 4px; padding: 0 5px; }
.row-assign { border-top: 1px dashed var(--line); padding: 4px 9px; font-size: .82rem; color: var(--ink-2); }
.row.is-b2b .row-assign { padding-left: 12px; }
.row-assign label { display: flex; align-items: center; gap: 8px; }
.assign-select { flex: 1 1 auto; max-width: 240px; min-height: 32px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
.head-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.list-title { font-size: .92rem; color: var(--ink-2); margin: 12px 0 6px; }
.field strong { color: var(--ink); font-size: .95rem; }
.neutral { --sc: var(--pine-2); --sc-bg: var(--surface-2); }

const DEFAULT_CHECKIN_TIME = '15:00';

const PERMISSION_LABELS = {
  seeGuestNames: 'See guest names',
  anyTransition: 'Set any status (override)',
  clearOverride: 'Return a house to automatic status',
  editNotes: 'Edit house notes',
  bulkEdit: 'Bulk status updates',
  assignCleans: 'Assign cleans to cleaners',
  assignPreps: 'Assign preps to prep staff',
  editBookingTimes: `Grant early check-in (${EARLY_CHECKIN_TIME}) and late check-out (${LATE_CHECKOUT_TIME})`,
  worksOn: 'Gets tasks assigned, sees own first',
  viewUnitHistory: 'See a house’s change history',

};
const TAB_LABELS = {
  units: 'Houses',
  movements: 'Arrivals & departures',
  cleans: 'Cleans to do',
  preps: 'Preps to do',
  period: 'Period report',
  log: 'Activity log',

};

const Permissions = {
  of(role) { return ROLE_PERMISSIONS[role] || null; },
  can(role, key) { const p = ROLE_PERMISSIONS[role]; return !!(p && p[key]); },
  tabs(role) { const p = ROLE_PERMISSIONS[role]; return p ? p.tabs : []; },
  canSetStatus(role, from, to) {
    const p = ROLE_PERMISSIONS[role];
    if (!p || from === to || !STATUSES.includes(to)) return false;
    if (!p.settableStatuses.includes(to)) return false;
    return p.anyTransition || PREVIOUS_STATUS[to] === from;
  },
  canAssign(role, task, row = null) {
    const t = TASKS[task];
    if (!t || !Permissions.can(role, t.permission)) return false;
    return !row || t.isEligible(row);
  },
  bulkModes(role) {
    return [
      ...(Permissions.can(role, 'bulkEdit') ? ['status'] : []),
      ...Object.keys(TASKS).filter((t) => Permissions.can(role, TASKS[t].permission)),
    ];
  },
};

const SYSTEM_USER = { id: 'usr-system', name: 'Automatic (dates)', role: 'system', email: '' };

  { id: 'usr-006', name: 'Piet de Groot', role: 'cleaner', email: 'piet@sparkleclean.example.com' },
  { id: 'usr-007', name: 'Joanna Nowak', role: 'cleaner', email: 'joanna@sparkleclean.example.com' },
  { id: 'usr-008', name: 'Kees Brouwer', role: 'rep', email: 'kees.brouwer@example.com' },
  { id: 'usr-009', name: 'Mila Rossi', role: 'rep', email: 'mila.rossi@example.com' },
];

/* ==========================================================================
   UTILITIES
   ========================================================================== */
const pad = (n) => String(n).padStart(2, '0');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const naturalCompare = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });

const DateUtil = {
  today() { return DateUtil.toISO(new Date()); },
  toISO(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; },
  parse(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d, 12); },
  addDays(iso, n) { const d = DateUtil.parse(iso); d.setDate(d.getDate() + n); return DateUtil.toISO(d); },
  diff(a, b) { return Math.round((DateUtil.parse(b) - DateUtil.parse(a)) / 86400000); },
  range(a, b) { const out = []; for (let d = a; d <= b; d = DateUtil.addDays(d, 1)) out.push(d); return out; },
  isISO(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && DateUtil.toISO(DateUtil.parse(s)) === s; },
  label(iso) { return DateUtil.parse(iso).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); },
  weekday(iso) { return DateUtil.parse(iso).toLocaleDateString('en-GB', { weekday: 'short' }); },
  relative(iso, ref) {
    const n = DateUtil.diff(ref, iso);
    if (n === 0) return 'today';
    if (n === 1) return 'tomorrow';
    if (n === -1) return 'yesterday';
    return DateUtil.label(iso);
  },
  stamp(ts) { return new Date(ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' }); },
};

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Quotes fields that contain the separator, quotes or line breaks. Values that Excel would
// run as a formula (=, +, @, or - followed by a non-number) get a leading apostrophe.
function csvCell(v, sep) {
  let str = String(v ?? '');
  if (/^[=+@\t\r]/.test(str) || /^-(?![\d.])/.test(str)) str = `'${str}`;
  return (str.includes(sep) || /["\n\r]/.test(str) || /^\s|\s$/.test(str)) ? `"${str.replace(/"/g, '""')}"` : str;
}
function toCsv(rows, sep = ',') {
  return rows.map((r) => r.map((v) => csvCell(v, sep)).join(sep)).join('\r\n');
}
// Default separator follows the locale: where the decimal mark is a comma (NL, DE, FR…) Excel expects ';'.
function defaultCsvSeparator() {
  try { return (1.5).toLocaleString().includes(',') ? ';' : ','; } catch (e) { return ','; }
}

/* ==========================================================================
   DATA ACCESS LAYER
   All reads and writes go through DataStore. Every method is async and
   returns plain copies, exactly like a network API would, so the UI never
   touches the storage directly.

   Backend integration point: swap the in-memory implementation below for
   HTTP calls without changing any UI code. For example:

     async getUnits() {
       const res = await fetch('/api/units', { headers: authHeaders() });
       if (!res.ok) throw new Error(`GET /api/units failed (${res.status})`);
       return res.json();
     },
     async updateStatus({ unitId, cycleKey, status, fromStatus }) {
       const res = await fetch(`/api/units/${encodeURIComponent(unitId)}/status`, {
         method: 'POST',
         headers: { 'Content-Type': 'application/json', ...authHeaders() },
         body: JSON.stringify({ cycleKey, status, fromStatus }),
       });
       if (!res.ok) throw new Error(`Status update failed (${res.status})`);
       return res.json();
     },

   Or with Supabase: const { data, error } = await supabase.from('units').select('*');

   Suggested tables (IDs below map directly to primary keys):
     units            (id, house_number, notes)
     bookings         (id, unit_id, guest_name, arrival_date, arrival_time, departure_date, departure_time)
     status_overrides (unit_id, cycle_key, status, set_by, set_at)   -- unit.statusOverrides here
     users            (id, name, role, email)
     activity_log     (id, at, type, source, unit_id, house_number, from_status, to_status, user_id, demo_date, message)
   With a real login, the server derives the user from the session instead of
   the userId parameter, and enforces ROLE_PERMISSIONS as well (for example with
   Supabase row-level security).
   ========================================================================== */
function createMemoryStore() {
  const db = {
    units: [],
    bookings: [],
    users: [],
    activity: [],
    settings: { assumePastTurnoversDone: false },
    meta: { source: '', fileName: null, loadedAt: null },
  };
  let activitySeq = 0;
  const clone = (v) => (typeof structuredClone === 'function' ? structuredClone(v) : JSON.parse(JSON.stringify(v)));
  const nowIso = () => new Date().toISOString();
  const findUnit = (id) => {
    const u = db.units.find((x) => x.id === id);
    if (!u) throw new Error(`House ${id} no longer exists.`);
    return u;
  };
  const findUser = (id) => {
    const u = db.users.find((x) => x.id === id);
    if (!u) throw new Error('That user no longer exists.');
    return u;
  };
  const pushActivity = (entry) => {
    activitySeq += 1;
    const rec = { id: `act-${String(activitySeq).padStart(6, '0')}`, at: nowIso(), source: 'manual', ...entry };
    db.activity.push(rec);
    return rec;
  };
  // Effective times follow the base times from the booking file plus any granted early/late option.
  const applyTimes = (b) => {
    b.arrivalTime = b.earlyCheckin && EARLY_CHECKIN_TIME < b.baseArrivalTime ? EARLY_CHECKIN_TIME : b.baseArrivalTime;
    b.departureTime = b.lateCheckout && LATE_CHECKOUT_TIME > b.baseDepartureTime ? LATE_CHECKOUT_TIME : b.baseDepartureTime;
    return b;
  };
  const normaliseBooking = (b) => applyTimes({
    ...b,
    baseArrivalTime: b.baseArrivalTime || b.arrivalTime || DEFAULT_CHECKIN_TIME,
    baseDepartureTime: b.baseDepartureTime || b.departureTime || DEFAULT_CHECKOUT_TIME,
    earlyCheckin: !!b.earlyCheckin,
    lateCheckout: !!b.lateCheckout,
  });
  const houseOfUnit = (unitId) => { const u = db.units.find((x) => x.id === unitId); return u ? u.houseNumber : ''; };
  const normaliseUnits = (units) => units.map((u) => ({ id: u.id, houseNumber: String(u.houseNumber), notes: u.notes || '', statusOverrides: { ...(u.statusOverrides || {}) }, assignments: { ...(u.assignments || {}) } }));

  return {
    async init({ users, units, bookings, source, fileName = null }) {
      db.users = clone(users);

/* ==========================================================================
   STATUS ENGINE (pure functions)
   A house's automatic status follows its bookings on the working date:
   - a guest is staying                -> Occupied
   - a booking departs today           -> Occupied ("due out") until staff enter Guest left;
                                          the house is on today's cleans list either way
   - vacant after an earlier departure -> Prepped, or Guest left if the
                                          "assume past turnovers done" setting is off

   hold until the next stay or turnover begins and then reset automatically.

  stayKey(house, arrivalDate) { return `stay:${house}|${arrivalDate}`; },
  initialKey(house) { return `initial:${house}`; },
  describeKey(key) {
    const kind = key.slice(0, key.indexOf(':'));
    const date = key.slice(key.lastIndexOf('|') + 1);
    if (kind === 'turnover') return `the check-out on ${DateUtil.isISO(date) ? DateUtil.label(date) : date}`;
    if (kind === 'stay') return `the stay from ${DateUtil.isISO(date) ? DateUtil.label(date) : date}`;
    return 'the time before its first booking';
  },
  // True when the leaving guest checks out at or after the next guest's check-in on the same day,
  // which leaves no time to clean.
  timeClash(outgoing, incoming) {

      && outgoing.departureDate === incoming.arrivalDate && outgoing.departureTime >= incoming.arrivalTime);

  evaluate(unit, bookings, date, settings) {

    for (const b of bookings) {
      if (b.departureDate === date) departingAll.push(b);
      if (b.arrivalDate === date && !arriving) arriving = b;
      if (b.arrivalDate <= date && date < b.departureDate) occupyingAll.push(b);
      if (b.departureDate <= date && (!lastDeparture || b.departureDate > lastDeparture.departureDate)) lastDeparture = b;
      if (b.arrivalDate >= date && (!nextArrival
        || b.arrivalDate < nextArrival.arrivalDate

      // A guest who left before the official departure date: the turnover has already started.
      turnoverKey = StatusEngine.turnoverKey(H, occupying.departureDate);
      autoStatus = 'occupied';
      const early = ov[turnoverKey];
      if (early && early.status !== 'occupied') { cycleKey = turnoverKey; earlyDeparture = true; }
      else cycleKey = StatusEngine.stayKey(H, occupying.arrivalDate);
    } else if (lastDeparture) {
      cycleKey = turnoverKey = StatusEngine.turnoverKey(H, lastDeparture.departureDate);
      autoStatus = settings.assumePastTurnoversDone ? 'prepped' : 'guest_left';
    } else {
      cycleKey = StatusEngine.initialKey(H);

    const backToBack = !!(departing && arriving && departing.id !== arriving.id);
    const incomingToday = backToBack ? arriving : (arriving && occupying && arriving.id === occupying.id ? arriving : null);

      status,

      departing, arriving, occupying, lastDeparture, nextArrival, backToBack,
      overlap: occupyingAll.length > 1 || departingAll.length > 1,

      .map((u) => StatusEngine.evaluate(u, byUnit.get(u.id).sort((a, b) => (a.arrivalDate + a.arrivalTime).localeCompare(b.arrivalDate + b.arrivalTime)), date, snap.settings))

  periodStats(bookings, from, to) {
    const days = DateUtil.range(from, to).map((date) => ({ date, departures: 0, arrivals: 0, b2b: 0 }));
    const index = new Map(days.map((d, i) => [d.date, i]));
    const departedUnitDays = new Set();

    return { days, totals };

  const departingToday = bookings.filter((b) => b.departureDate === today);
  const arrivingToday = bookings.filter((b) => b.arrivalDate === today);
  const plainDeparture = departingToday.find((b) => !arrivingToday.some((a) => a.unitId === b.unitId));
  const plainArrival = arrivingToday.find((b) => !departingToday.some((d) => d.unitId === b.unitId));
  const b2bDeparture = departingToday.find((b) => arrivingToday.some((a) => a.unitId === b.unitId));
  if (plainDeparture) plainDeparture.lateCheckout = true;
  if (plainArrival) plainArrival.earlyCheckin = true;
  if (b2bDeparture) b2bDeparture.lateCheckout = true; // shows a time clash
  const noteCount = Math.min(4, units.length);
  const shuffled = [...units].sort(() => rnd() - 0.5);
  for (let i = 0; i < noteCount; i++) shuffled[i].notes = NOTES[i % NOTES.length];

  return { units, bookings, source: 'generated demo data', fileName: null };
}

/* ==========================================================================
   SPREADSHEET IMPORT (SheetJS for .xlsx/.xls, own parser for .csv)
   ========================================================================== */
const SpreadsheetImport = {
  HEADER_ALIASES: {
    name: ['name', 'guest', 'guestname', 'naam'],
    arrival: ['arrival', 'arrivaldate', 'checkin', 'aankomst'],
    departure: ['departure', 'departuredate', 'checkout', 'vertrek'],
    housenumber: ['housenumber', 'house', 'housenr', 'houseno', 'unit', 'accommodation', 'huisnummer'],
  },
  normaliseHeader(h) { return String(h ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, ''); },

  readFile(file, as) {
    if (as === 'text' && typeof file.text === 'function') return file.text();
    if (as === 'buffer' && typeof file.arrayBuffer === 'function') return file.arrayBuffer();
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error(`“${file.name}” couldn’t be opened.`));
      if (as === 'text') reader.readAsText(file); else reader.readAsArrayBuffer(file);
    });
  },

  async readMatrix(file) {
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    if (!['xlsx', 'xls', 'csv'].includes(ext)) throw new Error(`“${file.name}” isn’t a spreadsheet. Upload an .xlsx, .xls or .csv file.`);
    if (file.size === 0) throw new Error(`“${file.name}” is empty.`);
    if (file.size > 10 * 1024 * 1024) throw new Error(`“${file.name}” is larger than 10 MB. Split it or remove unused sheets.`);
    if (ext === 'csv') return SpreadsheetImport.parseCsv(await SpreadsheetImport.readFile(file, 'text'));
    if (typeof XLSX === 'undefined') throw new Error('The spreadsheet reader didn’t load (check the internet connection). Save the file as .csv and upload that instead.');
    let wb;
    try { wb = XLSX.read(await SpreadsheetImport.readFile(file, 'buffer'), { type: 'array' }); }
    catch (e) { throw new Error(`“${file.name}” couldn’t be read. It may be damaged or password-protected.`); }
    const sheetName = wb.SheetNames[0];
    if (!sheetName) throw new Error(`“${file.name}” has no sheets.`);
    return XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '', raw: true, blankrows: true });
  },

  parseCsv(text) {
    const src = text.replace(/^\uFEFF/, '');
    // Detect the separator from the first line, ignoring anything inside quotes.
    const counts = { ',': 0, ';': 0, '\t': 0 };
    let q = false;
    for (let i = 0; i < src.length; i++) {
      const c = src[i];
      if (c === '"') q = !q;
      else if (!q && (c === '\n' || c === '\r')) break;
      else if (!q && c in counts) counts[c] += 1;
    }
    const delim = Object.keys(counts).reduce((a, b) => (counts[b] > counts[a] ? b : a), ',');
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < src.length; i++) {
      const c = src[i];
      if (inQuotes) {
        if (c === '"') { if (src[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
        else field += c;
      } else if (c === '"') inQuotes = true;
      else if (c === delim) { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') field += c;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  },

  validYMD(y, m, d) {
    if (y < 2000 || y > 2100 || m < 1 || m > 12 || d < 1 || d > 31) return false;
    const dt = new Date(y, m - 1, d, 12);
    return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
  },
  validTime(h, min) { return h >= 0 && h <= 23 && min >= 0 && min <= 59; },

  // Returns { date: 'YYYY-MM-DD', time: 'HH:MM' } or null
  parseDateCell(value, defaultTime) {
    if (value === null || value === undefined || value === '') return null;
    if (value instanceof Date && !isNaN(value)) {
      const hasTime = value.getHours() || value.getMinutes();
      return { date: DateUtil.toISO(value), time: hasTime ? `${pad(value.getHours())}:${pad(value.getMinutes())}` : defaultTime };
    }
    if (typeof value === 'number' && isFinite(value)) {
      if (value < 36526 || value > 73051) return null; // Excel serials for 2000-01-01 .. 2099-12-31
      const ms = Math.round((value - 25569) * 86400000);
      const d = new Date(ms);
      const frac = value - Math.floor(value);
      return {
        date: `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`,
        time: frac > 1e-6 ? `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}` : defaultTime,
      };
    }
    const s = String(value).trim();
    let m, y, mo, d, h = null, mi = null;
    if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:[ T](\d{1,2})[:.](\d{2})(?::\d{2})?)?$/))) {
      [y, mo, d] = [Number(m[1]), Number(m[2]), Number(m[3])];
      if (m[4] !== undefined) { h = Number(m[4]); mi = Number(m[5]); }
    } else if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})(?:[ T](\d{1,2})[:.](\d{2})(?::\d{2})?)?$/))) {
      [d, mo, y] = [Number(m[1]), Number(m[2]), Number(m[3])];
      if (m[4] !== undefined) { h = Number(m[4]); mi = Number(m[5]); }
    } else if (/^\d+(\.\d+)?$/.test(s)) {
      return SpreadsheetImport.parseDateCell(Number(s), defaultTime);
    } else return null;
    if (!SpreadsheetImport.validYMD(y, mo, d)) return null;
    if (h !== null && !SpreadsheetImport.validTime(h, mi)) return null;
    return { date: `${y}-${pad(mo)}-${pad(d)}`, time: h !== null ? `${pad(h)}:${pad(mi)}` : defaultTime };
  },

  toDataset(matrix) {
    const headerIdx = matrix.findIndex((r) => Array.isArray(r) && r.some((c) => String(c ?? '').trim() !== ''));
    if (headerIdx < 0) throw new Error('The first sheet is empty.');
    const header = matrix[headerIdx].map((h) => SpreadsheetImport.normaliseHeader(h));
    const col = {};
    for (const [field, aliases] of Object.entries(SpreadsheetImport.HEADER_ALIASES)) {
      const i = header.findIndex((h) => aliases.includes(h));
      if (i >= 0) col[field] = i;
    }
    const missing = Object.keys(SpreadsheetImport.HEADER_ALIASES).filter((f) => col[f] === undefined);
    if (missing.length) {
      const found = matrix[headerIdx].map((h) => String(h ?? '').trim()).filter(Boolean);
      throw new Error(`Missing column${missing.length > 1 ? 's' : ''}: ${missing.join(', ')}. The first row should hold the headers name, arrival, departure and housenumber. Found: ${found.length ? found.join(', ') : 'nothing'}.`);
    }

    const errors = [], warnings = [], parsed = [];
    for (let i = headerIdx + 1; i < matrix.length; i++) {
      const r = matrix[i] || [];
      const rowNo = i + 1;
      if (!r.some((c) => String(c ?? '').trim() !== '')) continue;
      const name = String(r[col.name] ?? '').trim();
      const house = String(r[col.housenumber] ?? '').trim();
      const arrRaw = r[col.arrival];
      const depRaw = r[col.departure];
      const problems = [];
      if (!house) problems.push('housenumber is empty');
      if (!name) problems.push('name is empty');
      const arrival = SpreadsheetImport.parseDateCell(arrRaw, DEFAULT_CHECKIN_TIME);
      const departure = SpreadsheetImport.parseDateCell(depRaw, DEFAULT_CHECKOUT_TIME);
      if (!arrival) problems.push(String(arrRaw ?? '').trim() ? `arrival “${String(arrRaw).trim()}” isn’t a date` : 'arrival is empty');
      if (!departure) problems.push(String(depRaw ?? '').trim() ? `departure “${String(depRaw).trim()}” isn’t a date` : 'departure is empty');
      if (arrival && departure && departure.date <= arrival.date) problems.push('departure must be at least one day after arrival');
      if (problems.length) { errors.push(`Row ${rowNo}: ${problems.join('; ')}`); continue; }
      parsed.push({ rowNo, name, house, arrival, departure });
    }

    const houseNumbers = [...new Set(parsed.map((p) => p.house))].sort(naturalCompare);
    const usedIds = new Set();
    const unitIdByHouse = new Map(houseNumbers.map((h) => [h, stableUnitId(h, usedIds)]));
    const units = houseNumbers.map((h) => ({ id: unitIdByHouse.get(h), houseNumber: h, notes: '', statusOverrides: {}, assignments: {} }));
    const bookings = parsed
      .sort((a, b) => naturalCompare(a.house, b.house) || a.arrival.date.localeCompare(b.arrival.date))
      .map((p, i) => ({
        id: `B-${String(i + 1).padStart(4, '0')}`, unitId: unitIdByHouse.get(p.house), guestName: p.name,
        arrivalDate: p.arrival.date, arrivalTime: p.arrival.time, departureDate: p.departure.date, departureTime: p.departure.time, sourceRow: p.rowNo,
      }));

    for (const h of houseNumbers) {
      const list = bookings.filter((b) => b.unitId === unitIdByHouse.get(h));
      for (let i = 1; i < list.length; i++) {
        if (list[i].arrivalDate < list[i - 1].departureDate) {
          warnings.push(`House ${h}: row ${list[i].sourceRow} (arrives ${list[i].arrivalDate}) overlaps row ${list[i - 1].sourceRow} (departs ${list[i - 1].departureDate}).`);
        }
      }
    }
    return { units, bookings, errors, warnings };
  },
};

/* ==========================================================================
   SELF-TEST: edge cases, run against a separate in-memory store
   ========================================================================== */
async function runSelfTests() {
  const results = [];
  const test = async (name, fn) => {
    try { await fn(); results.push({ name, ok: true }); }
    catch (e) { results.push({ name, ok: false, detail: e.message }); }
  };
  const eq = (actual, expected, what) => {
    if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`${what}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
  };
  const D = (n) => DateUtil.addDays('2026-03-10', n);
  let seq = 0;
  const bk = (house, arr, dep, extra = {}) => ({ id: `T${++seq}`, unitId: stableUnitId(house), guestName: `Guest ${seq}`, arrivalDate: arr, arrivalTime: '15:00', departureDate: dep, departureTime: '10:00', ...extra });
  const mkStore = async (bookings, extraHouses = []) => {
    const st = createMemoryStore();
    const houses = [...new Set([...bookings.map((b) => b.unitId.slice(2)), ...extraHouses])];
    await st.init({ users: SEED_USERS, units: houses.map((h) => ({ id: stableUnitId(h), houseNumber: h })), bookings, source: 'test' });
    return st;
  };
  const rowAt = async (st, house, date) => {
    const snap = { units: await st.getUnits(), bookings: await st.getBookings(), settings: await st.getSettings() };
    return StatusEngine.deriveAll(snap, date).find((r) => r.unit.houseNumber === house);
  };
  const setVia = async (st, row, to, date) => {
    const w = StatusEngine.writePlan(row, to);
    if (w.clear) await st.clearStatusOverride({ unitId: row.unit.id, cycleKey: w.cycleKey, fromStatus: row.status, toStatus: to, userId: 'usr-001', demoDate: date });
    else await st.updateStatus({ unitId: row.unit.id, cycleKey: w.cycleKey, status: to, fromStatus: row.status, userId: 'usr-001', demoDate: date });
  };

  await test('Guest staying: occupied', async () => {
    const st = await mkStore([bk('101', D(0), D(3))]);
    eq((await rowAt(st, '101', D(1))).status, 'occupied', 'status');
  });
  await test('Departure day stays occupied (due out) until guest left is entered, and is on the cleans list either way', async () => {
    const st = await mkStore([bk('101', D(0), D(3))]);
    eq((await rowAt(st, '101', D(0))).status, 'occupied', 'arrival day');
    let r = await rowAt(st, '101', D(3));
    eq([r.status, r.dueOut, isCleanTodo(r)], ['occupied', true, true], 'departure day, not entered');
    await setVia(st, r, 'guest_left', D(3));
    r = await rowAt(st, '101', D(3));
    eq([r.status, r.dueOut, isCleanTodo(r)], ['guest_left', false, true], 'after guest left');
    await setVia(st, r, 'cleaned', D(3));
    eq(isCleanTodo(await rowAt(st, '101', D(3))), false, 'after cleaning');
  });
  await test('A cleaner cannot clean a house before guest left is entered; a rep can enter it', async () => {
    eq(Permissions.canSetStatus('cleaner', 'occupied', 'cleaned'), false, 'cleaner on due-out house');
    eq(Permissions.canSetStatus('rep', 'occupied', 'guest_left'), true, 'rep enters guest left');
  });
  await test('Houses due out can be assigned to a cleaner before the guest has left', async () => {
    const st = await mkStore([bk('101', D(0), D(3))]);
    const r = await rowAt(st, '101', D(3));
    eq([Permissions.canAssign('cleaning', 'clean', r), Permissions.canAssign('cleaning', 'clean', await rowAt(st, '101', D(1)))], [true, false], 'due out vs mid-stay');
    await st.assign({ items: [{ unitId: r.unit.id, cycleKey: r.cycleKey }], task: 'clean', assigneeId: 'usr-005', userId: 'usr-004', demoDate: D(3) });
    await setVia(st, r, 'guest_left', D(3));
    eq(assigneeOfRow(await rowAt(st, '101', D(3)), 'clean'), 'usr-005', 'assignment kept after guest left');
  });
  await test('Setting a house back to its automatic status removes the manual entry', async () => {
    const st = await mkStore([bk('101', D(0), D(3))]);
    await setVia(st, await rowAt(st, '101', D(3)), 'guest_left', D(3));
    await setVia(st, await rowAt(st, '101', D(3)), 'occupied', D(3));
    const r = await rowAt(st, '101', D(3));
    eq([r.status, r.override, r.dueOut], ['occupied', null, true], 'back to due out');
  });
  await test('Unrecorded turnover stays on the cleans list the next days (default); prepped only if the setting is on', async () => {
    const st = await mkStore([bk('101', D(0), D(3))]);
    const r = await rowAt(st, '101', D(5));
    eq([r.status, isCleanTodo(r)], ['guest_left', true], 'default');
    await st.updateSettings({ assumePastTurnoversDone: true }, { userId: 'usr-001', demoDate: D(5) });
    eq((await rowAt(st, '101', D(5))).status, 'prepped', 'setting on');
  });
  await test('House without bookings is prepped', async () => {
    const st = await mkStore([bk('101', D(0), D(3))], ['102']);
    eq((await rowAt(st, '102', D(1))).status, 'prepped', 'status');
  });
  await test('Back-to-back is detected only on the turnover day', async () => {
    const st = await mkStore([bk('101', D(0), D(3)), bk('101', D(3), D(6))]);
    eq((await rowAt(st, '101', D(3))).backToBack, true, 'turnover day');
    eq((await rowAt(st, '101', D(4))).backToBack, false, 'day after');
    eq((await rowAt(st, '101', D(4))).status, 'occupied', 'next guest staying');
  });
  await test('Manual “cleaned” holds through the turnover and resets when the next guest arrives', async () => {
    const st = await mkStore([bk('101', D(0), D(3)), bk('101', D(5), D(8))]);
    await setVia(st, await rowAt(st, '101', D(3)), 'cleaned', D(3));
    eq((await rowAt(st, '101', D(4))).status, 'cleaned', 'day after departure');
    eq((await rowAt(st, '101', D(5))).status, 'occupied', 'next arrival');
    eq((await rowAt(st, '101', D(9))).status, 'guest_left', 'after the next stay, nothing entered');
  });
  await test('Early departure: a house cleaned early stays cleaned on the official departure day', async () => {
    const st = await mkStore([bk('101', D(0), D(4))]);
    await setVia(st, await rowAt(st, '101', D(2)), 'guest_left', D(2));
    let r = await rowAt(st, '101', D(2));
    eq([r.status, r.earlyDeparture], ['guest_left', true], 'after marking left');
    await setVia(st, r, 'cleaned', D(2));
    eq((await rowAt(st, '101', D(3))).status, 'cleaned', 'next day');
    eq((await rowAt(st, '101', D(4))).status, 'cleaned', 'official departure day');
  });
  await test('Early departure can be reversed to occupied, then the departure day works as normal', async () => {
    const st = await mkStore([bk('101', D(0), D(4))]);
    await setVia(st, await rowAt(st, '101', D(2)), 'guest_left', D(2));
    await setVia(st, await rowAt(st, '101', D(2)), 'occupied', D(2));
    eq((await rowAt(st, '101', D(2))).status, 'occupied', 'reversed');
    const dep = await rowAt(st, '101', D(4));
    eq([dep.status, dep.dueOut], ['occupied', true], 'departure day is due out again');
  });
  await test('Assignment follows the turnover and is gone once the next guest stays', async () => {
    const st = await mkStore([bk('101', D(0), D(3)), bk('101', D(3), D(6))]);
    const r = await rowAt(st, '101', D(3));
    await st.assign({ items: [{ unitId: r.unit.id, cycleKey: r.cycleKey }], task: 'clean', assigneeId: 'usr-005', userId: 'usr-004', demoDate: D(3) });
    eq(assigneeOfRow(await rowAt(st, '101', D(3)), 'clean'), 'usr-005', 'turnover day');
    eq(assigneeOfRow(await rowAt(st, '101', D(4)), 'clean'), null, 'next stay');
  });
  await test('Assigning ahead: planned on the departure date, visible when that day comes', async () => {
    const st = await mkStore([bk('101', D(0), D(3))]);
    const future = await rowAt(st, '101', D(3));
    await st.assign({ items: [{ unitId: future.unit.id, cycleKey: future.cycleKey }], task: 'clean', assigneeId: 'usr-006', userId: 'usr-004', demoDate: D(3) });
    eq(assigneeOfRow(await rowAt(st, '101', D(1)), 'clean'), null, 'while occupied');
    eq(assigneeOfRow(await rowAt(st, '101', D(3)), 'clean'), 'usr-006', 'departure day');
  });
  await test('Re-upload in a different row order keeps statuses, assignments and early/late options', async () => {
    const a = bk('101', D(0), D(3)), b = bk('101', D(3), D(6)), c = bk('102', D(1), D(3));
    const st = await mkStore([a, b, c]);
    let r = await rowAt(st, '101', D(3));
    await setVia(st, r, 'cleaned', D(3));
    await st.assign({ items: [{ unitId: r.unit.id, cycleKey: r.cycleKey }], task: 'prep', assigneeId: 'usr-008', userId: 'usr-001', demoDate: D(3) });
    await st.setBookingOption({ bookingId: a.id, option: 'lateCheckout', value: true, userId: 'usr-001', demoDate: D(3) });
    const units = await st.getUnits();
    const reordered = [c, b, a].map((x, i) => ({ ...x, id: `NEW-${i}` })); // new IDs, new order
    const rep = await st.replaceDataset({ units: [...units].reverse(), bookings: reordered, source: 'test' }, { userId: 'usr-001', demoDate: D(3) });
    r = await rowAt(st, '101', D(3));
    eq([r.status, assigneeOfRow(r, 'prep'), r.departing.lateCheckout, r.departing.departureTime], ['cleaned', 'usr-008', true, LATE_CHECKOUT_TIME], 'after re-upload');
    eq([rep.statuses, rep.assignments, rep.timeOptions, rep.dropped.length], [1, 1, 1, 0], 'report');
  });
  await test('Re-upload with a moved departure drops that turnover’s status and reports it', async () => {
    const a = bk('101', D(0), D(3));
    const st = await mkStore([a]);
    await setVia(st, await rowAt(st, '101', D(3)), 'cleaned', D(3));
    const rep = await st.replaceDataset({ units: await st.getUnits(), bookings: [{ ...a, departureDate: D(4) }], source: 'test' }, { userId: 'usr-001', demoDate: D(3) });
    eq(rep.dropped.length, 1, 'dropped entries');
    eq((await rowAt(st, '101', D(3))).status, 'occupied', 'status on the old date');
  });
  await test('Late check-out on a back-to-back day is flagged as a time clash', async () => {
    const a = bk('101', D(0), D(3)), b = bk('101', D(3), D(6));
    const st = await mkStore([a, b]);
    eq((await rowAt(st, '101', D(3))).clash, false, 'normal times');
    await st.setBookingOption({ bookingId: a.id, option: 'lateCheckout', value: true, userId: 'usr-001', demoDate: D(3) });
    const r = await rowAt(st, '101', D(3));
    eq([r.clash, r.lateOut, r.departing.departureTime], [true, true, LATE_CHECKOUT_TIME], 'late check-out');
  });
  await test('Early check-in after a 09:30 check-out is fine; at the same time as check-out it is a clash', async () => {
    const a = bk('101', D(0), D(3), { departureTime: '09:30' }), b = bk('101', D(3), D(6));
    const st = await mkStore([a, b]);
    await st.setBookingOption({ bookingId: b.id, option: 'earlyCheckin', value: true, userId: 'usr-001', demoDate: D(3) });
    let r = await rowAt(st, '101', D(3));
    eq([r.clash, r.earlyIn, r.arriving.arrivalTime], [false, true, EARLY_CHECKIN_TIME], 'early only');
    await st.setBookingOption({ bookingId: a.id, option: 'lateCheckout', value: true, userId: 'usr-001', demoDate: D(3) });
    r = await rowAt(st, '101', D(3));
    eq(r.clash, true, 'early and late');
    const st2 = await mkStore([bk('201', D(0), D(3)), bk('201', D(3), D(6), { arrivalTime: '10:00' })]);
    eq((await rowAt(st2, '201', D(3))).clash, true, 'out 10:00, in 10:00');
  });
  await test('Withdrawing a late check-out restores the original time; undo guard respects newer changes', async () => {
    const a = bk('101', D(0), D(3), { departureTime: '10:30' });
    const st = await mkStore([a]);
    await st.setBookingOption({ bookingId: a.id, option: 'lateCheckout', value: true, userId: 'usr-001', demoDate: D(3) });
    await st.setBookingOption({ bookingId: a.id, option: 'lateCheckout', value: false, userId: 'usr-001', demoDate: D(3) });
    eq((await rowAt(st, '101', D(3))).departing.departureTime, '10:30', 'restored time');
    const res = await st.setBookingOption({ bookingId: a.id, option: 'lateCheckout', value: false, expectedCurrent: true, userId: 'usr-001', demoDate: D(3) });
