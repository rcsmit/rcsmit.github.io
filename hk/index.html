    opts.push([u.id, u.name, count((r) => assigneeOf(r, task) === u.id)]);
  }
  return `<div class="chips" role="group" aria-label="Show tasks for">${opts.map(([k, l, n]) =>
    `<button type="button" class="chip" data-action="work-filter" data-task="${task}" data-filter="${esc(k)}" aria-pressed="${v === k}">${esc(l)}<span class="c">${n}</span></button>`).join('')}</div>`;
}
function workEmpty(task, what) {
  const v = workFilterValue(task);
  if (v === 'mine') return emptyState(`No ${what} assigned to you`, 'Tap Everyone to see all of them.');
  if (v === 'none') return emptyState('Everything is assigned', 'Pick another filter above to see who does what.');
  return emptyState(`No ${what} in this selection`, 'Pick another filter above.');
}
function emptyState(title, text) { return `<div class="empty"><strong>${esc(title)}</strong>${esc(text)}</div>`; }
function noMatch() { return emptyState('No houses match this search', `Nothing matches “${state.search.trim()}”. Clear the search box to see everything.`); }

/* ==========================================================================
   RENDERING
   ========================================================================== */
function ensureValidSession() {
  const users = state.snap.users.filter((u) => u.role === state.role);
  if (!users.some((u) => u.id === state.userId)) state.userId = users[0] ? users[0].id : null;
  const tabs = Permissions.tabs(state.role);
  if (!tabs.includes(state.tab)) state.tab = tabs[0];
}

function renderAll() {
  ensureValidSession();
  renderHeader();
  renderSummary();
  renderTabs();
  renderView();
  renderSelBar();
  renderModal(false);
}

function renderHeader() {
  const meta = state.snap.meta;
  $('#datasetLabel').textContent = `${state.snap.units.length} houses, ${state.snap.bookings.length} bookings, ${meta.fileName ? `from ${meta.fileName}` : meta.source}`;
  $('#roleButtons').innerHTML = ROLE_ORDER.map((r) => `<button type="button" data-action="role" data-role="${r}" aria-pressed="${r === state.role}" title="${ROLE_PERMISSIONS[r].label}">${ROLE_PERMISSIONS[r].short}</button>`).join('');
  const users = state.snap.users.filter((u) => u.role === state.role);
  $('#userSelect').innerHTML = users.map((u) => `<option value="${esc(u.id)}"${u.id === state.userId ? ' selected' : ''}>${esc(u.name)}</option>`).join('');
  $('#demoDate').value = state.demoDate;
  $('#bulkBtn').hidden = !Permissions.bulkModes(state.role).length;
  $('#search').placeholder = perm().seeGuestNames ? 'Search house number or guest name' : 'Search house number';
}

function renderSummary() {
  const d = state.demoDate;
  const tabs = Permissions.tabs(state.role);
  const arrivals = state.snap.bookings.filter((b) => b.arrivalDate === d).length;
  const departures = state.snap.bookings.filter((b) => b.departureDate === d).length;
  const b2b = state.rows.filter((r) => r.backToBack).length;
  const byStatus = Object.fromEntries(STATUSES.map((s) => [s, state.rows.filter((r) => r.status === s).length]));
  const items = [
    { n: arrivals, l: 'Arrivals', c: 'var(--st-occupied)', tab: tabs.includes('movements') ? 'movements' : null },
    { n: departures, l: 'Departures', c: 'var(--st-guest_left)', tab: tabs.includes('movements') ? 'movements' : null },
    { n: b2b, l: 'Back-to-back', c: 'var(--urgent)', tab: tabs.includes('units') ? 'units' : (tabs.includes('cleans') ? 'cleans' : null), filter: tabs.includes('units') ? 'b2b' : null },
    ...STATUSES.map((s) => ({
      n: byStatus[s], l: STATUS_LABEL[s], c: `var(--st-${s})`,
      tab: tabs.includes('units') ? 'units' : (s === 'guest_left' && tabs.includes('cleans') ? 'cleans' : (s === 'cleaned' && tabs.includes('preps') ? 'preps' : null)),
      filter: tabs.includes('units') ? s : null,
    })),
  ];
  $('#summary').setAttribute('aria-label', `Summary for ${DateUtil.label(d)}`);
  $('#summary').innerHTML = items.map((it) => {
    const inner = `<span class="n">${it.n}</span><span class="l">${esc(it.l)}</span>`;
    return it.tab
      ? `<button type="button" class="tally" style="--c:${it.c}" data-action="jump" data-tab="${it.tab}" data-filter="${it.filter || ''}">${inner}</button>`
      : `<div class="tally" style="--c:${it.c}">${inner}</div>`;
  }).join('');
}

function renderTabs() {
  const count = (task, fn) => {
    const rows = state.rows.filter(fn);
    return perm().worksOn === task ? rows.filter((r) => assigneeOf(r, task) === state.userId) : rows;
  };
  const cleans = count('clean', isCleanTodo);
  const preps = count('prep', (r) => r.status === 'cleaned');
  const hot = cleans.some((r) => r.backToBack);
  const badge = { cleans: `<span class="count${hot ? ' hot' : ''}">${cleans.length}</span>`, preps: `<span class="count">${preps.length}</span>` };
  $('#tabs').innerHTML = Permissions.tabs(state.role).map((t) =>
    `<button type="button" data-action="tab" data-tab="${t}"${t === state.tab ? ' aria-current="page"' : ''}>${TAB_LABELS[t]}${badge[t] || ''}</button>`).join('');
}

function renderView() {
  const views = { units: viewUnits, movements: viewMovements, cleans: viewCleans, preps: viewPreps, period: viewPeriod, log: viewLog, admin: viewAdmin, tests: viewTests };
  state.visibleUnitIds = [];
  $('#view').innerHTML = (views[state.tab] || viewCleans)();
  state.visibleUnitIds = [...new Set(state.visibleUnitIds)];
  renderSelBar();
  if (state.tab === 'admin') bindDropZone();
  if (state.tab === 'tests' && !state.testResults && !state.testsRunning) { state.testsRunning = true; runTestsInView().finally(() => { state.testsRunning = false; }); }
}

/* ---- Houses ---- */
function viewUnits() {
  if (!state.rows.length) return emptyState('No houses loaded', 'Upload a booking file or generate demo data under Data & users.');
  const searched = state.rows.filter(matchesSearch);
  const count = (k) => (k === 'all' ? searched.length : k === 'b2b' ? searched.filter((r) => r.backToBack).length : searched.filter((r) => r.status === k).length);
  const filters = [['all', 'All'], ['b2b', 'Back-to-back'], ...STATUSES.map((s) => [s, STATUS_LABEL[s]])];
  const rows = searched.filter((r) => {
    if (state.statusFilter === 'all') return true;
    if (state.statusFilter === 'b2b') return r.backToBack;
    return r.status === state.statusFilter;
  });
  const showNames = perm().seeGuestNames;
  return `<div class="view-head"><div class="chips" role="group" aria-label="Filter by status">${filters.map(([k, l]) =>
      `<button type="button" class="chip" data-action="status-filter" data-filter="${k}" aria-pressed="${state.statusFilter === k}">${l}<span class="c">${count(k)}</span></button>`).join('')}</div>
    <div class="head-actions">${rows.length ? selectAllButton() : ''}</div></div>
    ${rows.length
      ? rowList(rows, (r) => bookingLines(r, showNames), { tasks: ['clean', 'prep'], cols: ['select', 'house', 'status', 'flags', 'out', 'in', 'clean', 'prep', 'notes', 'action'] })
      : (state.search.trim() ? noMatch() : emptyState('No houses with this status', 'Pick another filter above.'))}`;
}

/* ---- Cleans to do ---- */
function cleanSortKey(row) {
  const next = row.nextArrival ? `${row.nextArrival.arrivalDate} ${row.nextArrival.arrivalTime}` : '9999-99-99 99:99';
  const out = row.departing ? row.departing.departureTime : (row.lastDeparture ? row.lastDeparture.departureTime : '99:99');
  // back-to-back first; within that, houses the guest already left before those still due out
  return [(row.backToBack ? 0 : 2) + (row.dueOut ? 1 : 0), next, out];
}
function viewCleans() {
  const all = state.rows.filter(isCleanTodo);
  const searched = all.filter(matchesSearch).sort((a, b) => {
    const ka = cleanSortKey(a), kb = cleanSortKey(b);
    return (ka[0] - kb[0]) || ka[1].localeCompare(kb[1]) || ka[2].localeCompare(kb[2]) || naturalCompare(a.unit.houseNumber, b.unit.houseNumber);
  });
  const rows = applyWorkFilter(searched, 'clean');
  const b2b = all.filter((r) => r.backToBack).length;
  const unassigned = all.filter((r) => !assigneeOf(r, 'clean')).length;
  const stillIn = all.filter((r) => r.dueOut).length;
  const head = `<div class="view-head"><div><h2>Cleans to do</h2>
    <p>${all.length} to clean: ${all.length - stillIn} guest left, ${stillIn} still in${b2b ? `; ${b2b} back-to-back first` : ''}${unassigned ? `; ${unassigned} unassigned` : ''}.${Permissions.can(state.role, 'assignCleans') ? ' To plan tomorrow, move the date forward.' : ''}</p></div>
    <div class="head-actions">${all.length ? selectAllButton() : ''}${assignListButton(searched, 'clean')}${bulkListButton(rows, 'cleaned')}</div></div>`;
  if (!all.length) return head + emptyState(`No cleans on ${DateUtil.label(state.demoDate)}`, 'Houses appear here on their departure day, before and after the guest leaves.');
  if (!searched.length) return head + noMatch();
  const list = rows.length ? rowList(rows, (r) => {
    const out = r.departing || r.lastDeparture;
    return [
      ['Out', out ? when(out.departureDate, out.departureTime) : '<span class="muted">unknown</span>'],
      ['Next in', r.nextArrival ? when(r.nextArrival.arrivalDate, r.nextArrival.arrivalTime) : '<span class="muted">none booked</span>'],
      ...(r.dueOut && !Permissions.canSetStatus(state.role, r.status, 'guest_left') ? [['', '<span class="muted">cleaning can start once “guest left” is entered</span>']] : []),
    ];
  }, { showPill: false, tasks: ['clean'], cols: ['select', 'house', 'status', 'flags', 'out', 'in', 'clean', 'notes', 'action'] }) : workEmpty('clean', 'cleans');
  return head + workChips(searched, 'clean') + list;
}

/* ---- Preps to do ---- */
function viewPreps() {
  const key = (r) => (r.nextArrival ? `${r.nextArrival.arrivalDate} ${r.nextArrival.arrivalTime}` : '9999-99-99 99:99');
  const sortRows = (list) => list.sort((a, b) => key(a).localeCompare(key(b)) || naturalCompare(a.unit.houseNumber, b.unit.houseNumber));
  const ready = sortRows(state.rows.filter((r) => r.status === 'cleaned' && matchesSearch(r)));
  const coming = sortRows(state.rows.filter((r) => isCleanTodo(r) && matchesSearch(r)));
  const searched = [...ready, ...coming];
  const readyRows = applyWorkFilter(ready, 'prep');
  const comingRows = applyWorkFilter(coming, 'prep');
  const showNames = perm().seeGuestNames;
  const lines = (r) => [
    ['Next in', r.nextArrival ? when(r.nextArrival.arrivalDate, r.nextArrival.arrivalTime) + who(r.nextArrival, showNames) : '<span class="muted">none booked</span>'],
  ];
  const head = `<div class="view-head"><div><h2>Preps to do</h2>
    <p>${ready.length} cleaned and ready to prepare, soonest check-in first. ${coming.length} more still to be cleaned.</p></div>
    <div class="head-actions">${searched.length ? selectAllButton() : ''}${assignListButton(searched, 'prep')}${bulkListButton(readyRows, 'prepped')}</div></div>`;
  if (!searched.length) return head + (state.search.trim() ? noMatch() : emptyState('Nothing to prepare', 'Houses show up here once guests leave.'));
  const readyHtml = readyRows.length ? rowList(readyRows, lines, { showPill: false, tasks: ['prep'], cols: ['select', 'house', 'flags', 'in', 'prep', 'notes', 'action'] }) : workEmpty('prep', 'preps ready');
  const comingHtml = comingRows.length ? `<h3 class="list-title">Still to be cleaned (${comingRows.length})</h3>${rowList(comingRows, lines, { tasks: ['clean', 'prep'], cols: ['select', 'house', 'status', 'flags', 'out', 'in', 'clean', 'prep', 'notes', 'action'] })}` : '';
  return head + workChips(searched, 'prep') + `<h3 class="list-title">Ready to prep (${readyRows.length})</h3>` + readyHtml + comingHtml;
}

/* ---- Arrivals & departures ---- */
// The booking on the other side of a same-day turnover, for clash checks.
function neighbourBooking(b, option) {
  return state.snap.bookings.find((x) => x.unitId === b.unitId && x.id !== b.id
    && (option === 'lateCheckout' ? x.arrivalDate === b.departureDate : x.departureDate === b.arrivalDate)) || null;
}
function neighbourClash(b, option) {
  const other = neighbourBooking(b, option);
  return option === 'lateCheckout' ? StatusEngine.timeClash(b, other) : StatusEngine.timeClash(other, b);
}
function timeToggle(b, option) {
  const label = option === 'lateCheckout' ? `Late out ${LATE_CHECKOUT_TIME}` : `Early in ${EARLY_CHECKIN_TIME}`;
  if (!Permissions.can(state.role, 'editBookingTimes')) return b[option] ? `<span class="badge-time">${label}</span>` : '';
  return `<button type="button" class="chip chip-time" data-action="toggle-time" data-booking="${esc(b.id)}" data-option="${option}" aria-pressed="${!!b[option]}">${label}</button>`;
}
function viewMovements() {
  const showNames = perm().seeGuestNames;
  const q = state.search.trim().toLowerCase();
  const match = (b) => {
    if (!q) return true;
    const u = unitById(b.unitId);
    return (u && u.houseNumber.toLowerCase().includes(q)) || (showNames && b.guestName.toLowerCase().includes(q));
  };
  const wide = isWide();
  const days = [state.demoDate, DateUtil.addDays(state.demoDate, 1)];
  const sections = days.map((day, i) => {
    const deps = state.snap.bookings.filter((b) => b.departureDate === day && match(b)).sort((a, b) => a.departureTime.localeCompare(b.departureTime) || naturalCompare(unitById(a.unitId).houseNumber, unitById(b.unitId).houseNumber));
    const arrs = state.snap.bookings.filter((b) => b.arrivalDate === day && match(b)).sort((a, b) => a.arrivalTime.localeCompare(b.arrivalTime) || naturalCompare(unitById(a.unitId).houseNumber, unitById(b.unitId).houseNumber));
    const depUnits = new Set(state.snap.bookings.filter((b) => b.departureDate === day).map((b) => b.unitId));
    const arrUnits = new Set(state.snap.bookings.filter((b) => b.arrivalDate === day).map((b) => b.unitId));
    const parts = (b, kind) => {
      const row = state.rowByUnit.get(b.unitId);
      const unit = unitById(b.unitId);
      const option = kind === 'dep' ? 'lateCheckout' : 'earlyCheckin';
      const isB2b = kind === 'dep' ? arrUnits.has(b.unitId) : depUnits.has(b.unitId);
      let extra = '';
      if (i === 0 && row) {
        if (kind === 'arr') extra = row.status === 'prepped' ? '<span class="ready ok">Ready</span>' : `<span class="ready no">Not ready: ${STATUS_LABEL[row.status].toLowerCase()}</span>`;
        else if (row.departing && row.departing.id === b.id && Permissions.canSetStatus(state.role, row.status, 'guest_left')) extra = `<button class="btn btn-small btn-status st-guest_left" type="button" data-action="set-status" data-unit="${esc(row.unit.id)}" data-status="guest_left">Set to guest left</button>`;
        else extra = statusPill(row.status);
      }
      return {
        unitId: b.unitId,
        selected: state.selected.has(b.unitId),
        sel: selectBox(unit),
        tag: `<span class="tag small st-${i === 0 && row ? row.status : 'occupied'}"><span class="sr-only">House </span>${esc(unit.houseNumber)}</span>`,
        time: `<span class="move-time">${esc(kind === 'dep' ? b.departureTime : b.arrivalTime)}</span>`,
        guest: showNames ? `<span class="who">${esc(b.guestName)}</span>` : '',
        stay: kind === 'dep' ? `stayed from ${esc(DateUtil.label(b.arrivalDate))}` : `until ${esc(DateUtil.label(b.departureDate))}`,
        flags: `${isB2b ? '<span class="badge-b2b">Back-to-back</span>' : ''}${neighbourClash(b, option) ? '<span class="badge-b2b">Time clash</span>' : ''}`,
        extra,
        toggle: timeToggle(b, option),
      };
    };
    const li = (p) => `<li class="${p.selected ? 'is-selected' : ''}">
        ${p.sel || '<span></span>'}${p.tag}
        <div>${p.time}<div class="move-meta">${p.guest} ${p.stay} ${p.flags}</div></div>
        <div class="move-side">${p.extra}${p.toggle}</div>
      </li>`;
    const tr = (p) => `<tr class="${p.selected ? 'is-selected' : ''}">
        ${canSelect() ? `<td class="c-sel">${p.sel}</td>` : ''}
        <td class="c-house"><button type="button" class="house-link" data-action="open-unit" data-unit="${esc(p.unitId)}" title="Open details">${p.tag}</button></td>
        <td>${p.time}</td>${showNames ? `<td>${p.guest}</td>` : ''}<td>${p.stay}</td>
        <td class="c-flags"><span class="flags">${p.flags}</span></td><td>${p.extra}</td><td>${p.toggle}</td>
      </tr>`;
    const list = (arr, kind, emptyText) => {
      if (!arr.length) return `<p class="muted">${emptyText}</p>`;
      const ps = arr.map((b) => parts(b, kind));
      if (!wide) return `<ul class="move-list">${ps.map(li).join('')}</ul>`;
      const heads = [
        canSelect() ? '<th class="c-sel"><span class="sr-only">Select</span></th>' : '',
        '<th class="c-house">House</th>',
        `<th>${kind === 'dep' ? 'Check-out' : 'Check-in'}</th>`,
        showNames ? '<th>Guest</th>' : '',
        `<th>${kind === 'dep' ? 'Stay' : 'Stays'}</th>`,
        '<th class="c-flags">Flags</th>',
        `<th>${i === 0 ? (kind === 'dep' ? 'Status' : 'House ready?') : ''}</th>`,
        `<th>${kind === 'dep' ? 'Late check-out' : 'Early check-in'}</th>`,
      ].join('');
      return `<div class="table-wrap"><table class="dtable"><thead><tr>${heads}</tr></thead><tbody>${ps.map(tr).join('')}</tbody></table></div>`;
    };
    const title = i === 0 ? DateUtil.label(day) : `Next day, ${DateUtil.label(day)}`;
    return `<section class="panel"><h2>${esc(title)}</h2>
      <div class="${wide ? 'stack' : 'cols'}">
        <div><h3>Departures (${deps.length})</h3>${list(deps, 'dep', q ? 'No matching departures.' : 'No departures.')}</div>
        <div><h3>Arrivals (${arrs.length})</h3>${list(arrs, 'arr', q ? 'No matching arrivals.' : 'No arrivals.')}</div>
      </div></section>`;
  });
  return `<div class="view-head"><div><h2>Arrivals & departures</h2>
    <p>Who leaves and who arrives, with check-out and check-in times. For arrivals on the working date you can see whether the house is ready.</p></div>
    <div class="head-actions">${selectAllButton()}</div></div>${sections.join('')}`;
}

/* ---- Period report ---- */
function periodData() {
  let from = state.periodFrom, to = state.periodTo, message = '';
  if (!DateUtil.isISO(from) || !DateUtil.isISO(to)) return { error: 'Choose both a start and an end date.' };
  if (from > to) return { error: 'The start date is after the end date. Swap them to see the report.' };
  if (DateUtil.diff(from, to) > 365) { to = DateUtil.addDays(from, 365); message = `Showing the first 366 days, up to ${DateUtil.label(to)}.`; }
  return { from, to, message, ...StatusEngine.periodStats(state.snap.bookings, from, to) };
}
function periodChart(days) {
  const max = Math.max(1, ...days.flatMap((d) => [d.departures, d.arrivals, d.b2b]));
  const step = Math.max(1, Math.ceil(max / 4));
  const top = Math.ceil(max / step) * step;
  const groupW = 38, barW = 9, gap = 2, padL = 30, padR = 8, padT = 10, padB = 36, H = 210;
  const W = padL + days.length * groupW + padR;
  const plotH = H - padT - padB;
  const y = (v) => padT + plotH - (v / top) * plotH;
  const labelEvery = Math.ceil(days.length / 40);
  let svg = '';
  for (let v = 0; v <= top; v += step) {
    svg += `<line class="grid-line" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  days.forEach((d, i) => {
    const x0 = padL + i * groupW + (groupW - (3 * barW + 2 * gap)) / 2;
    [['bar-dep', d.departures, 'departures'], ['bar-arr', d.arrivals, 'arrivals'], ['bar-b2b', d.b2b, 'back-to-back']].forEach(([cls, v, name], k) => {
      if (v > 0) svg += `<rect class="${cls}" x="${x0 + k * (barW + gap)}" y="${y(v)}" width="${barW}" height="${y(0) - y(v)}" rx="1.5"><title>${esc(DateUtil.label(d.date))}: ${v} ${name}</title></rect>`;
    });
    if (i % labelEvery === 0) {
      const cx = padL + i * groupW + groupW / 2;
      svg += `<text x="${cx}" y="${H - padB + 15}" text-anchor="middle">${DateUtil.parse(d.date).getDate()}</text><text x="${cx}" y="${H - padB + 28}" text-anchor="middle">${esc(DateUtil.weekday(d.date).slice(0, 2))}</text>`;
    }
  });
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Departures, arrivals and back-to-back turnovers per day">${svg}</svg></div>
    <div class="legend"><span style="--k:var(--st-guest_left)">Departures</span><span style="--k:var(--st-occupied)">Arrivals</span><span style="--k:var(--urgent)">Back-to-back</span></div>`;
}
function viewPeriod() {
  const data = periodData();
  const canExport = perm().exportReports;
  const controls = `<div class="period-controls no-print">
      <label>From<input type="date" id="periodFrom" value="${esc(state.periodFrom || '')}"></label>
      <label>To<input type="date" id="periodTo" value="${esc(state.periodTo || '')}"></label>
      ${canExport && !data.error ? '<button class="btn" type="button" data-action="export-period">Export CSV</button><button class="btn" type="button" data-action="print-period">Print</button>' : ''}
    </div>`;
  let body;
  if (data.error) body = `<div class="message error">${esc(data.error)}</div>`;
  else {
    const t = data.totals;
    body = `${data.message ? `<div class="message warning">${esc(data.message)}</div>` : ''}
      <div class="totals">
        <div class="tally" style="--c:var(--st-guest_left)"><span class="n">${t.departures}</span><span class="l">Departures</span></div>
        <div class="tally" style="--c:var(--st-occupied)"><span class="n">${t.arrivals}</span><span class="l">Arrivals</span></div>
        <div class="tally" style="--c:var(--urgent)"><span class="n">${t.b2b}</span><span class="l">Back-to-back turnovers</span></div>
      </div>
      ${periodChart(data.days)}
      <div class="table-wrap"><table>
        <thead><tr><th>Date</th><th class="num">Departures</th><th class="num">Arrivals</th><th class="num">Back-to-back</th></tr></thead>
        <tbody>${data.days.map((d) => `<tr><td>${esc(DateUtil.label(d.date))}</td><td class="num">${d.departures}</td><td class="num">${d.arrivals}</td><td class="num">${d.b2b}</td></tr>`).join('')}
        <tr class="total"><td>Total</td><td class="num">${t.departures}</td><td class="num">${t.arrivals}</td><td class="num">${t.b2b}</td></tr></tbody>
      </table></div>`;
  }
  const range = data.error ? '' : `${DateUtil.label(data.from)} to ${DateUtil.label(data.to)}`;
  return `<section class="panel" id="periodReport">
    <div class="view-head"><div><h2>Period report</h2><p>${esc(range || 'Pick a date range.')} A back-to-back turnover is a departure and an arrival on the same house on the same day.</p></div>${controls}</div>
    ${body}</section>`;
}

/* ---- Activity log ---- */
function describeActivity(a) {
  const house = a.houseNumber ? `House ${esc(a.houseNumber)}: ` : '';
  if (a.type === 'status') {
    const change = `${esc(STATUS_LABEL[a.from] || a.from || '?')} → ${esc(STATUS_LABEL[a.to] || a.to)}`;
    return `${house}${change}${a.message ? ` <span class="muted">(${esc(a.message)})</span>` : ''}`;
  }
  return `${house}${esc(a.message || '')}`;
}
const LOG_CATEGORIES = {
  status: 'Status change (manual)',
  auto: 'Status change (automatic)',
  undo: 'Undo',
  assign: 'Assignment',
  booking: 'Check-in/out times',
  note: 'Notes',
  data: 'Data upload',
  admin: 'Users and settings',
};
function logCategory(a) {
  if (a.message && (a.message === 'Undo' || /undone$/.test(a.message))) return 'undo';
  if (a.type === 'status') return a.source === 'auto' ? 'auto' : 'status';
  if (a.type === 'user' || a.type === 'setting') return 'admin';
  return a.type;
}
function logDay(a) { return a.demoDate || DateUtil.toISO(new Date(a.at)); }
function houseMatcher(text) {
  const tokens = String(text).split(/[\s,;]+/).map((t) => t.trim().toLowerCase()).filter(Boolean);
  if (!tokens.length) return null;
  return (house) => {
    if (!house) return false;
    const h = String(house).toLowerCase();
    return tokens.some((t) => {
      if (t === h) return true;
      const range = t.match(/^(\d+)\s*[-–]\s*(\d+)$/);
      if (range && /^\d+$/.test(h)) { const lo = Math.min(+range[1], +range[2]), hi = Math.max(+range[1], +range[2]); return +h >= lo && +h <= hi; }
      return /^\d+$/.test(t) && /^\d+$/.test(h) && Number(t) === Number(h);
    });
  };
}
function filteredLog() {
  const f = state.logFilter;
  const q = state.search.trim().toLowerCase();
  const houseOk = houseMatcher(f.house);
  return [...state.snap.activity].reverse().filter((a) => {
    if (f.day && logDay(a) !== f.day) return false;
    if (f.person && a.userId !== f.person) return false;
    if (f.action && logCategory(a) !== f.action) return false;
    if (houseOk && !houseOk(a.houseNumber)) return false;
    if (q) {
      const text = [a.houseNumber, userName(a.userId), a.message, STATUS_LABEL[a.from], STATUS_LABEL[a.to], LOG_CATEGORIES[logCategory(a)]].filter(Boolean).join(' ').toLowerCase();
      if (!text.includes(q)) return false;
    }
    return true;
  });
}
function logResultsHtml() {
  const all = state.snap.activity;
  const list = filteredLog();
  const shown = list.slice(0, state.logLimit);
  const filtered = list.length !== all.length;
  const summary = `<p class="hint" role="status">${filtered ? `${list.length} of ${all.length} entries match` : `${all.length} entries`}, newest first.</p>`;
  if (!all.length) return emptyState('No activity yet', 'Status changes, notes and uploads will be listed here.');
  if (!list.length) return summary + emptyState('No matching activity', 'Change or clear the filters.');
  return summary + `<section class="panel"><ul class="log">${shown.map((a) => `<li>
      <time datetime="${esc(a.at)}">${esc(DateUtil.stamp(a.at))}</time>
      <div>${describeActivity(a)}<div class="muted">${esc(userName(a.userId))}${a.demoDate ? `, working date ${esc(DateUtil.label(a.demoDate))}` : ''}<span class="src">${esc(LOG_CATEGORIES[logCategory(a)] || a.type)}</span></div></div>
    </li>`).join('')}</ul>
    ${list.length > shown.length ? `<div class="row-actions"><button class="btn" type="button" data-action="log-more">Show ${Math.min(100, list.length - shown.length)} more</button></div>` : ''}</section>`;
}

function parseHouseList(text, rows) {
  const byNumber = new Map(rows.map((r) => [r.unit.houseNumber.toLowerCase(), r]));
  const found = [], unknown = [], seen = new Set();
  const add = (r) => { if (!seen.has(r.unit.id)) { seen.add(r.unit.id); found.push(r); } };
  for (const token of String(text).split(/[\s,;]+/).map((t) => t.trim()).filter(Boolean)) {
    const key = token.toLowerCase();
    if (byNumber.has(key)) { add(byNumber.get(key)); continue; }
    const range = key.match(/^(\d+)\s*[-–]\s*(\d+)$/);
    if (range) {
      let a = Number(range[1]), b = Number(range[2]);
      if (a > b) [a, b] = [b, a];
      if (b - a > 2000) { unknown.push(token); continue; }
      let hit = false;
      for (let n = a; n <= b; n++) { const r = byNumber.get(String(n)); if (r) { add(r); hit = true; } }
      if (!hit) unknown.push(token);
      continue;
    }
    if (/^\d+$/.test(key) && byNumber.has(String(Number(key)))) { add(byNumber.get(String(Number(key)))); continue; }
    unknown.push(token);
  }
  return { found, unknown };
}
function bulkPlan(m) {
  const { found, unknown } = parseHouseList(m.text, state.rows);
  const change = [], already = [], blocked = [];
  for (const r of found) {
    if (m.mode === 'status') {
      if (r.status === m.target) already.push(r);
      else if (Permissions.canSetStatus(state.role, r.status, m.target)) change.push(r);
      else blocked.push(r);
    } else {
      const target = m.assignee || null;
      if (!Permissions.canAssign(state.role, m.mode, r)) blocked.push(r);
      else if (assigneeOf(r, m.mode) === target) already.push(r);
      else change.push(r);
    }
  }
  const byHouse = (a, b) => naturalCompare(a.unit.houseNumber, b.unit.houseNumber);
  return { change: change.sort(byHouse), already: already.sort(byHouse), blocked: blocked.sort(byHouse), unknown };
}
function defaultBulkTarget() {

  return ['cleaned', 'prepped', 'guest_left', 'occupied'].find((s) => allowed.includes(s)) || allowed[0];

  if (plan.already.length) html += `<div class="bulk-group"><h3>Already ${esc(what)} (${plan.already.length})</h3>${miniTags(plan.already)}</div>`;
  if (plan.blocked.length) {

      why = perm().anyTransition ? '' : `Your role can only set houses to ${STATUS_LABEL[m.target].toLowerCase()} when they are ${prev ? STATUS_LABEL[prev].toLowerCase() : 'in the right step'}.`;
    } else {

    html += `<div class="bulk-group"><h3>Skipped (${plan.blocked.length})</h3><p>${why} Colours show the current status.</p>${miniTags(plan.blocked)}</div>`;
  }
  if (plan.unknown.length) html += `<div class="bulk-group"><h3>Not found (${plan.unknown.length})</h3><p>${plan.unknown.map(esc).join(', ')}</p></div>`;

async function applyBulk() {
  const m = state.modal;
  if (!m || m.type !== 'bulk' || !Permissions.bulkModes(state.role).includes(m.mode)) return;
  const plan = bulkPlan(m);
  if (!plan.change.length) { toast('Nothing to change.', 'error'); return; }
  const n = plan.change.length;
  const houses = `${n} house${n > 1 ? 's' : ''}`;
  const skipped = plan.blocked.length + plan.unknown.length;
  const skippedText = skipped ? ` ${skipped} skipped.` : '';
  if (m.mode === 'status') {
    const writes = plan.change.map((r) => ({ r, w: StatusEngine.writePlan(r, m.target) }));
    const undoItems = writes.map(({ r, w }) => {
      const existing = r.unit.statusOverrides[w.cycleKey];
      return { unitId: r.unit.id, cycleKey: w.cycleKey, previousOverride: existing ? { ...existing } : null, expectedStatus: w.clear ? null : m.target, fromStatus: m.target, toStatus: r.status };
    });
    await DataStore.bulkUpdateStatus({
      items: writes.map(({ r, w }) => ({ unitId: r.unit.id, cycleKey: w.cycleKey, fromStatus: r.status, clear: w.clear })),
      status: m.target, userId: state.userId, demoDate: state.demoDate,
    });
    state.selected.clear();
    closeModal();
    await refresh();
    toast(`${houses} set to ${STATUS_LABEL[m.target].toLowerCase()}.${skippedText}`, 'ok', {
      what: `${houses} back to the previous status`,
      run: () => DataStore.restoreOverrides({ items: undoItems, userId: state.userId, demoDate: state.demoDate }),
    });
  } else {
    const res = await DataStore.assign({
      items: plan.change.map((r) => ({ unitId: r.unit.id, cycleKey: r.cycleKey })),
      task: m.mode, assigneeId: m.assignee || null, userId: state.userId, demoDate: state.demoDate,
    });
    state.selected.clear();
    closeModal();
    await refresh();
    toast(`${houses} ${bulkChangeLabel(m)}.${skippedText}`, 'ok', {
      what: `${houses} back to the previous assignment`,
      run: () => DataStore.restoreAssignments({ items: res.previous, userId: state.userId, demoDate: state.demoDate }),
    });
  }
}

/* Demo only: spread today's work over the staff so every role has something to see */
async function seedAssignments() {
  const snap = await loadSnapshot();
  const rows = StatusEngine.deriveAll(snap, state.demoDate);
  const byRole = (role) => snap.users.filter((u) => u.role === role);
  const planner = byRole('cleaning')[0];
  const manager = byRole('management')[0];
  const plan = async (task, list, actor) => {
    const staff = byRole(TASKS[task].assigneeRole);
    if (!staff.length || !actor) return;
    for (let i = 0; i < staff.length; i++) {
      const items = list.filter((_, k) => k % staff.length === i).map((r) => ({ unitId: r.unit.id, cycleKey: r.cycleKey }));
      if (items.length) await DataStore.assign({ items, task, assigneeId: staff[i].id, userId: actor.id, demoDate: state.demoDate });
    }
  };
  const rep = byRole('rep')[0];
  // Demo history: earlier turnovers were cleaned and prepped, except one forgotten house
  const backlog = rows.filter((r) => !r.dueOut && r.status === 'guest_left' && r.lastDeparture && r.lastDeparture.departureDate < state.demoDate);
  const done = backlog.slice(1);
  if (rep && done.length) {
    await DataStore.bulkUpdateStatus({ items: done.map((r) => ({ unitId: r.unit.id, cycleKey: r.cycleKey, fromStatus: r.status })), status: 'prepped', userId: rep.id, demoDate: state.demoDate });
  }
  // About half of today's departures already confirmed as left by a rep
  const due = rows.filter((r) => r.dueOut);
  const left = due.filter((_, k) => k % 2 === 0);
  if (rep && left.length) {
    await DataStore.bulkUpdateStatus({ items: left.map((r) => ({ unitId: r.unit.id, cycleKey: r.cycleKey, fromStatus: r.status })), status: 'guest_left', userId: rep.id, demoDate: state.demoDate });
  }
  const cleans = due.sort((a, b) => Number(b.backToBack) - Number(a.backToBack));
  await plan('clean', cleans.slice(0, Math.ceil(cleans.length * 0.7)), planner);
  await plan('prep', cleans.filter((r) => r.backToBack), manager);
}

function renderModal(focus) {
  const root = $('#modal');
  if (!state.modal) { root.innerHTML = ''; root.hidden = true; document.body.classList.remove('modal-open'); return; }
  let content = '';
  let draft = null;
  const ta = root.querySelector('#unitNotes');
  if (state.modal.type === 'unit') {
    const row = state.rowByUnit.get(state.modal.unitId);
    if (!row) { state.modal = null; renderModal(false); return; }
    if (ta && ta.dataset.unit === state.modal.unitId && ta.value !== row.unit.notes) draft = ta.value;
    content = unitModalHtml(row);
  } else if (state.modal.type === 'export') content = exportModalHtml(state.modal);
  else if (state.modal.type === 'confirm') content = confirmModalHtml(state.modal);
  else if (state.modal.type === 'bulk') content = bulkModalHtml(state.modal);
  root.hidden = false;
  document.body.classList.add('modal-open');
  root.innerHTML = `<div class="overlay" data-action="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" tabindex="-1">${content}</div></div>`;
  if (draft !== null) { const t = root.querySelector('#unitNotes'); if (t) t.value = draft; }
  if (focus) root.querySelector('.dialog').focus();
}
function openModal(modal) {
  if (!state.modal) lastFocus = document.activeElement;
  state.modal = modal;
  renderModal(true);
}
function closeModal() {
  state.modal = null;
  renderModal(false);
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  lastFocus = null;
}

async function setDemoDate(newDate) {
  if (!DateUtil.isISO(newDate) || newDate === state.demoDate) { $('#demoDate').value = state.demoDate; return; }
  const before = new Map(state.rows.map((r) => [r.unit.id, r.status]));
  const after = StatusEngine.deriveAll(state.snap, newDate);
  const changes = after.filter((r) => before.get(r.unit.id) !== r.status);
  if (changes.length) {
    await DataStore.logChanges(changes.map((r) => ({
      type: 'status', source: 'auto', unitId: r.unit.id, houseNumber: r.unit.houseNumber,
      from: before.get(r.unit.id), to: r.status, userId: SYSTEM_USER.id, demoDate: newDate, cycleKey: r.cycleKey,
    })));
  }
  state.demoDate = newDate;
  await refresh();
}

async function setStatus(unitId, toStatus) {
  const row = state.rowByUnit.get(unitId);
  if (!row) return;
  if (!Permissions.canSetStatus(state.role, row.status, toStatus)) {
    toast(`${ROLE_PERMISSIONS[state.role].label} can’t change ${STATUS_LABEL[row.status].toLowerCase()} to ${STATUS_LABEL[toStatus].toLowerCase()}.`, 'error');
    return;
  }
  const plan = StatusEngine.writePlan(row, toStatus);
  const existing = row.unit.statusOverrides[plan.cycleKey];
  const previousOverride = existing ? { ...existing } : null;
  if (plan.clear) {
    await DataStore.clearStatusOverride({ unitId, cycleKey: plan.cycleKey, fromStatus: row.status, toStatus, userId: state.userId, demoDate: state.demoDate, reason: row.earlyDeparture ? 'Early departure reversed' : 'Back to automatic status' });
  } else {
    await DataStore.updateStatus({ unitId, cycleKey: plan.cycleKey, status: toStatus, fromStatus: row.status, userId: state.userId, demoDate: state.demoDate });
  }
  await refresh();
  const early = row.status === 'occupied' && !plan.clear && plan.cycleKey !== row.cycleKey;
  toast(`House ${row.unit.houseNumber} set to ${STATUS_LABEL[toStatus].toLowerCase()}${early ? ' (guest left early)' : ''}.`, 'ok', {
    what: `house ${row.unit.houseNumber} is ${STATUS_LABEL[row.status].toLowerCase()} again`,
    run: () => DataStore.restoreOverrides({ items: [{ unitId, cycleKey: plan.cycleKey, previousOverride, expectedStatus: plan.clear ? null : toStatus, fromStatus: toStatus, toStatus: row.status }], userId: state.userId, demoDate: state.demoDate }),
  });
}

async function setBookingOption(bookingId, option, value) {
  if (!Permissions.can(state.role, 'editBookingTimes')) { toast('Your role can’t change check-in or check-out times.', 'error'); await refresh(); return; }
  const res = await DataStore.setBookingOption({ bookingId, option, value, userId: state.userId, demoDate: state.demoDate });
  await refresh();
  if (!res.changed) return;
  const b = res.booking;
  const house = (unitById(b.unitId) || {}).houseNumber || '';
  const other = neighbourBooking(b, option);
  const clash = option === 'lateCheckout' ? StatusEngine.timeClash(b, other) : StatusEngine.timeClash(other, b);
  const what = option === 'lateCheckout'
    ? (value ? `late check-out ${LATE_CHECKOUT_TIME}` : `check-out back to ${b.baseDepartureTime}`)
    : (value ? `early check-in ${EARLY_CHECKIN_TIME}` : `check-in back to ${b.baseArrivalTime}`);
  const clashText = clash ? ` Time clash: out ${option === 'lateCheckout' ? b.departureTime : other.departureTime}, next in ${option === 'lateCheckout' ? other.arrivalTime : b.arrivalTime}.` : '';
  toast(`House ${house}: ${what}.${clashText}`, clash ? 'error' : 'ok', {
    what: `house ${house} has its previous time again`,
    run: async () => {
      const r = await DataStore.setBookingOption({ bookingId, option, value: !value, expectedCurrent: !!value, userId: state.userId, demoDate: state.demoDate });
      return { restored: r.changed ? 1 : 0, skipped: r.changed ? 0 : 1 };
    },
  });
}

async function handleUpload(file) {
  if (!file) return;
  if (!Permissions.can(state.role, 'manageData')) { toast('Only management can upload data.', 'error'); return; }
  state.uploadReport = { status: 'working', message: `Reading ${file.name}…` };
  renderView();
  try {
    const matrix = await SpreadsheetImport.readMatrix(file);
    const result = SpreadsheetImport.toDataset(matrix);
    if (!result.bookings.length) {
      state.uploadReport = { status: 'error', message: `No usable bookings in “${file.name}”. Nothing was changed.`, errors: result.errors, warnings: [] };
    } else {
      const carry = await DataStore.replaceDataset({ units: result.units, bookings: result.bookings, source: 'uploaded file', fileName: file.name }, { userId: state.userId, demoDate: state.demoDate });
      const skipped = result.errors.length ? ` ${result.errors.length} row${result.errors.length > 1 ? 's were' : ' was'} skipped.` : '';
      const kept = carry.statuses + carry.assignments + carry.timeOptions
        ? ` Kept ${carry.statuses} manual status${carry.statuses === 1 ? '' : 'es'}, ${carry.assignments} assignment${carry.assignments === 1 ? '' : 's'} and ${carry.timeOptions} early/late option${carry.timeOptions === 1 ? '' : 's'} that still match a booking.` : '';
      state.uploadReport = {
        status: result.errors.length || result.warnings.length || carry.dropped.length ? 'warning' : 'ok',
        message: `Imported ${result.bookings.length} bookings for ${result.units.length} houses from “${file.name}”.${skipped}${kept}`,
        errors: result.errors, warnings: result.warnings, dropped: carry.dropped,
      };
      state.modal = null;
    }
  } catch (err) {
    state.uploadReport = { status: 'error', message: err.message || 'The file couldn’t be read.', errors: [], warnings: [] };
  }
  await refresh();
}

function downloadText(filename, text) {
  try {
    const blob = new Blob(['\uFEFF' + text], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return true;
  } catch (e) { return false; }
}
async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* fall back to selection copy below */ }
  const ta = $('#exportText');
  if (!ta) return false;
  ta.focus();
  ta.select();
  try { return document.execCommand('copy'); } catch (e) { return false; }
}

async function onClick(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  if (action === 'overlay' && e.target !== el) return;
  try {
    switch (action) {
      case 'role':
        state.role = el.dataset.role; state.userId = null; state.statusFilter = 'all'; state.modal = null; state.workFilter = { clean: null, prep: null }; state.selected.clear();
        renderAll();
        toast(`Now logged in as ${ROLE_PERMISSIONS[state.role].label}.`);
        break;
      case 'tab': state.tab = el.dataset.tab; renderTabs(); renderView(); break;
      case 'jump':
        state.tab = el.dataset.tab;
        if (el.dataset.filter) state.statusFilter = el.dataset.filter;
        renderTabs(); renderView();
        break;
      case 'status-filter': state.statusFilter = el.dataset.filter; renderView(); break;
      case 'date-prev': await setDemoDate(DateUtil.addDays(state.demoDate, -1)); break;
      case 'date-next': await setDemoDate(DateUtil.addDays(state.demoDate, 1)); break;
      case 'date-today': await setDemoDate(DateUtil.today()); break;
      case 'set-status': await setStatus(el.dataset.unit, el.dataset.status); break;
      case 'clear-override': await clearOverride(el.dataset.unit); break;
      case 'open-unit': openModal({ type: 'unit', unitId: el.dataset.unit }); break;
      case 'save-notes': await saveNotes(el.dataset.unit); break;
      case 'overlay':
      case 'close-modal': closeModal(); break;
      case 'export-period': exportPeriod(); break;
      case 'print-period':
        try { window.print(); } catch (err) { toast('Printing isn’t available here. Export the CSV instead.', 'error'); }
        break;
      case 'download-export':
        if (state.modal && state.modal.type === 'export') {
          if (!downloadText(state.modal.filename, exportCsv(state.modal))) toast('The download was blocked. Use Copy CSV instead.', 'error');
        }
        break;
      case 'copy-export':
        if (state.modal && state.modal.type === 'export') toast(await copyText(exportCsv(state.modal)) ? 'CSV copied.' : 'Copying failed. Select the text and copy it by hand.', 'ok');
        break;
      case 'download-template': openTemplate(); break;
      case 'regenerate': await regenerate(); break;
      case 'add-user': await addUser(); break;
      case 'delete-user': {
        const u = state.userById.get(el.dataset.user);
        if (u) openModal({ type: 'confirm', kind: 'delete-user', payload: u.id, title: `Delete ${u.name}?`, message: `${u.name} (${ROLE_PERMISSIONS[u.role].label}) will lose access. Their past activity stays in the log.`, confirmLabel: 'Delete user' });
        break;
      }
      case 'confirm-yes': await runConfirmed(); break;
      case 'open-bulk': openBulk(el.dataset.houses, { mode: el.dataset.mode, target: el.dataset.target }); break;
      case 'work-filter': state.workFilter[el.dataset.task] = el.dataset.filter; renderView(); break;
      case 'bulk-apply': await applyBulk(); break;
      case 'toast-undo': await undoLast(); break;
      case 'bulk-selected': openBulk(selectedHouses().join(' '), {}); break;
      case 'select-visible':
        state.visibleUnitIds.forEach((id) => state.selected.add(id));
        renderView();
        toast(`${state.selected.size} house${state.selected.size === 1 ? '' : 's'} selected.`);
        break;
      case 'select-clear': state.selected.clear(); renderView(); break;
      case 'log-more': state.logLimit += 100; updateLogResults(); break;
      case 'log-clear': state.logFilter = { day: '', person: '', action: '', house: '' }; state.logLimit = 100; renderView(); break;
      case 'log-export': exportLog(); break;
      case 'run-tests': await runTestsInView(); break;
      case 'toggle-time': {
        const b = state.snap.bookings.find((x) => x.id === el.dataset.booking);
        if (b) await setBookingOption(b.id, el.dataset.option, !b[el.dataset.option]);
        break;
      }
      default: break;
    }
  } catch (err) {
    console.error(err);
    toast(err.message || 'Something went wrong.', 'error');
  }
}

async function onChange(e) {
  const t = e.target;
  try {
    if (t.id === 'userSelect') { state.userId = t.value; state.workFilter = { clean: null, prep: null }; renderTabs(); renderView(); toast(`Now logged in as ${userName(state.userId)}.`); }
    else if (t.dataset.change === 'select') toggleSelected(t.dataset.unit, t.checked);
    else if (t.dataset.change === 'assign') await assignTask(t.dataset.unit, t.dataset.task, t.value);
    else if (t.dataset.change === 'booking-option') await setBookingOption(t.dataset.booking, t.dataset.option, t.checked);
    else if (t.name === 'csvSep') { state.csvSep = t.value; renderModal(false); const r = document.querySelector('input[name="csvSep"]:checked'); if (r) r.focus(); }
    else if (['logDay', 'logPerson', 'logAction'].includes(t.id)) {
      state.logFilter[{ logDay: 'day', logPerson: 'person', logAction: 'action' }[t.id]] = t.value;
      state.logLimit = 100;
      renderView();
      const again = $(`#${t.id}`); if (again) again.focus();
    }
    else if (t.name === 'bulkMode') setBulkMode(t.value);
    else if (t.name === 'bulkAssignee' && state.modal && state.modal.type === 'bulk') { state.modal.assignee = t.value || null; updateBulkPreview(); }
    else if (t.id === 'demoDate') await setDemoDate(t.value);
    else if (t.name === 'bulkTarget' && state.modal && state.modal.type === 'bulk') { state.modal.target = t.value; updateBulkPreview(); }
    else if (t.id === 'periodFrom' || t.id === 'periodTo') {
      if (t.id === 'periodFrom') state.periodFrom = t.value; else state.periodTo = t.value;
      renderView();
      const next = $(`#${t.id}`);
      if (next) next.focus();
    } else if (t.id === 'fileInput') { const f = t.files && t.files[0]; t.value = ''; await handleUpload(f); }
    else if (t.id === 'assumeToggle') {
      await DataStore.updateSettings({ assumePastTurnoversDone: t.checked }, { userId: state.userId, demoDate: state.demoDate });
      await refresh();
    } else if (t.dataset.change === 'user-role') await updateUserField(t.dataset.user, 'role', t.value);
    else if (t.dataset.change === 'user-name') await updateUserField(t.dataset.user, 'name', t.value);
    else if (t.dataset.change === 'user-email') await updateUserField(t.dataset.user, 'email', t.value);
  } catch (err) {
    console.error(err);
    toast(err.message || 'Something went wrong.', 'error');
  }
}

function onKeydown(e) {
  if (!state.modal) return;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && state.modal.type === 'bulk') { e.preventDefault(); applyBulk().catch((err) => toast(err.message, 'error')); return; }
  if (e.key === 'Tab') {
    const dialog = $('#modal .dialog');
    if (!dialog) return;
    const focusables = [...dialog.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter((x) => !x.disabled);
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement === dialog)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
}

function bindDropZone() {
  const zone = $('#dropZone');
  if (!zone) return;
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('over');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    handleUpload(f).catch((err) => toast(err.message, 'error'));
  });
}

async function init() {
  const today = DateUtil.today();
  const seed = Number(today.replace(/-/g, ''));
  await DataStore.init({ users: SEED_USERS, ...generateFakeDataset(today, seed) });
  state.demoDate = today;
  state.periodFrom = DateUtil.addDays(today, -4);
  state.periodTo = DateUtil.addDays(today, 10);
  await seedAssignments();
  try {
    const mq = window.matchMedia(WIDE_QUERY);
    const onChangeWidth = () => { if (state.snap) renderView(); };
    if (mq.addEventListener) mq.addEventListener('change', onChangeWidth); else if (mq.addListener) mq.addListener(onChangeWidth);
  } catch (e) { /* no matchMedia: phone layout */ }
  document.addEventListener('click', (e) => { onClick(e); });
  document.addEventListener('change', (e) => { onChange(e); });
  document.addEventListener('keydown', onKeydown);
  $('#search').addEventListener('input', (e) => { state.search = e.target.value; renderView(); });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'bulkInput' && state.modal && state.modal.type === 'bulk') { state.modal.text = e.target.value; updateBulkPreview(); }
    if (e.target.id === 'logHouse') { state.logFilter.house = e.target.value; state.logLimit = 100; updateLogResults(); }
  });
  await refresh();
}

init().catch((err) => {
  console.error(err);
  document.getElementById('view').innerHTML = `<div class="message error"><strong>The board couldn’t start.</strong> ${esc(err.message)}</div>`;
});
</script>
</body>
