<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>Citymaps</title>
<style>
/* Layout idea: a header and one responsive grid of image cards, one card per city map. */
:root {
  --bg: #f3f1ec;
  --surface: #ffffff;
  --ink: #1c1f24;
  --muted: #666b73;
  --line: #d9d6cd;
  --accent: #b3402a;
  --placeholder: #dcd8cc;
  --display: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a;
    --surface: #1d2025;
    --ink: #eceef1;
    --muted: #9aa0a8;
    --line: #2d3138;
    --accent: #ff8a70;
    --placeholder: #2a2e35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161a;
  --surface: #1d2025;
  --ink: #eceef1;
  --muted: #9aa0a8;
  --line: #2d3138;
  --accent: #ff8a70;
  --placeholder: #2a2e35;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  line-height: 1.5;
}
main {
  max-width: 960px;
  margin: 0 auto;
  padding: 32px 16px 56px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
header h1 {
  font-family: var(--display);
  font-size: clamp(1.75rem, 5vw, 2.5rem);
  line-height: 1.1;
  margin: 0;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
header p { margin: 8px 0 0; color: var(--muted); }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.card {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  color: inherit;
  text-decoration: none;
  transition: transform 0.15s ease, border-color 0.15s ease;
}
.card:hover { transform: translateY(-3px); border-color: var(--accent); }
.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.thumb {
  position: relative;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  background: var(--placeholder);
  display: flex;
  align-items: center;
  justify-content: center;
}
.thumb img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}
.thumb .fallback {
  font-family: var(--display);
  font-size: 1.5rem;
  color: var(--muted);
  padding: 8px;
  text-align: center;
}
.label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  padding: 12px 14px;
}
.label strong { font-family: var(--display); font-size: 1.15rem; }
.label span { color: var(--accent); font-size: 0.9rem; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
  .card:hover { transform: none; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Citymaps</h1>
    <p>Curated maps of the cities I know. Pick a city.</p>
  </header>
  <ul class="grid" id="grid"></ul>
</main>

<script>
// version = "20261107-174400"
(function () {
  "use strict";

  var BASE = "https://rcsmit.github.io";
  var CITIES = [
    { slug: "rome", name: "Rome" },
    { slug: "hamburg", name: "Hamburg" },
    { slug: "berlin", name: "Berlin" },
    { slug: "chiangmai", name: "Chiang Mai" }
  ];

  var grid = document.getElementById("grid");

  CITIES.forEach(function (city) {
    var li = document.createElement("li");

    var a = document.createElement("a");
    a.className = "card";
    a.href = BASE + "/" + city.slug + "/";
    a.setAttribute("aria-label", "Open the map of " + city.name);

    var thumb = document.createElement("div");
    thumb.className = "thumb";

    var img = document.createElement("img");
    img.src = BASE + "/img/" + city.slug + ".png";
    img.alt = "";
    img.loading = "lazy";
    img.addEventListener("error", function () {
      thumb.removeChild(img);
      var fb = document.createElement("div");
      fb.className = "fallback";
      fb.textContent = city.name;
      thumb.appendChild(fb);
    });
    thumb.appendChild(img);

    var label = document.createElement("div");
    label.className = "label";
    var strong = document.createElement("strong");
    strong.textContent = city.name;
    var go = document.createElement("span");
    go.textContent = "Open map →";
    label.appendChild(strong);
    label.appendChild(go);

    a.appendChild(thumb);
    a.appendChild(label);
    li.appendChild(a);
    grid.appendChild(li);
  });
})();
</script>
</body>
</html>
