const dc=p=>Math.hypot(...xy(p));
function trim(path){let a=0,b=path.length-1;while(dc(path[a])<=R_CLEAR)a++;while(dc(path[b])<=R_CLEAR)b--;return path.slice(a,b+1);}
const SLt=trim(RAW.SL), NLt=trim(RAW.NL);
const unit=p=>{const [x,y]=xy(p),l=Math.hypot(x,y);return [x/l,y/l];};
const ARMPT={S:SLt[0],W:SLt[SLt.length-1],N:NLt[0],E:NLt[NLt.length-1]};
const ARMDIR=Object.fromEntries(Object.entries(ARMPT).map(([k,p])=>[k,unit(p)]));
const LOOP={S:()=>SLt.slice(),W:()=>SLt.slice().reverse(),N:()=>NLt.slice(),E:()=>NLt.slice().reverse()};
const RET={S:'W',W:'S',N:'E',E:'N'};
const SAME_LOOP={S:['S','W'],W:['S','W'],N:['N','E'],E:['N','E']};
function nextArm(inArm,straight){const other=SAME_LOOP[inArm].includes('N')?['S','W']:['N','E'];
  return straight?OPP[inArm]:other.find(a=>a!==OPP[inArm]);}
function junction(inArm,outArm){
  const ele=(ARMPT[inArm][2]+ARMPT[outArm][2])/2;
  if(outArm===OPP[inArm]) return [C[0],C[1],ele];
  const a=ARMDIR[inArm],b=ARMDIR[outArm],bx=a[0]+b[0],by=a[1]+b[1],l=Math.hypot(bx,by);
  return [...unxy(OFF*bx/l,OFF*by/l),ele];
}
function lerp(a,b,f){return [a[0]+f*(b[0]-a[0]),a[1]+f*(b[1]-a[1]),a[2]+f*(b[2]-a[2])];}
function buildRoute(X,straight){
  const Y=RET[X], Z=nextArm(Y,straight), W=RET[Z];
  const closed=[junction(W,X),...LOOP[X](),junction(Y,Z),...LOOP[Z](),junction(W,X)];
  // start START_OFF metres out along the departure arm
  let acc=0,k=0;
  while(acc+dist(closed[k],closed[k+1])<START_OFF){acc+=dist(closed[k],closed[k+1]);k++;}
  const s=lerp(closed[k],closed[k+1],(START_OFF-acc)/dist(closed[k],closed[k+1]));
  return [s,...closed.slice(k+1),...closed.slice(1,k+1),s];
}
function routeLen(r){let s=0;for(let i=0;i<r.length-1;i++)s+=dist(r[i],r[i+1]);return s;}

let arm='E', straight=true, route=buildRoute(arm,straight), kmMarkers=[], startM, finishM;
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty'});
map.addControl(new maplibregl.NavigationControl(),'top-right');

const ARROW='<svg viewBox="0 0 16 16"><path d="M8 1 14 8H10v7H6V8H2z"/></svg>';
const bearing=a=>Math.atan2(ARMDIR[a][0],ARMDIR[a][1])*180/Math.PI;
class CrossControl{
  onAdd(){
    this.c=document.createElement('div');this.c.className='maplibregl-ctrl maplibregl-ctrl-group';
    const g=document.createElement('div');g.className='cross';this.c.appendChild(g);
    const cells={1:'N',3:'W',5:'E',7:'S'};this.btns={};
    for(let i=0;i<9;i++){
      if(cells[i]){const a=cells[i],b=document.createElement('button');b.type='button';b.innerHTML=ARROW;
        b.querySelector('svg').style.transform=`rotate(${bearing(a)}deg)`;
        b.title=b.ariaLabel='Vertrek via '+NAMES[a];
        b.onclick=()=>{arm=a;update();};g.appendChild(b);this.btns[a]=b;}
      else{const d=document.createElement('div');if(i===4){d.className='mid';d.innerHTML='<i></i>';}g.appendChild(d);}
    }
    return this.c;}
  sync(){for(const a in this.btns){this.btns[a].classList.toggle('on',a===arm);this.btns[a].setAttribute('aria-pressed',a===arm);}}
  onRemove(){this.c.remove();}
}
const ICON_STRAIGHT='<svg viewBox="0 0 16 16"><path d="M8 1 13 6H9.5v9h-3V6H3z"/></svg>';
const ICON_TURN='<svg viewBox="0 0 16 16"><path d="M1 6 6 1v3.5h4.5A3.5 3.5 0 0 1 14 8v7h-3V8a.5.5 0 0 0-.5-.5H6V11z"/></svg>';
class ModeControl{
  onAdd(){
    this.c=document.createElement('div');this.c.className='maplibregl-ctrl maplibregl-ctrl-group';
    this.m=document.createElement('button');this.m.type='button';this.m.className='mode-btn';
    this.m.onclick=()=>{straight=!straight;update();};
    const dl=document.createElement('button');dl.type='button';dl.className='mode-btn';
    dl.innerHTML='<svg viewBox="0 0 16 16"><path d="M6.5 1h3v6H13L8 12 3 7h3.5zM2 13h12v2H2z"/></svg>';
    dl.title=dl.ariaLabel='Download GPX van deze route';dl.onclick=downloadGPX;
    this.c.append(this.m,dl);return this.c;}
  sync(){this.m.innerHTML=straight?ICON_STRAIGHT:ICON_TURN;
    this.m.title=this.m.ariaLabel=straight?'Kruising: rechtdoor (klik voor bochtje mee)':'Kruising: bochtje mee (klik voor rechtdoor)';}
  onRemove(){this.c.remove();}
}
const cross=new CrossControl(), mode=new ModeControl();
map.addControl(cross,'top-right');map.addControl(mode,'top-right');
map.addControl(new maplibregl.ScaleControl({unit:'metric'}),'bottom-right');
const all=[...RAW.SL,...RAW.NL];
map.fitBounds(all.reduce((bb,p)=>bb.extend([p[0],p[1]]),new maplibregl.LngLatBounds([all[0][0],all[0][1]],[all[0][0],all[0][1]])),{padding:40,duration:0});

function placeLegend(){
  const sc=document.querySelector('.maplibregl-ctrl-scale'),lg=document.querySelector('.legend'),mp=document.getElementById('map').getBoundingClientRect();
  if(!sc)return;const r=sc.getBoundingClientRect();
  lg.style.right=(mp.right-r.left+8)+'px';lg.style.bottom=(mp.bottom-r.bottom)+'px';
}
map.on('load',placeLegend);map.on('resize',placeLegend);map.on('moveend',placeLegend);

function kmPoints(pts,step=500){const out=[];let acc=0,next=step;
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],s=dist(a,b);
    while(s>0&&acc+s>=next){const f=(next-acc)/s;out.push([a[0]+f*(b[0]-a[0]),a[1]+f*(b[1]-a[1]),next/1000]);next+=step;}
    acc+=s;}
  return out;}
function pin(ll,col,label,size){const el=document.createElement('div');el.className='pin';el.style.background=col;el.style.width=el.style.height=size+'px';
  return new maplibregl.Marker({element:el}).setLngLat(ll).setPopup(new maplibregl.Popup({offset:10}).setText(label)).addTo(map);}

function update(){
  route=buildRoute(arm,straight);
  cross.sync();mode.sync();
  document.getElementById('title').textContent='De Blauwe Loper Stadskanaal - '+(routeLen(route)/1000).toFixed(2)+'km';
  const src=map.getSource&&map.getSource('route');
  if(!src)return;
  src.setData({type:'Feature',geometry:{type:'LineString',coordinates:route.map(p=>[p[0],p[1]])}});
  kmMarkers.forEach(m=>m.remove());
  kmMarkers=kmPoints(route).map(([lng,lat,km])=>{const el=document.createElement('div');el.className='km';
    el.textContent=(km%1?km.toFixed(1):km)+' km';return new maplibregl.Marker({element:el}).setLngLat([lng,lat]).addTo(map);});
  finishM.setLngLat([route[0][0],route[0][1]]);startM.setLngLat([route[0][0],route[0][1]]);
  startM.getPopup().setText('Start/finish – vertrek via '+NAMES[arm]+', '+(straight?'rechtdoor':'bochtje mee'));
}

function downloadGPX(){
  const t0=Date.parse(RAW.t0);let acc=0;
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const name=`De Blauwe Loper Stadskanaal - ${NAMES[arm]} - ${straight?'rechtdoor':'bochtje mee'}`;
  const pts=route.map((p,i)=>{if(i)acc+=dist(route[i-1],p);
    const t=new Date(t0+Math.round(acc/RAW.v)*1000).toISOString().replace('.000Z','Z');
    return `<trkpt lat="${p[1].toFixed(7)}" lon="${p[0].toFixed(7)}"><ele>${p[2].toFixed(1)}</ele><time>${t}</time></trkpt>`;}).join('\n');
  const gpx=`<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Blauwe Loper map" xmlns="http://www.topografix.com/GPX/1/1">
<trk><name>${esc(name)}</name><trkseg>
${pts}
</trkseg></trk></gpx>`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([gpx],{type:'application/gpx+xml'}));
  a.download=`Blauwe_Loper_${NAMES[arm].replace(/\W+/g,'_')}_${straight?'rechtdoor':'bochtje'}.gpx`.replace(/_+/g,'_');
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},0);
}

map.on('load',()=>{
  map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[]}}});
  map.addLayer({id:'route-casing',type:'line',source:'route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#fff','line-width':8}});
  map.addLayer({id:'route',type:'line',source:'route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#2563eb','line-width':4.5}});
  map.addLayer({id:'arrows',type:'symbol',source:'route',layout:{'symbol-placement':'line','symbol-spacing':90,'text-field':'▶','text-size':12,'text-keep-upright':false,'text-allow-overlap':true,'text-font':['Noto Sans Regular']},paint:{'text-color':'#1e3a8a'}});
  finishM=pin([route[0][0],route[0][1]],'#dc2626','Finish',12);
  startM=pin([route[0][0],route[0][1]],'#16a34a','Start',16);
  update();
});
update();
</script></body></html>
