<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>VJ LOOP FORGE v3 · GPU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --sidebar-w: 300px;
    --toggle-w: 28px;

    --bg: #05060a;
    --panel: rgba(16,18,26,0.82);
    --panel-solid: #0d0f16;
    --border: rgba(255,255,255,0.09);
    --border-hi: rgba(255,255,255,0.18);
    --accent: #3df5c4;
    --accent2: #ff2f6d;
    --accent3: #7a5cff;
    --text: #d6dbe4;
    --dim: #6b7384;
    --dimmer: #464d5c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background:
      radial-gradient(1200px 700px at 78% -10%, rgba(122,92,255,0.16), transparent 60%),
      radial-gradient(900px 600px at 8% 110%, rgba(61,245,196,0.10), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', ui-monospace, monospace;
    font-size: 12px;
    height: 100vh;
    height: 100dvh;
    display: flex;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- sidebar ---------- */
  #sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    display: flex; flex-direction: column;
    overflow: visible;
    position: relative; flex-shrink: 0;
    z-index: 1002;
    background: linear-gradient(180deg, rgba(18,20,30,0.96), rgba(9,10,16,0.96));
    border-right: 1px solid var(--border);
    backdrop-filter: blur(14px);
    transition: width .25s ease, min-width .25s ease;
  }
  #sidebar-header, #sidebar-body, #sidebar-footer { overflow: hidden; }
  #sidebar.collapsed { width: var(--toggle-w); min-width: var(--toggle-w); }
  #sidebar.collapsed > *:not(#sidebar-toggle) { display: none; }

  #sidebar-toggle {
    position: absolute;
    top: 50%; right: -16px;
    transform: translateY(-50%);
    width: 16px; height: 72px;
    border: 1px solid var(--border-hi); border-left: none;
    border-radius: 0 6px 6px 0;
    background: #141822; color: var(--accent);
    font-size: .7rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, width .15s;
    z-index: 1003; flex-shrink: 0;
    box-shadow: 3px 0 14px rgba(0,0,0,.45);
  }
  #sidebar-toggle:hover { background: #1d2430; width: 20px; }

  #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1001; }
  #sidebar-overlay.hidden { display: none !important; }

  #sidebar-header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(61,245,196,0.06), transparent);
  }
  #sidebar-header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px; line-height: 1;
    letter-spacing: 3px;
    color: #fff;
  }
  #sidebar-header h1 b { color: var(--accent); font-weight: 400; }
  #sidebar-header .sub { color: var(--dim); font-size: 9.5px; letter-spacing: 2px; margin-top: 5px; }

  #sidebar-body { flex: 1; overflow-y: auto; padding: 4px 0 10px; }
  #sidebar-body::-webkit-scrollbar { width: 8px; }
  #sidebar-body::-webkit-scrollbar-track { background: transparent; }
  #sidebar-body::-webkit-scrollbar-thumb { background: #212735; border-radius: 4px; }
  #sidebar-body::-webkit-scrollbar-thumb:hover { background: #2d3546; }

  .section { border-bottom: 1px solid var(--border); padding: 12px 16px 14px; }
  .section-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 9.5px; letter-spacing: 2.5px; color: var(--dim);
    text-transform: uppercase; margin-bottom: 10px;
  }
  .section-title::before {
    content: ''; width: 3px; height: 11px; border-radius: 2px;
    background: var(--accent); box-shadow: 0 0 10px var(--accent);
  }
  .section-title .rnd-btn { margin-left: auto; }

  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  .row label.k { flex: 0 0 82px; color: var(--dim); font-size: 10px; letter-spacing: .8px; }
  .row .val {
    flex: 0 0 38px; text-align: right; color: var(--accent);
    font-size: 10px; font-variant-numeric: tabular-nums;
  }

  select, input[type=text] {
    flex: 1; min-width: 0;
    background: #0f1219; color: var(--text);
    border: 1px solid var(--border-hi); border-radius: 4px;
    padding: 6px 7px; font-family: inherit; font-size: 11px;
    cursor: pointer; outline: none;
  }
  select:focus { border-color: var(--accent); }
  select optgroup { background: #0b0d13; color: var(--dim); }
  select option { background: #0f1219; color: var(--text); }

  input[type=range] {
    flex: 1; min-width: 0; -webkit-appearance: none; appearance: none;
    height: 20px; background: transparent; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent) var(--fill,50%), #232a38 var(--fill,50%), #232a38 100%);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px; margin-top: -4.5px;
    border-radius: 50%; background: #fff;
    border: 2px solid #0b0d13;
    box-shadow: 0 0 8px rgba(61,245,196,.8);
  }
  input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: #232a38; }
  input[type=range]::-moz-range-progress { height: 3px; border-radius: 3px; background: var(--accent); }
  input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: #fff; border: 2px solid #0b0d13;
  }

  input[type=color] {
    flex: 1; min-width: 0; height: 26px; padding: 0;
    background: #0f1219; border: 1px solid var(--border-hi);
    border-radius: 4px; cursor: pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 3px; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 2px; }

  /* toggle switch */
  .sw { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .sw input { display: none; }
  .sw i {
    width: 30px; height: 16px; border-radius: 10px;
    background: #232a38; border: 1px solid var(--border-hi);
    position: relative; transition: background .15s, border-color .15s;
    flex-shrink: 0;
  }
  .sw i::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--dim); transition: transform .15s, background .15s;
  }
  .sw input:checked + i { background: rgba(61,245,196,.22); border-color: var(--accent); }
  .sw input:checked + i::after { transform: translateX(14px); background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .sw span { font-size: 10px; color: var(--dim); letter-spacing: .5px; }

  .btn {
    background: #141822; color: var(--text);
    border: 1px solid var(--border-hi); border-radius: 4px;
    padding: 7px 11px; font-family: inherit; font-size: 10.5px;
    letter-spacing: 1.2px; cursor: pointer; text-transform: uppercase;
    transition: border-color .15s, color .15s, background .15s, transform .08s;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn-accent { border-color: rgba(61,245,196,.5); color: var(--accent); background: rgba(61,245,196,.08); }
  .btn-accent:hover { background: rgba(61,245,196,.18); }
  .btn-red { border-color: rgba(255,47,109,.55); color: var(--accent2); background: rgba(255,47,109,.1); }
  .btn-red:hover { background: rgba(255,47,109,.2); color: #fff; }
  .btn-sm { padding: 5px 8px; font-size: 9.5px; letter-spacing: 1px; }
  .rnd-btn {
    background: transparent; border: 1px solid var(--border-hi);
    color: var(--dim); border-radius: 3px; padding: 2px 6px;
    font-family: inherit; font-size: 9px; letter-spacing: 1px; cursor: pointer;
  }
  .rnd-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* scene picker */
  .scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .scene-btn {
    background: #10141c; border: 1px solid var(--border);
    border-radius: 4px; color: var(--dim);
    font-family: inherit; font-size: 9px; letter-spacing: .6px;
    padding: 7px 5px; cursor: pointer; text-align: left;
    display: flex; align-items: center; gap: 5px;
    transition: border-color .15s, color .15s, background .15s;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .scene-btn .dot {
    width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0;
    background: var(--dimmer);
  }
  .scene-btn:hover { border-color: var(--border-hi); color: var(--text); }
  .scene-btn.on {
    border-color: var(--accent); color: #fff;
    background: linear-gradient(180deg, rgba(61,245,196,.16), rgba(61,245,196,.05));
  }
  .scene-btn.on .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    background: #10141c; border: 1px solid var(--border);
    color: var(--dim); border-radius: 999px; padding: 4px 9px;
    font-family: inherit; font-size: 9px; letter-spacing: 1px;
    cursor: pointer; text-transform: uppercase;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  .swatches { display: flex; gap: 4px; flex-wrap: wrap; }
  .sw-btn {
    width: 26px; height: 18px; border-radius: 3px; cursor: pointer;
    border: 1px solid var(--border-hi); padding: 0;
  }
  .sw-btn.on { border-color: #fff; box-shadow: 0 0 0 1px #fff inset; }

  #sidebar-footer {
    padding: 10px 16px; border-top: 1px solid var(--border);
    color: var(--dimmer); font-size: 9px; letter-spacing: 1px;
    display: flex; gap: 10px; align-items: center;
  }

  /* ---------- main ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }

  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    background: rgba(8,9,14,.7);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
  }
  .topbar .spacer { margin-left: auto; }
  .seg {
    display: flex; border: 1px solid var(--border-hi);
    border-radius: 4px; overflow: hidden;
  }
  .seg button {
    background: transparent; color: var(--dim); border: none;
    font-family: inherit; font-size: 9.5px; letter-spacing: 1.2px;
    padding: 6px 10px; cursor: pointer;
  }
  .seg button.on { background: rgba(61,245,196,.15); color: var(--accent); }
  .seg button:hover:not(.on) { color: var(--text); }

  .stage {
    flex: 1; position: relative; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    background:
      linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px) 0 0 / 100% 34px,
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px) 0 0 / 34px 100%;
  }
  .frame {
    position: relative;
    max-width: 100%; max-height: 100%;
    aspect-ratio: 16 / 9;
    width: 100%;
    border: 1px solid var(--border-hi);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.03) inset;
    background: #000;
  }
  #gl { display: block; width: 100%; height: 100%; }

  .hud {
    position: absolute; left: 10px; top: 10px;
    display: flex; gap: 6px; align-items: center;
    font-size: 9px; letter-spacing: 1.5px; color: var(--dim);
    background: rgba(0,0,0,.45); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 8px;
    pointer-events: none; text-transform: uppercase;
  }
  .hud b { color: var(--accent); font-weight: 400; }

  .beatbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: rgba(255,255,255,.06);
  }
  .beatbar i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
    box-shadow: 0 0 12px var(--accent);
  }

  .transport {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-top: 1px solid var(--border);
    background: rgba(8,9,14,.7); flex-shrink: 0; flex-wrap: wrap;
  }
  .statuses {
    display: flex; gap: 16px; margin-left: auto;
    font-size: 9px; letter-spacing: 1.4px; color: var(--dimmer);
    text-transform: uppercase;
  }
  .statuses b { color: var(--accent); font-weight: 400; }

  .rec-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent2); margin-right: 6px;
    box-shadow: 0 0 8px var(--accent2);
    animation: blink 1s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }
  .hidden { display: none !important; }

  #recStatus { color: var(--accent2); font-size: 9.5px; letter-spacing: 1.5px; }

  #errBox {
    position: absolute; inset: 16px; z-index: 50;
    background: rgba(5,6,10,.95); border: 1px solid var(--accent2);
    border-radius: 6px; padding: 18px; overflow: auto;
    color: #ffb3c9; font-size: 11px; line-height: 1.5; white-space: pre-wrap;
  }
  #errBox h3 { font-family: 'Bebas Neue',sans-serif; letter-spacing: 2px; color: var(--accent2); font-size: 20px; margin-bottom: 8px; }

  #toast {
    position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: rgba(8,10,16,.95); border: 1px solid var(--accent);
    color: var(--accent); border-radius: 4px; padding: 8px 14px;
    font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 60;
  }
  #toast.on { opacity: 1; }

  @media (max-width: 860px) {
    #sidebar { position: fixed; top: 0; left: 0; bottom: 0; box-shadow: 3px 0 30px rgba(0,0,0,.6); }
    #sidebar-overlay { display: block; }
    .stage { padding: 8px; }
    .statuses { display: none; }
  }
</style>
<script src="https://unpkg.com/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
</head>
<body>

<div id="sidebar-overlay"></div>

<aside id="sidebar">
  <button id="sidebar-toggle" title="Paneel inklappen">&#x25C4;</button>

  <div id="sidebar-header">
    <h1>VJ LOOP <b>FORGE</b></h1>
    <div class="sub">V3 · GPU RAYMARCH ENGINE</div>
  </div>

  <div id="sidebar-body">

    <div class="section">
      <div class="section-title">Scene <button class="rnd-btn" data-rnd="scene">RND</button></div>
      <div class="scenes" id="sceneGrid"></div>
    </div>

    <div class="section">
      <div class="section-title">Motion <button class="rnd-btn" data-rnd="motion">RND</button></div>
      <div class="row"><label class="k">Speed</label><input type="range" id="speed" min="0.25" max="5" step="0.05" value="1"><span class="val" id="speedVal">1.00</span></div>
      <div class="row"><label class="k">BPM</label><input type="range" id="bpm" min="80" max="200" step="1" value="140"><span class="val" id="bpmVal">140</span></div>
      <div class="row"><label class="k">BEAT PUNCH</label><input type="range" id="beatPunch" min="0" max="1" step="0.05" value="0.35"><span class="val" id="beatPunchVal">0.35</span></div>
      <div class="row"><label class="k">Beat pulse</label><input type="range" id="zoomPulse" min="0" max="1" step="0.01" value="0.3"><span class="val" id="zoomPulseVal">0.30</span></div>
      <div class="row"><label class="k">Roll</label><input type="range" id="rotation" min="0" max="2" step="0.01" value="0.2"><span class="val" id="rotationVal">0.20</span></div>
      <div class="row"><label class="k">Morph</label><input type="range" id="morph" min="0" max="1" step="0.01" value="0.4"><span class="val" id="morphVal">0.40</span></div>
      <div class="row"><label class="k">Warp</label><input type="range" id="warp" min="0" max="1" step="0.01" value="0.4"><span class="val" id="warpVal">0.40</span></div>
      <div class="row"><label class="k">Strobe</label><input type="range" id="strobe" min="0" max="1" step="0.01" value="0"><span class="val" id="strobeVal">0.00</span></div>
    </div>

    <div class="section">
      <div class="section-title">Colour <button class="rnd-btn" data-rnd="color">RND</button></div>
      <div class="row"><label class="k">Palette</label><select id="palette"></select></div>
      <div class="row" style="margin-bottom:10px">
        <div class="swatches" id="swatches"></div>
      </div>
      <div class="row">
        <input type="color" id="color1" value="#3df5c4">
        <input type="color" id="color2" value="#0a1f2c">
        <input type="color" id="color3" value="#ff2f6d">
      </div>
      <div class="row"><label class="k">Hue shift</label><input type="range" id="hueShift" min="0" max="1" step="0.005" value="0.2"><span class="val" id="hueShiftVal">0.20</span></div>
      <div class="row"><label class="k">Saturation</label><input type="range" id="saturation" min="0" max="2" step="0.02" value="1"><span class="val" id="saturationVal">1.00</span></div>
      <div class="row"><label class="k">Exposure</label><input type="range" id="brightness" min="0.2" max="2.5" step="0.02" value="1"><span class="val" id="brightnessVal">1.00</span></div>
      <div class="row"><label class="k">Contrast</label><input type="range" id="contrast" min="0.6" max="1.8" step="0.02" value="1.05"><span class="val" id="contrastVal">1.05</span></div>
      <div class="row"><label class="k">Look</label><select id="tonemap">
        <option value="0" selected>ACES FILMIC</option>
        <option value="1">NEON HDR</option>
        <option value="2">REINHARD SOFT</option>
        <option value="3">CLIPPED / HARD</option>
      </select></div>
      <div class="row"><label class="sw"><input type="checkbox" id="invert"><i></i><span>Invert</span></label></div>
    </div>

    <div class="section">
      <div class="section-title">Geometry <button class="rnd-btn" data-rnd="geometry">RND</button></div>
      <div class="row"><label class="k">Density</label><input type="range" id="density" min="2" max="40" step="1" value="14"><span class="val" id="densityVal">14</span></div>
      <div class="row"><label class="k">Detail</label><input type="range" id="complexity" min="1" max="10" step="1" value="5"><span class="val" id="complexityVal">5</span></div>
      <div class="row"><label class="k">Line width</label><input type="range" id="lineWidth" min="0.3" max="6" step="0.1" value="1"><span class="val" id="lineWidthVal">1.0</span></div>
      <div class="row"><label class="k">Lens / FOV</label><input type="range" id="perspective" min="0.4" max="2.4" step="0.02" value="1"><span class="val" id="perspectiveVal">1.00</span></div>
      <div class="row"><label class="k">Fractal zoom</label><input type="range" id="fractalZoom" min="0.2" max="3" step="0.02" value="1"><span class="val" id="fractalZoomVal">1.00</span></div>
      <div class="row"><label class="k">Kaleido</label><input type="range" id="kaleido" min="0" max="16" step="1" value="0"><span class="val" id="kaleidoVal">0</span></div>
      <div class="row">
        <label class="sw"><input type="checkbox" id="symmetry"><i></i><span>Mirror X</span></label>
        <label class="sw"><input type="checkbox" id="symmetryY"><i></i><span>Y</span></label>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Post FX <button class="rnd-btn" data-rnd="post">RND</button></div>
      <div class="row"><label class="k">Bloom</label><input type="range" id="glow" min="0" max="40" step="1" value="14"><span class="val" id="glowVal">14</span></div>
      <div class="row"><label class="k">Bloom size</label><input type="range" id="bloomRadius" min="0.2" max="2" step="0.02" value="1"><span class="val" id="bloomRadiusVal">1.00</span></div>
      <div class="row"><label class="k">Trails</label><input type="range" id="trails" min="0" max="0.97" step="0.01" value="0"><span class="val" id="trailsVal">0.00</span></div>
      <div class="row"><label class="k">Trail drift</label><input type="range" id="trailZoom" min="0" max="1" step="0.01" value="0.3"><span class="val" id="trailZoomVal">0.30</span></div>
      <div class="row"><label class="k">Chromatic</label><input type="range" id="chroma" min="0" max="1" step="0.01" value="0.18"><span class="val" id="chromaVal">0.18</span></div>
      <div class="row"><label class="k">Grain</label><input type="range" id="grain" min="0" max="1" step="0.01" value="0.12"><span class="val" id="grainVal">0.12</span></div>
      <div class="row"><label class="k">Vignette</label><input type="range" id="vignette" min="0" max="1" step="0.01" value="0.35"><span class="val" id="vignetteVal">0.35</span></div>
      <div class="row"><label class="k">Overlay</label><select id="overlayMode">
        <option value="0" selected>NONE</option>
        <option value="1">SCANLINES</option>
        <option value="2">CRT MASK</option>
        <option value="3">GLITCH</option>
        <option value="4">HALATION</option>
        <option value="5">FEEDBACK ECHO</option>
      </select></div>
    </div>

    <div class="section">
      <div class="section-title">Presets</div>

<script>
/* VJ LOOP FORGE v3 — GPU raymarch engine (WebGL2)
   version = "20260915-122619"  (internal build id, never surfaced in the UI) */
const version = "20260915-122619";

/* ==========================================================================
   GLSL — shared prelude, per-scene bodies, post-processing chain
   Every scene exposes:  vec3 scene(vec2 uv)
   All motion is derived from uPhase (0..1) and quantised to a whole number of
   cycles per loop, so every export is seamless by construction.
   ========================================================================== */

const VERT = `#version 300 es
void main(){
  vec2 p = vec2(float((gl_VertexID & 1) << 2) - 1.0,
                float((gl_VertexID & 2) << 1) - 1.0);
  gl_Position = vec4(p, 0.0, 1.0);
}`;

const PRELUDE = `#version 300 es
precision highp float;
precision highp int;
out vec4 fragColor;

uniform vec2  uRes;
uniform float uTime;
uniform float uPhase;
uniform float uLoop;
uniform float uBeat;
uniform float uBeatSaw;
uniform float uBeats;
uniform vec3  uC1;
uniform vec3  uC2;
uniform vec3  uC3;
uniform float uSpeed;
uniform float uZoomPulse;
uniform float uRotation;
uniform float uMorph;
uniform float uHue;
uniform float uDensity;
uniform float uLineWidth;
uniform float uPersp;
uniform float uComplexity;
uniform float uFractal;
uniform float uWarp;
uniform float uKaleido;
uniform vec2  uMirror;

#define PI  3.14159265359
#define TAU 6.28318530718

float sat(float x){ return clamp(x, 0.0, 1.0); }
vec3  sat3(vec3 x){ return clamp(x, vec3(0.0), vec3(1.0)); }
mat2  rot2(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

/* ---- loop-safe motion -------------------------------------------------- */
float lscale(){ return max(0.125, uLoop / 8.0); }            // 8 s is the reference loop
float nCyc(float base){ return max(1.0, floor(base * uSpeed * lscale() + 0.5)); }
float travel(float period, float base){ return uPhase * period * nCyc(base); }
float spin(float base){ return mod(uPhase * TAU * floor(base * uRotation * 2.0 * lscale() + 0.5), TAU); }
float wave(float base, float off){ return sin(TAU * (uPhase * nCyc(base) + off)); }
vec3  orbit(float base, float radius){
  float a = TAU * uPhase * nCyc(base);
  return vec3(cos(a), sin(a * 0.5), sin(a)) * radius;
}

/* ---- hashes & noise ---------------------------------------------------- */
float hash11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash12(vec2 p){ vec3 p3 = fract(p.xyx * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2  hash22(vec2 p){ vec3 p3 = fract(p.xyx * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float hash13(vec3 p3){ p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
vec3  hash33(vec3 p3){ p3 = fract(p3 * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yxx) * p3.zyx); }

float noise2(vec2 x){
  vec2 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1.0, 0.0)), f.x),
             mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), f.x), f.y);
}
float noise3(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash13(i), hash13(i + vec3(1.0, 0.0, 0.0)), f.x),
                 mix(hash13(i + vec3(0.0, 1.0, 0.0)), hash13(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),
             mix(mix(hash13(i + vec3(0.0, 0.0, 1.0)), hash13(i + vec3(1.0, 0.0, 1.0)), f.x),
                 mix(hash13(i + vec3(0.0, 1.0, 1.0)), hash13(i + vec3(1.0, 1.0, 1.0)), f.x), f.y), f.z);
}
float fbm2(vec2 p, int oct){
  float a = 0.5, s = 0.0;
  for(int i = 0; i < 8; i++){ if(i >= oct) break; s += a * noise2(p); p = rot2(0.63) * p * 2.03; a *= 0.5; }
  return s;
}
float fbm3(vec3 p, int oct){
  float a = 0.5, s = 0.0;
  for(int i = 0; i < 8; i++){ if(i >= oct) break; s += a * noise3(p); p *= 2.02; p.xy = rot2(0.71) * p.xy; a *= 0.5; }
  return s;
}

/* ---- palette: cyclic ramp through the three user colours (linear) ------ */
vec3 pal(float x){
  x = fract(x + uHue);
  float s = x * 3.0;
  vec3 a, b; float f;
  if(s < 1.0)      { a = uC1; b = uC3; f = s; }
  else if(s < 2.0) { a = uC3; b = uC2; f = s - 1.0; }
  else             { a = uC2; b = uC1; f = s - 2.0; }
  f = f * f * (3.0 - 2.0 * f);
  return mix(a, b, f);
}
vec3 palN(float x){ vec3 c = pal(x); return c / max(1e-4, max(c.r, max(c.g, c.b))); }

/* ---- sdf / shading helpers -------------------------------------------- */
float smin(float a, float b, float k){ float h = sat(0.5 + 0.5 * (b - a) / k); return mix(b, a, h) - k * h * (1.0 - h); }
float sdBox(vec3 p, vec3 b){ vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }
float sdTorus(vec3 p, vec2 t){ vec2 q = vec2(length(p.xz) - t.x, p.y); return length(q) - t.y; }
float fres(vec3 n, vec3 rd, float k){ return pow(1.0 - sat(dot(n, -rd)), k); }
mat3 camera(vec3 ro, vec3 ta){
  vec3 f = normalize(ta - ro);
  vec3 r = normalize(cross(vec3(0.0, 1.0, 0.0), f));
  vec3 u = cross(f, r);
  return mat3(r, u, f);
}
vec3 studio(vec3 rd){
  float h = sat(rd.y * 0.5 + 0.5);
  vec3 c = mix(pal(0.62) * 0.22, pal(0.18) * 0.7, h);
  float band = smoothstep(0.86, 1.0, sin(atan(rd.z, rd.x) * 5.0 + rd.y * 7.0) * 0.5 + 0.5);
  c += palN(0.42) * band * 0.7;
  c += palN(0.05) * pow(sat(dot(rd, normalize(vec3(0.5, 0.8, -0.3)))), 24.0) * 2.2;
  return c;
}
`;

const EPILOGUE = `
vec2 kalFold(vec2 p, float seg){
  float r = length(p);
  float a = atan(p.y, p.x);
  float k = TAU / seg;
  a = abs(mod(a + k * 0.5, k) - k * 0.5);
  return vec2(cos(a), sin(a)) * r;
}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  uv *= 1.0 - 0.26 * uZoomPulse * uBeat;
  uv = rot2(spin(1.0)) * uv;
  if(uKaleido > 2.5) uv = kalFold(uv, uKaleido);
  if(uMirror.x > 0.5) uv.x = abs(uv.x);
  if(uMirror.y > 0.5) uv.y = abs(uv.y);
  vec3 col = scene(uv);
  fragColor = vec4(max(col, vec3(0.0)), 1.0);
}`;

const SCENES = {};

/* ------------------------------------------------------------------ 01 */
SCENES.tunnel = { label: 'RIB TUNNEL', src: `
float gRing;
float mapT(vec3 p){
  // snaking twist: exactly periodic over the 4-unit rib spacing, so the loop wraps
  p.xy = rot2(sin(p.z * PI * 0.5) * (0.3 + 1.4 * uWarp) + spin(0.5)) * p.xy;
  float r = length(p.xy);
  float a = atan(p.y, p.x);
  float flute = 0.13 * sin(a * max(3.0, floor(uDensity * 0.5)) + p.z * PI * 0.5);
  float R = 2.0 + flute + 0.2 * sin(p.z * PI * 0.5) * uMorph;
  float wall = R - r;
  float pz = mod(p.z, 4.0) - 2.0;
  gRing = length(vec2(r - R + 0.32, pz)) - 0.05 - 0.02 * uLineWidth;
  return min(wall * 0.8, gRing);
}
vec3 nrmT(vec3 p){
  vec2 e = vec2(0.0018, 0.0);
  return normalize(vec3(mapT(p + e.xyy) - mapT(p - e.xyy),
                        mapT(p + e.yxy) - mapT(p - e.yxy),
                        mapT(p + e.yyx) - mapT(p - e.yyx)));
}
vec3 scene(vec2 uv){
  vec3 ro = vec3(0.0, 0.0, mod(travel(4.0, 3.0), 4.0));   // folded: exact wrap
  vec3 rd = normalize(vec3(uv / max(0.4, uPersp), 1.0));
  float t = 0.0, d = 0.0;
  vec3 p = ro, glow = vec3(0.0);
  bool hit = false;
  for(int i = 0; i < 128; i++){
    p = ro + rd * t;
    d = mapT(p);
    glow += pal(p.z * 0.25 + 0.15) * exp(-max(gRing, 0.0) * 22.0) * 0.022 * (0.55 + 0.9 * uBeat);
    if(d < 0.0025){ hit = true; break; }
    t += d * 0.7;
    if(t > 34.0) break;
  }
  vec3 col = glow * (1.3 + uDensity * 0.03);
  if(hit){
    vec3 n = nrmT(p);
    vec3 l = normalize(vec3(0.45, 0.65, -0.6));
    float dif = sat(dot(n, l)) * 0.6 + 0.4;
    float spe = pow(sat(dot(reflect(rd, n), l)), 42.0);
    vec3 base = pal(0.55 + 0.2 * sin(p.z * PI * 0.5)) * 0.52;
    col += base * dif;
    col += palN(0.2) * spe * 1.5;
    col += pal(0.85) * fres(n, rd, 4.0) * 0.7;
    col *= exp(-t * 0.05);
  }
  col += pal(0.4) * 0.03;
  return col;
}`};

/* ------------------------------------------------------------------ 02 */
SCENES.terrain = { label: 'NEON TERRAIN', src: `
#define PZ 24.0
float terrH(vec2 q){
  float k = TAU / PZ;
  vec3 s = vec3(q.x * 0.26, cos(q.y * k) * 2.4, sin(q.y * k) * 2.4);
  float h = fbm3(s * 1.15, int(clamp(3.0 + uComplexity * 0.4, 3.0, 7.0)));
  return (h - 0.5) * (2.6 + 2.0 * uMorph);
}
vec3 scene(vec2 uv){
  vec3 ro = vec3(0.0, 2.3, travel(PZ, 1.0));
  vec3 rd = normalize(vec3(uv / max(0.4, uPersp), 1.05));
  float t = 0.5;
  vec3 p = ro;
  bool hit = false;
  for(int i = 0; i < 128; i++){
    p = ro + rd * t;
    float h = p.y - terrH(vec2(p.x, p.z));
    if(h < 0.02 * t){ hit = true; break; }
    t += max(0.04, h * 0.42);
    if(t > 95.0) break;
  }
  vec3 col;
  if(hit){
    float e = 0.14;
    float hL = terrH(vec2(p.x - e, p.z)), hR = terrH(vec2(p.x + e, p.z));
    float hD = terrH(vec2(p.x, p.z - e)), hU = terrH(vec2(p.x, p.z + e));
    vec3 n = normalize(vec3(hL - hR, 2.0 * e, hD - hU));
    vec3 l = normalize(vec3(0.35, 0.5, -0.8));
    float dif = sat(dot(n, l));
    float rim = fres(n, rd, 3.0);

    float gk = max(1.0, floor(uDensity * 0.18 * PZ + 0.5)) / PZ;
    vec2 g = vec2(p.x, p.z) * gk;
    vec2 gf = abs(fract(g) - 0.5);
    vec2 w = fwidth(g) * 1.1 + 1e-5;
    float ed = min(gf.x / w.x, gf.y / w.y);
    float line = sat(1.0 - ed / max(0.6, uLineWidth * 1.6));

    float hh = sat((p.y + 1.6) * 0.22);
    vec3 emit = pal(0.08 + hh * 0.5 + fract(p.z / PZ)) * line * (1.8 + 2.6 * uBeat);
    vec3 surf = pal(0.6) * (0.06 + 0.55 * dif) * (0.35 + hh);
    col = surf + emit + pal(0.9) * rim * 0.25;
    col *= exp(-t * 0.028);
    col += pal(0.3) * (1.0 - exp(-t * 0.028)) * 0.10;
  } else {
    float horizon = sat(1.0 - abs(rd.y) * 5.0);
    col = mix(pal(0.7) * 0.05, pal(0.25) * 0.35, sat(rd.y * 2.0 + 0.3));
    col += pal(0.12) * pow(horizon, 3.0) * 0.45;
    float sun = sat(dot(rd, normalize(vec3(0.05, 0.06, 1.0))));
    col += palN(0.02) * pow(sun, 900.0) * 1.5;
    col += palN(0.1) * pow(sun, 26.0) * 0.28;
    float st = pow(hash12(floor(uv * 520.0) + 3.0), 70.0) * 2.0;
    col += vec3(st) * sat(rd.y * 3.0);
  }
  return col;
}`};

SCENES.hex = { label: 'HEX CELLS', src: `
vec4 hexTile(vec2 p){
  vec2 s = vec2(1.0, 1.7320508);
  vec4 hC = floor(vec4(p, p - vec2(0.5, 1.0)) / s.xyxy) + 0.5;
  vec4 h = vec4(p - hC.xy * s, p - (hC.zw + 0.5) * s);
  return dot(h.xy, h.xy) < dot(h.zw, h.zw) ? vec4(h.xy, hC.xy) : vec4(h.zw, hC.zw + 0.5);
}
float hexD(vec2 p){ p = abs(p); return max(p.x * 0.8660254 + p.y * 0.5, p.y); }
vec3 scene(vec2 uv){
  float ang = TAU * uPhase * nCyc(1.0);
  vec3 drift = vec3(cos(ang), sin(ang), 0.0) * 1.1;
  vec2 q = uv * (1.6 + uDensity * 0.16);
  vec2 wv = vec2(fbm3(vec3(q * 0.5, 0.0) + drift, 3), fbm3(vec3(q * 0.5 + 9.7, 4.1) + drift, 3)) - 0.5;
  q += wv * (2.2 * uWarp + 0.2);
  vec4 h = hexTile(q);
  float d = hexD(h.xy);
  float w = fwidth(d) * 1.4 + 1e-5;
  float cid = hash12(h.zw);
  float lvl = fbm3(vec3(h.zw * 0.22, 1.7) + drift * 0.7, 3);
  float bt = fract(uPhase * uBeats + cid);
  float pulse = pow(1.0 - bt, 5.0);
  float edge = smoothstep(0.5 - w * (1.0 + uLineWidth), 0.5, d) * (1.0 - smoothstep(0.5, 0.5 + w, d));
  float fill = smoothstep(0.5, 0.42, d);
  vec3 col = vec3(0.0);
  col += palN(lvl * 1.4 + 0.1) * edge * (1.4 + 4.0 * pulse * uZoomPulse + 1.5 * uBeat);
  col += pal(lvl * 1.2 + 0.45) * fill * (0.1 + 0.55 * step(0.55, lvl) + 0.5 * pulse * pulse);
  float inner = abs(d - 0.28 - 0.1 * sin(lvl * 9.0 + ang));
  col += palN(lvl + 0.7) * exp(-inner * (60.0 / max(0.4, uLineWidth))) * 0.8 * step(0.4, cid);
  col *= 0.55 + 0.65 * sat(1.3 - length(uv));
  col += pal(0.5) * 0.02;
  return col;
}`};

SCENES.rain = { label: 'DATA RAIN', src: `
vec3 scene(vec2 uv){
  vec3 col = vec3(0.0);
  int layers = int(clamp(uComplexity * 0.6 + 2.0, 2.0, 6.0));
  for(int i = 0; i < 6; i++){
    if(i >= layers) break;
    float fi = float(i) / float(layers);
    float depth = 1.0 + fi * 2.2;
    float cells = max(10.0, floor(uDensity * 2.2));
    vec2 q = uv * cells / depth;
    q.x += fi * 23.7;
    float colId = floor(q.x);
    float cx = fract(q.x);
    float cyc = floor(4.0 + hash11(colId * 1.37 + fi * 7.1) * 12.0);
    float y = q.y * 1.1 + uPhase * cyc * 6.0;
    float tr = fract(y / 6.0);                                             // 6-cell comet
    float gi = mod(floor(y), 6.0 * cyc);                                   // wraps with the loop
    float fl = mod(floor(uPhase * 8.0 * max(1.0, floor(uBeats * 0.5 + 0.5))), 8.0);
    float glyph = step(0.42, hash12(vec2(colId, gi)));
    vec2 sub = floor(vec2(cx, fract(y)) * vec2(4.0, 5.0));
    float bits = step(0.44, hash12(sub + colId * 3.1 + gi * 0.13 + fl));
    float gutter = step(abs(cx - 0.5), 0.40);
    float mask = glyph * bits * gutter;
    float env = pow(1.0 - tr, 4.0);
    float head = smoothstep(0.94, 1.0, 1.0 - tr) * gutter * glyph;
    vec3 c = pal(0.06 + fi * 0.2 + hash11(colId) * 0.08);
    col += c * mask * env * (1.3 / depth) * (0.7 + 0.5 * uBeat);
    col += vec3(1.0) * head * (0.8 / depth);
  }
  col += pal(0.55) * 0.025 * sat(1.4 - length(uv) * 1.1);
  return col;
}`};

  return length(v - d * max(0.0, dot(v, d)));

vec3 scene(vec2 uv){
  vec3 ro = vec3(0.0, 0.6, -6.0);
  vec3 rd = normalize(vec3(uv / max(0.4, uPersp), 1.1));

    for(int b = 0; b < 8; b++){

float gTrap;
float mapB(vec3 p){
  vec3 z = p;
  float dr = 1.0, r = 0.0;
  float power = 7.0 + 3.0 * wave(1.0, 0.0) * uMorph;
  gTrap = 1e9;
  int it = int(clamp(6.0 + uComplexity, 6.0, 14.0));
  for(int i = 0; i < 14; i++){
    if(i >= it) break;
    r = length(z);
    if(r > 2.4) break;
    float th = acos(clamp(z.z / max(r, 1e-6), -1.0, 1.0));
    float ph = atan(z.y, z.x);
    dr = pow(r, power - 1.0) * power * dr + 1.0;
    float zr = pow(r, power);
    th *= power; ph *= power;
    z = zr * vec3(sin(th) * cos(ph), sin(th) * sin(ph), cos(th)) + p;
    gTrap = min(gTrap, r);
  }
  return 0.5 * log(max(r, 1e-6)) * r / dr;
}
vec3 nrmB(vec3 p){
  vec2 e = vec2(0.0012, 0.0);
  return normalize(vec3(mapB(p + e.xyy) - mapB(p - e.xyy),
                        mapB(p + e.yxy) - mapB(p - e.yxy),
                        mapB(p + e.yyx) - mapB(p - e.yyx)));
}
vec3 scene(vec2 uv){
  float a = TAU * uPhase * nCyc(0.5);
  float dist = 2.9 / max(0.35, uFractal);
  vec3 ro = vec3(cos(a) * dist, 0.55 * sin(a * 2.0), sin(a) * dist);
  mat3 cam = camera(ro, vec3(0.0));
  vec3 rd = cam * normalize(vec3(uv, 1.5 / max(0.4, uPersp)));
  float t = 0.0, d = 0.0, trap = 0.0;
  vec3 p = ro;
  bool hit = false;
  for(int i = 0; i < 128; i++){
    p = ro + rd * t;
    d = mapB(p);
    if(d < 0.0006 * t + 0.0004){ hit = true; trap = gTrap; break; }
    t += d * 0.85;
    if(t > 9.0) break;
  }
  vec3 col = studio(rd) * 0.16;
  if(hit){
    vec3 n = nrmB(p);
    vec3 l1 = normalize(vec3(0.7, 0.9, -0.4));
    vec3 l2 = normalize(vec3(-0.6, 0.2, 0.7));
    float occ = sat(0.45 + 0.55 * mapB(p + n * 0.045) / 0.045);
    float d1 = sat(dot(n, l1));
    float d2 = sat(dot(n, l2));
    vec3 base = pal(trap * 1.9 + 0.12) * 0.75;
    col  = base * (d1 * 1.15 + 0.25);
    col += pal(trap * 1.9 + 0.5) * d2 * 0.5;
    col += palN(0.15) * pow(sat(dot(reflect(rd, n), l1)), 60.0) * 2.4;
    col += studio(reflect(rd, n)) * fres(n, rd, 3.5) * 1.3;
    col *= occ;
    col += pal(trap * 2.4 + 0.8) * pow(1.0 - occ, 2.0) * 0.5;
    col *= 0.6 + 0.8 * uBeat * uZoomPulse + 0.4;
  }
  return col;
}`};

float mengerDE(vec3 p){

    }
  }
  vec2 tilt = (hash22(mc + 3.7) - 0.5) * (0.5 + 1.6 * uWarp);
  vec3 nrm = normalize(vec3(tilt * 1.4, 0.85));
  vec3 col = backdrop(uv * 1.6 + tilt);
  float facet = sat(dot(nrm, normalize(vec3(0.45, 0.7, 0.55))));
  float spec = pow(facet, 22.0);
  col *= 0.22 + 1.05 * facet;
  col += palN(hash12(mc + 9.1) * 0.6 + 0.2) * spec * 0.8;
  col *= 0.5 + 0.7 * sat(1.0 - md * 1.6);
  float w = fwidth(edge) * 1.4 + 1e-5;
  float line = 1.0 - smoothstep(0.0, w * (1.0 + uLineWidth * 1.2), edge);
  col += palN(hash12(mc) * 0.8 + 0.1) * line * (0.6 + 1.5 * uBeat);
  col *= 0.7 + 0.5 * sat(1.5 - length(uv));
  return col;
}`};

/* ------------------------------------------------------------------ 16 */
SCENES.ribbon = { label: 'SPECTRUM RIBBONS', src: `
vec3 scene(vec2 uv){
  vec3 col = vec3(0.0);
  int N = int(clamp(uComplexity * 1.6 + 2.0, 3.0, 16.0));
  for(int i = 0; i < 16; i++){
    if(i >= N) break;
    float fn = float(i) / float(N);
    float depth = 0.45 + fn * 1.7;
    vec2 q = uv * depth;
    q.y += (fn - 0.5) * 0.55 * depth;
    float f = 1.6 + uDensity * 0.1 + fn * 2.0;
    float ph = TAU * uPhase * nCyc(1.0 + floor(fn * 3.0)) + fn * TAU;
    float amp = (0.22 + 0.16 * sin(fn * 8.0)) * (1.0 + 0.7 * uBeat * uZoomPulse) * (0.5 + uMorph);
    float y  = amp * sin(q.x * f + ph) + 0.4 * amp * sin(q.x * f * 2.3 - ph * 2.0);
    float dy = amp * f * cos(q.x * f + ph) + 0.4 * amp * f * 2.3 * cos(q.x * f * 2.3 - ph * 2.0);
    float d = abs(q.y - y) / sqrt(1.0 + dy * dy);
    float w = (0.006 + 0.016 * uLineWidth) * depth;
    float br = w / (d + w * 0.6);
    vec3 c = pal(fn * 0.8 + 0.12 + 0.1 * sin(q.x * 0.6 + ph));
    col += c * pow(br, 1.35) * 0.55 / depth;
    col += palN(fn * 0.8 + 0.4) * pow(br, 4.0) * 0.5 / depth;
  }
  col += pal(0.58) * 0.03 * sat(1.4 - abs(uv.y) * 2.0);
  return col;
}`};

/* ==========================================================================
   POST-PROCESSING
   ========================================================================== */

const POST_COMMON = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uRes;
float sat(float x){ return clamp(x, 0.0, 1.0); }
mat2 rot2(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
`;

/* trail / feedback accumulation */
const FRAG_TRAIL = POST_COMMON + `
uniform sampler2D uScene;
uniform sampler2D uPrev;
uniform float uDecay;
uniform float uZoom;
uniform float uRot;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 c = (uv - 0.5);
  c = rot2(uRot) * c / uZoom;
  vec3 prev = texture(uPrev, c + 0.5).rgb * uDecay;
  vec3 cur  = texture(uScene, uv).rgb;
  fragColor = vec4(max(cur, prev), 1.0);
}`;

/* bright-pass prefilter with soft knee */
const FRAG_PREFILTER = POST_COMMON + `
uniform sampler2D uTex;
uniform float uThreshold;
uniform float uKnee;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 c = texture(uTex, uv).rgb;
  float br = max(c.r, max(c.g, c.b));
  float knee = max(1e-4, uKnee);
  float soft = sat((br - uThreshold + knee) / (2.0 * knee));
  float w = max(br - uThreshold, knee * soft * soft) / max(br, 1e-4);
  fragColor = vec4(c * w, 1.0);
}`;

/* 13-tap downsample (Call of Duty / Jimenez) */
const FRAG_DOWN = POST_COMMON + `
uniform sampler2D uTex;
uniform vec2 uTexel;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 a = texture(uTex, uv + uTexel * vec2(-1.0,  1.0)).rgb;
  vec3 b = texture(uTex, uv + uTexel * vec2( 0.0,  1.0)).rgb;
  vec3 c = texture(uTex, uv + uTexel * vec2( 1.0,  1.0)).rgb;
  vec3 d = texture(uTex, uv + uTexel * vec2(-0.5,  0.5)).rgb;
  vec3 e = texture(uTex, uv + uTexel * vec2( 0.5,  0.5)).rgb;
  vec3 f = texture(uTex, uv + uTexel * vec2(-1.0,  0.0)).rgb;
  vec3 g = texture(uTex, uv).rgb;
  vec3 h = texture(uTex, uv + uTexel * vec2( 1.0,  0.0)).rgb;
  vec3 i = texture(uTex, uv + uTexel * vec2(-0.5, -0.5)).rgb;
  vec3 j = texture(uTex, uv + uTexel * vec2( 0.5, -0.5)).rgb;
  vec3 k = texture(uTex, uv + uTexel * vec2(-1.0, -1.0)).rgb;
  vec3 l = texture(uTex, uv + uTexel * vec2( 0.0, -1.0)).rgb;
  vec3 m = texture(uTex, uv + uTexel * vec2( 1.0, -1.0)).rgb;
  vec3 o = g * 0.125;
  o += (a + c + k + m) * 0.03125;
  o += (b + f + h + l) * 0.0625;
  o += (d + e + i + j) * 0.125;
  fragColor = vec4(o, 1.0);
}`;

/* 9-tap tent upsample, additively blended into the target mip */
const FRAG_UP = POST_COMMON + `
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform float uRadius;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 d = uTexel * uRadius;
  vec3 s = texture(uTex, uv + vec2(-d.x,  d.y)).rgb;
  s += texture(uTex, uv + vec2( 0.0,  d.y)).rgb * 2.0;
  s += texture(uTex, uv + vec2( d.x,  d.y)).rgb;
  s += texture(uTex, uv + vec2(-d.x,  0.0)).rgb * 2.0;
  s += texture(uTex, uv).rgb * 4.0;
  s += texture(uTex, uv + vec2( d.x,  0.0)).rgb * 2.0;
  s += texture(uTex, uv + vec2(-d.x, -d.y)).rgb;
  s += texture(uTex, uv + vec2( 0.0, -d.y)).rgb * 2.0;
  s += texture(uTex, uv + vec2( d.x, -d.y)).rgb;
  fragColor = vec4(s / 16.0, 1.0);
}`;

/* final composite: CA, bloom, grade, tonemap, overlays, grain */
const FRAG_COMPOSITE = POST_COMMON + `
uniform sampler2D uColor;
uniform sampler2D uBloom;
uniform float uBloomAmt;
uniform float uChroma;
uniform float uGrain;
uniform float uVig;
uniform float uExposure;
uniform float uContrast;
uniform float uSaturation;
uniform float uStrobe;
uniform float uBeatSaw;
uniform float uBeat;
uniform float uInvert;
uniform float uTimeAbs;
uniform int   uTonemap;
uniform int   uOverlay;

float hash12(vec2 p){ vec3 p3 = fract(p.xyx * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

vec3 acesFilm(vec3 x){
  vec3 a = x * (x + 0.0245786) - 0.000090537;
  vec3 b = x * (0.983729 * x + 0.4329510) + 0.238081;
  return clamp(a / b, 0.0, 1.0);
}
vec3 tonemap(vec3 c){
  if(uTonemap == 0){
    mat3 mIn = mat3(0.59719, 0.07600, 0.02840,
                    0.35458, 0.90834, 0.13383,
                    0.04823, 0.01566, 0.83777);
    mat3 mOut = mat3( 1.60475, -0.10208, -0.00327,
                     -0.53108,  1.10813, -0.07276,
                     -0.07367, -0.00605,  1.07602);
    return clamp(mOut * acesFilm(mIn * c), 0.0, 1.0);
  } else if(uTonemap == 1){
    vec3 x = c * 1.1;
    return clamp(x / (1.0 + x * 0.72) * 1.18, 0.0, 1.0);
  } else if(uTonemap == 2){
    return clamp(c / (1.0 + c), 0.0, 1.0);
  }
  return clamp(c, 0.0, 1.0);
}
vec3 sampleCA(vec2 uv, float amt){
  vec2 c = uv - 0.5;
  float r2 = dot(c, c);
  vec2 off = c * amt * (0.004 + 0.012 * r2);
  vec3 o;
  o.r = texture(uColor, uv + off).r;
  o.g = texture(uColor, uv).g;
  o.b = texture(uColor, uv - off).b;
  vec3 bl;
  bl.r = texture(uBloom, uv + off * 1.6).r;
  bl.g = texture(uBloom, uv).g;
  bl.b = texture(uBloom, uv - off * 1.6).b;
  return o + bl * uBloomAmt;
}
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 duv = uv;

  if(uOverlay == 2){ // CRT barrel
    vec2 c = duv - 0.5;
    c *= 1.0 + dot(c, c) * 0.09;
    duv = c + 0.5;
  }
  if(uOverlay == 3){ // glitch: beat-locked band displacement
    float band = floor(duv.y * 26.0);
    float trig = step(0.72, hash12(vec2(band, floor(uBeatSaw * 8.0) + 0.5)));
    duv.x += trig * (hash12(vec2(band, 7.3)) - 0.5) * 0.06 * (0.3 + uBeat);
  }
  if(uOverlay == 5){ // feedback echo
    vec2 c = (duv - 0.5) * (1.0 - 0.035) + 0.5;
    duv = mix(duv, c, 0.5);
  }
  duv = clamp(duv, vec2(0.0005), vec2(0.9995));

  vec3 col = sampleCA(duv, uChroma * 3.0 + (uOverlay == 4 ? 1.6 : 0.0));

  if(uOverlay == 4){ // halation: soft red-shifted bleed
    vec3 hb = texture(uBloom, duv).rgb;
    col += hb * vec3(1.0, 0.45, 0.35) * 0.55;
  }
  if(uOverlay == 5){
    col += texture(uBloom, duv * 0.98 + 0.01).rgb * 0.45;
  }

  col *= uExposure;

  // strobe (beat-locked, deterministic → loop safe)
  float gate = step(uStrobe * 0.9, uBeatSaw);
  col *= mix(1.0, gate, uStrobe);
  col *= 1.0 + uStrobe * uBeat * 0.6;

  col = tonemap(col);

  float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = mix(vec3(l), col, uSaturation);
  col = (col - 0.5) * uContrast + 0.5;
  col = clamp(col, 0.0, 1.0);

  if(uOverlay == 1 || uOverlay == 2){
    float sl = 0.5 + 0.5 * sin(gl_FragCoord.y * 3.14159 * 0.85);
    col *= 1.0 - 0.28 * sl;
  }
  if(uOverlay == 2){
    float mask = 0.82 + 0.18 * sin(gl_FragCoord.x * 2.0944);
    col *= mask;
    vec2 e = abs(duv - 0.5) * 2.0;
    float frame = 1.0 - smoothstep(0.98, 1.0, max(e.x, e.y));
    col *= frame;
  }

  float vg = 1.0 - uVig * dot(uv - 0.5, uv - 0.5) * 1.6;
  col *= sat(vg);

  if(uGrain > 0.001){
    float n = hash12(gl_FragCoord.xy + fract(uTimeAbs) * 431.0);
    col += (n - 0.5) * uGrain * 0.12;
  }

  col = mix(col, 1.0 - col, uInvert);

  // ordered dither to kill banding, then sRGB encode
  float dth = (hash12(gl_FragCoord.xy * 1.7) - 0.5) / 255.0;
  col = pow(clamp(col + dth, 0.0, 1.0), vec3(1.0 / 2.2));
  fragColor = vec4(col, 1.0);
}`;

/* ==========================================================================
   WEBGL2 ENGINE
   ========================================================================== */

const canvas = document.getElementById('gl');
const errBoxHost = document.getElementById('frame');

function fatal(title, msg){
  const box = document.createElement('div');
  box.id = 'errBox';
  box.innerHTML = '<h3>' + title + '</h3>' + msg.replace(/[<>]/g, '');
  errBoxHost.appendChild(box);
  throw new Error(title + ': ' + msg);
}

const gl = canvas.getContext('webgl2', {
  antialias: false, alpha: false, depth: false, stencil: false,
  premultipliedAlpha: false, preserveDrawingBuffer: true,
  powerPreference: 'high-performance'
});
if(!gl) fatal('GEEN WEBGL2', 'Deze browser of GPU ondersteunt WebGL2 niet. Gebruik Chrome, Edge of Firefox op een desktop met hardwareversnelling aan.');

const EXT_CBF = gl.getExtension('EXT_color_buffer_float');
const HDR_FMT = EXT_CBF ? gl.RGBA16F : gl.RGBA8;
const HDR_TYPE = EXT_CBF ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

(function reportGpu(){
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  let name = 'WebGL2';
  if(dbg) name = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || name;
  const el = document.getElementById('gpuName');
  el.textContent = (name.length > 34 ? name.slice(0, 34) + '…' : name) + (EXT_CBF ? ' · HDR' : ' · LDR');
  el.title = name;
})();

/* ---- program helpers --------------------------------------------------- */
function compile(type, src, tag){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
    const log = gl.getShaderInfoLog(sh) || '';
    gl.deleteShader(sh);
    fatal('SHADER FOUT · ' + tag, log);
  }
  return sh;
}
function program(fragSrc, tag){
  const p = gl.createProgram();
  const vs = compile(gl.VERTEX_SHADER, VERT, tag + ':vert');
  const fs = compile(gl.FRAGMENT_SHADER, fragSrc, tag + ':frag');
  gl.attachShader(p, vs); gl.attachShader(p, fs);
  gl.linkProgram(p);
  gl.deleteShader(vs); gl.deleteShader(fs);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
    const log = gl.getProgramInfoLog(p) || '';
    gl.deleteProgram(p);
    fatal('LINK FOUT · ' + tag, log);
  }
  p._loc = new Map();
  return p;
}
function loc(p, name){
  let l = p._loc.get(name);
  if(l === undefined){ l = gl.getUniformLocation(p, name); p._loc.set(name, l); }
  return l;
}
const u1f = (p, n, v) => gl.uniform1f(loc(p, n), v);
const u1i = (p, n, v) => gl.uniform1i(loc(p, n), v);
const u2f = (p, n, a, b) => gl.uniform2f(loc(p, n), a, b);
const u3f = (p, n, a, b, c) => gl.uniform3f(loc(p, n), a, b, c);

const vao = gl.createVertexArray();
const draw = () => { gl.bindVertexArray(vao); gl.drawArrays(gl.TRIANGLES, 0, 3); };

/* ---- scene program cache ---------------------------------------------- */
const sceneProgs = new Map();
function sceneProgram(mode){
  if(sceneProgs.has(mode)) return sceneProgs.get(mode);
  const def = SCENES[mode];
  if(!def) return sceneProgram('tunnel');
  const p = program(PRELUDE + def.src + EPILOGUE, 'scene/' + mode);
  sceneProgs.set(mode, p);
  return p;
}

const progTrail = program(FRAG_TRAIL, 'trail');
const progPre   = program(FRAG_PREFILTER, 'prefilter');
const progDown  = program(FRAG_DOWN, 'downsample');
const progUp    = program(FRAG_UP, 'upsample');
const progComp  = program(FRAG_COMPOSITE, 'composite');

/* ---- render targets ---------------------------------------------------- */
function makeTarget(w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, HDR_FMT, w, h, 0, gl.RGBA, HDR_TYPE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE)
    fatal('FRAMEBUFFER FOUT', 'Kon geen render target van ' + w + '×' + h + ' maken.');
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fbo, w, h };
}
function freeTarget(t){ if(!t) return; gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); }

let RW = 0, RH = 0;
let tScene = null, tTrailA = null, tTrailB = null;
let bloomMips = [];

function allocTargets(w, h){
  w = Math.max(16, Math.round(w)); h = Math.max(16, Math.round(h));
  if(w === RW && h === RH) return;
  RW = w; RH = h;
  canvas.width = w; canvas.height = h;

  freeTarget(tScene); freeTarget(tTrailA); freeTarget(tTrailB);
  bloomMips.forEach(freeTarget);

  tScene  = makeTarget(w, h);
  tTrailA = makeTarget(w, h);
  tTrailB = makeTarget(w, h);

  bloomMips = [];
  const levels = Math.max(3, Math.min(7, Math.floor(Math.log2(Math.min(w, h))) - 3));
  let mw = w, mh = h;
  for(let i = 0; i < levels; i++){
    mw = Math.max(2, Math.floor(mw / 2));
    mh = Math.max(2, Math.floor(mh / 2));
    bloomMips.push(makeTarget(mw, mh));
  }
  clearTrails();
  document.getElementById('hudRes').textContent = w + '×' + h;
}
function clearTrails(){
  [tTrailA, tTrailB, tScene].forEach(t => {
    if(!t) return;
    gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);
    gl.viewport(0, 0, t.w, t.h);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
  });
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

function bindTex(unit, tex){
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
}
function target(t){
  gl.bindFramebuffer(gl.FRAMEBUFFER, t ? t.fbo : null);
  const w = t ? t.w : RW, h = t ? t.h : RH;
  gl.viewport(0, 0, w, h);
  return [w, h];
}

/* ---- colour conversion ------------------------------------------------- */
function srgbToLinear(hex){
  const n = parseInt(hex.slice(1), 16);
  const f = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return [f((n >> 16) & 255), f((n >> 8) & 255), f(n & 255)];
}

/* ---- timing ------------------------------------------------------------ */
let tAbs = 0;            // seconds on the loop timeline (may be negative during pre-roll)
let frameNo = 0;
let playing = true;
let rafId = null;
let lastTs = null;
let fpsAcc = 0, fpsFrames = 0, fpsShown = 0;

function loopPhase(){
  const L = Math.max(0.5, P.loopDuration);
  let ph = (tAbs / L) % 1;
  if(ph < 0) ph += 1;
  return ph;
}

/* ---- the pipeline ------------------------------------------------------ */
function renderFrame(){
  const ph = loopPhase();
  const beats = Math.max(1, Math.round(P.bpm / 60 * P.loopDuration));
  const beatSaw = (ph * beats) % 1;
  const pulse = Math.pow(1 - beatSaw, 3.2);
  const beat = 0.5 + (pulse - 0.5) * P.beatPunch;   // punch 0 = steady, 1 = hard flash

  /* 1 · scene into HDR buffer */
  const prog = sceneProgram(P.visualMode);
  gl.useProgram(prog);
  target(tScene);
  u2f(prog, 'uRes', RW, RH);
  u1f(prog, 'uTime', tAbs);
  u1f(prog, 'uPhase', ph);
  u1f(prog, 'uLoop', P.loopDuration);
  u1f(prog, 'uBeat', beat);
  u1f(prog, 'uBeatSaw', beatSaw);
  u1f(prog, 'uBeats', beats);
  const c1 = srgbToLinear(P.color1), c2 = srgbToLinear(P.color2), c3 = srgbToLinear(P.color3);
  u3f(prog, 'uC1', c1[0], c1[1], c1[2]);
  u3f(prog, 'uC2', c2[0], c2[1], c2[2]);
  u3f(prog, 'uC3', c3[0], c3[1], c3[2]);
  u1f(prog, 'uSpeed', P.speed);
  u1f(prog, 'uZoomPulse', P.zoomPulse);
  u1f(prog, 'uRotation', P.rotation);
  u1f(prog, 'uMorph', P.morph);
  u1f(prog, 'uHue', P.hueShift);
  u1f(prog, 'uDensity', P.density);
  u1f(prog, 'uLineWidth', P.lineWidth);
  u1f(prog, 'uPersp', P.perspective);
  u1f(prog, 'uComplexity', P.complexity);
  u1f(prog, 'uFractal', P.fractalZoom);
  u1f(prog, 'uWarp', P.warp);
  u1f(prog, 'uKaleido', P.kaleido);
  u2f(prog, 'uMirror', P.symmetry ? 1 : 0, P.symmetryY ? 1 : 0);
  draw();

  /* 2 · optional feedback trails */
  let colorTex = tScene.tex;
  if(P.trails > 0.005){
    gl.useProgram(progTrail);
    target(tTrailB);
    u2f(progTrail, 'uRes', RW, RH);
    u1f(progTrail, 'uDecay', P.trails);
    u1f(progTrail, 'uZoom', 1 + 0.02 * P.trailZoom);
    u1f(progTrail, 'uRot', 0.012 * P.trailZoom);
    bindTex(0, tScene.tex);  u1i(progTrail, 'uScene', 0);
    bindTex(1, tTrailA.tex); u1i(progTrail, 'uPrev', 1);
    draw();
    const tmp = tTrailA; tTrailA = tTrailB; tTrailB = tmp;
    colorTex = tTrailA.tex;
  }

  /* 3 · bloom: bright pass → downsample chain → additive tent upsample */
  const bloomOn = (P.glow > 0.01 || P.overlayMode === 4 || P.overlayMode === 5) && bloomMips.length > 1;
  if(bloomOn){
    gl.disable(gl.BLEND);
    gl.useProgram(progPre);
    let [w, h] = target(bloomMips[0]);
    u2f(progPre, 'uRes', w, h);
    u1f(progPre, 'uThreshold', 0.55);
    u1f(progPre, 'uKnee', 0.35);
    bindTex(0, colorTex); u1i(progPre, 'uTex', 0);
    draw();

    gl.useProgram(progDown);
    for(let i = 1; i < bloomMips.length; i++){
      const src = bloomMips[i - 1], dst = bloomMips[i];
      const [dw, dh] = target(dst);
      u2f(progDown, 'uRes', dw, dh);
      u2f(progDown, 'uTexel', 1 / src.w, 1 / src.h);
      bindTex(0, src.tex); u1i(progDown, 'uTex', 0);
      draw();
    }

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(progUp);
    for(let i = bloomMips.length - 1; i > 0; i--){
      const src = bloomMips[i], dst = bloomMips[i - 1];
      const [dw, dh] = target(dst);
      u2f(progUp, 'uRes', dw, dh);
      u2f(progUp, 'uTexel', 1 / src.w, 1 / src.h);
      u1f(progUp, 'uRadius', 1 + P.bloomRadius);
      bindTex(0, src.tex); u1i(progUp, 'uTex', 0);
      draw();
    }
    gl.disable(gl.BLEND);
  }

  /* 4 · composite to the canvas */
  gl.useProgram(progComp);
  target(null);
  u2f(progComp, 'uRes', RW, RH);
  bindTex(0, colorTex); u1i(progComp, 'uColor', 0);
  bindTex(1, bloomOn ? bloomMips[0].tex : tScene.tex); u1i(progComp, 'uBloom', 1);
  u1f(progComp, 'uBloomAmt', bloomOn ? P.glow / 18 : 0);
  u1f(progComp, 'uChroma', P.chroma);
  u1f(progComp, 'uGrain', P.grain);
  u1f(progComp, 'uVig', P.vignette);
  u1f(progComp, 'uExposure', P.brightness);
  u1f(progComp, 'uContrast', P.contrast);
  u1f(progComp, 'uSaturation', P.saturation);
  u1f(progComp, 'uStrobe', P.strobe);
  u1f(progComp, 'uBeatSaw', beatSaw);
  u1f(progComp, 'uBeat', beat);
  u1f(progComp, 'uInvert', P.invert ? 1 : 0);
  u1f(progComp, 'uTimeAbs', tAbs);
  u1i(progComp, 'uTonemap', P.tonemap);
  u1i(progComp, 'uOverlay', P.overlayMode);
  draw();

  frameNo++;
  document.getElementById('beatFill').style.width = (beatSaw * 100).toFixed(1) + '%';
  if((frameNo & 7) === 0){
    document.getElementById('stPhase').textContent = ph.toFixed(2);
    document.getElementById('stFrame').textContent = frameNo;
    document.getElementById('stBeats').textContent = beats;
  }
}

/* pre-roll so feedback trails are already in steady state at phase 0 */
function prerollTrails(seconds){
  if(P.trails <= 0.005) return;
  const steps = Math.min(90, Math.round(seconds * 30));
  const save = tAbs;
  for(let i = steps; i > 0; i--){
    tAbs = save - i / 30;
    renderFrame();
  }
  tAbs = save;
}

function tick(ts){
  if(!playing){ rafId = null; return; }
  if(lastTs === null) lastTs = ts;
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;
  tAbs += dt;
  renderFrame();

  fpsAcc += dt; fpsFrames++;
  if(fpsAcc > 0.5){
    fpsShown = Math.round(fpsFrames / fpsAcc);
    document.getElementById('hudFps').textContent = fpsShown;
    fpsAcc = 0; fpsFrames = 0;
  }
  rafId = requestAnimationFrame(tick);
}
function startLoop(){
  if(rafId === null && playing){ lastTs = null; rafId = requestAnimationFrame(tick); }
}

/* ---- sizing ----------------------------------------------------------- */
function exportSize(){
  const parts = P.resolution.split('x');
  return [parseInt(parts[0], 10), parseInt(parts[1], 10)];
}
function applyPreviewSize(){
  const [ew, eh] = exportSize();
  const frame = el('frame');
  frame.style.aspectRatio = ew + ' / ' + eh;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const avail = Math.max(240, frame.clientWidth * dpr);
  const scale = Math.min(1, avail / ew) * P.quality;
  allocTargets(Math.round(ew * scale), Math.round(eh * scale));
}

function stamp(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}
function fileName(ext){ return 'vjloop_' + currentScene + '_' + P.loopDuration + 's_' + stamp() + '.' + ext; }
function download(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
}

function countdown(total){
  clearInterval(cdTimer);
  const start = performance.now();
  const tickCd = () => {
    const left = Math.max(0, Math.ceil(total - (performance.now() - start) / 1000));
    el('recCountdown').textContent = '(' + left + 's)';
  };
  tickCd();
  cdTimer = setInterval(tickCd, 250);
}

function beginExport(){
  playing = false;
  if(rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }
  const [w, h] = exportSize();
  allocTargets(w, h);
  tAbs = 0; frameNo = 0;
  clearTrails();
  prerollTrails(2);
}
function endExport(){
  clearInterval(cdTimer);
  recUI(false);
  rec = { active: false };
  applyPreviewSize();
  clearTrails();
  playing = true;
  el('playBtn').textContent = '⏸ Pause';
  startLoop();
}

/* ---- WEBM (MediaRecorder, realtime capture) --------------------------- */
function recordWebm(){
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
    .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  if(!mime){ toast('WEBM NIET ONDERSTEUND'); return; }

  beginExport();
  const stream = canvas.captureStream(FPS);
  const chunks = [];
  const mr = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12000000 });
  mr.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = () => {
    stream.getTracks().forEach(tr => tr.stop());
    download(new Blob(chunks, { type: 'video/webm' }), fileName('webm'));
    toast('WEBM OPGESLAGEN');
    endExport();
  };
  rec = { active: true, mode: 'webm', mr: mr, raf: null };
  recUI(true, 'RECORDING WEBM');
  countdown(P.loopDuration);
  mr.start(100);

  let last = null;
  const step = ts => {
    if(!rec.active) return;
    if(last === null) last = ts;
    tAbs += Math.min((ts - last) / 1000, 0.05);
    last = ts;
    renderFrame();
    if(tAbs >= P.loopDuration){ stopRecording(); return; }
    rec.raf = requestAnimationFrame(step);
  };
  rec.raf = requestAnimationFrame(step);
}

/* ---- MP4 (WebCodecs, frame-exact fixed timestep) ---------------------- */
async function recordMp4(){
  if(!window.VideoEncoder){
    toast('MP4 VEREIST CHROME/EDGE 94+');
    exportFormat = 'webm'; syncFormatUI();
    recordWebm();
    return;
  }
  if(!window.Mp4Muxer){
    toast('MP4-MUXER NIET GELADEN');
    return;
  }
  beginExport();
  const [w, h] = exportSize();
  const { Muxer, ArrayBufferTarget } = window.Mp4Muxer;
  const tgt = new ArrayBufferTarget();
  const mux = new Muxer({
    target: tgt,
    video: { codec: 'avc', width: w, height: h, frameRate: FPS },
    fastStart: 'in-memory',
    firstTimestampBehavior: 'offset',
  });
  const enc = new VideoEncoder({
    output: (chunk, meta) => mux.addVideoChunk(chunk, meta),
    error: e => { console.error(e); toast('ENCODER FOUT'); },
  });
  try {
    await enc.configure({
      codec: 'avc1.640034',
      width: w, height: h,
      bitrate: 16000000,
      framerate: FPS,
      latencyMode: 'quality',
    });
  } catch(e){
    console.error(e);
    toast('MP4 CONFIG FOUT — VAL TERUG OP WEBM');
    exportFormat = 'webm'; syncFormatUI();
    endExport();
    recordWebm();
    return;
  }

  const total = Math.round(P.loopDuration * FPS);
  let n = 0;
  rec = { active: true, mode: 'mp4', raf: null, finalize: null };
  recUI(true, 'ENCODING MP4 0%');
  countdown(P.loopDuration);

  const finalize = async () => {
    if(!rec.active) return;
    rec.active = false;
    if(rec.raf) cancelAnimationFrame(rec.raf);
    el('recLabel').textContent = 'FINALIZING…';
    try {
      await enc.flush();
      mux.finalize();
      download(new Blob([tgt.buffer], { type: 'video/mp4' }), fileName('mp4'));
      toast('MP4 OPGESLAGEN');
    } catch(e){
      console.error(e);
      toast('MP4 EXPORT MISLUKT');
    }
    endExport();
  };
  rec.finalize = finalize;

  const step = () => {
    if(!rec.active) return;
    tAbs = n / FPS;
    renderFrame();
    const frame = new VideoFrame(canvas, {
      timestamp: Math.round(n * 1e6 / FPS),
      duration: Math.round(1e6 / FPS),
    });
    enc.encode(frame, { keyFrame: n % (FPS * 2) === 0 });
    frame.close();
    n++;
    if(n % 10 === 0) el('recLabel').textContent = 'ENCODING MP4 ' + Math.round(n / total * 100) + '%';
    if(n >= total){ finalize(); return; }
    rec.raf = requestAnimationFrame(step);
  };
  rec.raf = requestAnimationFrame(step);
}

/* ---- PNG still -------------------------------------------------------- */
function exportPng(){
  const savedT = tAbs, wasPlaying = playing;
  playing = false;
  if(rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }
  const [w, h] = exportSize();
  allocTargets(w, h);
  tAbs = savedT;
  prerollTrails(2);
  renderFrame();
  canvas.toBlob(blob => {
    if(blob){ download(blob, fileName('png')); toast('PNG OPGESLAGEN'); }
    applyPreviewSize();
    tAbs = savedT;
    playing = wasPlaying;
    if(playing) startLoop(); else renderFrame();
  }, 'image/png');
}

function startRecording(){
  if(rec.active) return;
  if(exportFormat === 'png') exportPng();
  else if(exportFormat === 'mp4') recordMp4();
  else recordWebm();
}
function stopRecording(){
  if(!rec.active) return;
  if(rec.mode === 'mp4'){ if(rec.finalize) rec.finalize(); return; }
  rec.active = false;
  if(rec.raf) cancelAnimationFrame(rec.raf);
  if(rec.mr && rec.mr.state === 'recording') rec.mr.stop();
  else endExport();
}
function syncFormatUI(){
  for(const b of el('fmtSeg').children) b.classList.toggle('on', b.dataset.fmt === exportFormat);
  el('recBtn').textContent = exportFormat === 'png' ? '⇩ Export frame' : '⏺ Record loop';
}

/* ==========================================================================
   SHAREABLE STATE
   ========================================================================== */
function stateToString(){
  const o = { s: currentScene, t: el('tonemap').value, o: el('overlayMode').value,
    l: el('loopDuration').value, r: el('resolution').value, p: el('palette').value,
    c: [el('color1').value, el('color2').value, el('color3').value],
    k: CHECK_IDS.map(id => el(id).checked ? 1 : 0), v: {} };
  for(const id of RANGE_IDS) o.v[id] = el(id).value;
  return btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function stateFromString(str){
  let o;
  try { o = JSON.parse(decodeURIComponent(escape(atob(str)))); } catch(e){ return false; }
  if(!o || typeof o !== 'object') return false;
  if(o.v) for(const id of RANGE_IDS) if(o.v[id] !== undefined) el(id).value = o.v[id];
  if(o.k) CHECK_IDS.forEach((id, i) => { el(id).checked = !!o.k[i]; });
  if(o.t !== undefined) el('tonemap').value = o.t;
  if(o.o !== undefined) el('overlayMode').value = o.o;
  if(o.l !== undefined) el('loopDuration').value = o.l;
  if(o.r !== undefined) el('resolution').value = o.r;
  if(o.p !== undefined) el('palette').value = o.p;
  if(o.c){ el('color1').value = o.c[0]; el('color2').value = o.c[1]; el('color3').value = o.c[2]; }
  if(o.s && SCENES[o.s]) currentScene = o.s;
  return true;
}
function copyLink(){
  const url = location.origin + location.pathname + '#' + stateToString();
  const done = () => toast('LINK GEKOPIEERD');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done, () => { location.hash = stateToString(); toast('LINK IN ADRESBALK'); });
  } else {
    location.hash = stateToString();
    toast('LINK IN ADRESBALK');
  }
}

/* ==========================================================================
   WIRING
   ========================================================================== */
function bindControls(){
  for(const id of RANGE_IDS){
    el(id).addEventListener('input', () => { updateParam(); if(!playing) renderFrame(); });
  }
  for(const id of CHECK_IDS){
    el(id).addEventListener('change', () => { updateParam(); if(!playing) renderFrame(); });
  }
  for(const id of ['tonemap', 'overlayMode']){
    el(id).addEventListener('change', () => { updateParam(); if(!playing) renderFrame(); });
  }
  for(const id of ['color1', 'color2', 'color3']){
    el(id).addEventListener('input', () => {
      el('palette').value = 'custom';
      for(const b of el('swatches').children) b.classList.remove('on');
      updateParam();
      if(!playing) renderFrame();
    });
  }
  el('palette').addEventListener('change', applyPalette);
  el('loopDuration').addEventListener('change', () => { updateParam(); clearTrails(); if(!playing) renderFrame(); });
  el('resolution').addEventListener('change', () => { updateParam(); applyPreviewSize(); if(!playing) renderFrame(); });
  el('quality').addEventListener('change', () => { updateParam(); applyPreviewSize(); if(!playing) renderFrame(); });

  for(const b of document.querySelectorAll('.rnd-btn')){
    b.addEventListener('click', () => randomizeSection(b.dataset.rnd));
  }
  el('randomAllBtn').addEventListener('click', randomizeAll);
  el('copyLinkBtn').addEventListener('click', copyLink);

  el('playBtn').addEventListener('click', () => {
    playing = !playing;
    el('playBtn').textContent = playing ? '⏸ Pause' : '▶ Play';
    if(playing) startLoop();
  });
  el('resetBtn').addEventListener('click', () => {
    tAbs = 0; frameNo = 0; lastTs = null;
    clearTrails();
    renderFrame();
  });
  el('recBtn').addEventListener('click', startRecording);
  el('stopBtn').addEventListener('click', stopRecording);
  for(const b of el('fmtSeg').children){
    b.addEventListener('click', () => { exportFormat = b.dataset.fmt; syncFormatUI(); });
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { applyPreviewSize(); if(!playing) renderFrame(); }, 180);
  });

  document.addEventListener('keydown', e => {
    if(e.target.matches('input, select, textarea')) return;
    if(e.code === 'Space'){ e.preventDefault(); el('playBtn').click(); }
    else if(e.key === 'r' || e.key === 'R'){ rec.active ? stopRecording() : startRecording(); }
    else if(e.key === 'n' || e.key === 'N'){ randomizeAll(); }
    else if(e.key === '['){ cycleScene(-1); }
    else if(e.key === ']'){ cycleScene(1); }
    else if(e.key === 'f' || e.key === 'F'){
      const f = el('frame');
      if(document.fullscreenElement) document.exitFullscreen();
      else if(f.requestFullscreen) f.requestFullscreen();
    }
  });

  canvas.addEventListener('webglcontextlost', e => {
    e.preventDefault();
    playing = false;
    toast('WEBGL CONTEXT VERLOREN — HERLAAD DE PAGINA');
  });
}

/* ---- collapsible sidebar (desktop in-flow, mobile overlay) ------------ */
const EXPANDED_ON_LOAD_FOR_DESKTOP = true;
const EXPANDED_ON_LOAD_FOR_MOBILE  = false;

function initSidebar(){
  const sidebar = el('sidebar');
  const toggle  = el('sidebar-toggle');
  const overlay = el('sidebar-overlay');
  const main    = el('main');

  function afterResize(){ setTimeout(() => { applyPreviewSize(); if(!playing) renderFrame(); }, 280); }
  function collapse(){
    sidebar.classList.add('collapsed');
    document.body.classList.remove('sidebar-open');
    toggle.innerHTML = '&#x25BA;';
    toggle.title = 'Paneel uitklappen';
    overlay.classList.add('hidden');
    afterResize();
  }
  function expand(){
    sidebar.classList.remove('collapsed');
    document.body.classList.add('sidebar-open');
    toggle.innerHTML = '&#x25C4;';
    toggle.title = 'Paneel inklappen';
    if(window.innerWidth <= 860) overlay.classList.remove('hidden');
    afterResize();
  }
  const isMobile = window.innerWidth <= 860;
  if(isMobile ? !EXPANDED_ON_LOAD_FOR_MOBILE : !EXPANDED_ON_LOAD_FOR_DESKTOP) collapse();
  else expand();

  toggle.addEventListener('click', e => {
    e.stopPropagation();
    sidebar.classList.contains('collapsed') ? expand() : collapse();
  });
  overlay.addEventListener('click', collapse);
  main.addEventListener('click', () => {
    if(window.innerWidth <= 860 && !sidebar.classList.contains('collapsed')) collapse();
  });
}

/* ---- boot ------------------------------------------------------------- */
(function boot(){
  buildPalettes();
  buildPresets();
  const restored = location.hash.length > 1 ? stateFromString(location.hash.slice(1)) : false;
  buildSceneGrid();
  bindControls();
  syncFormatUI();
  if(!restored) applyPalette();
  for(const b of el('swatches').children) b.classList.toggle('on', b.dataset.pal === el('palette').value);
  updateParam();
  initSidebar();
  applyPreviewSize();
  renderFrame();
  startLoop();
})();

</script>
